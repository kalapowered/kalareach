[package]
name = "companion-preview"
description = "The KalaReach companion's opener for a sealed notification preview, small enough for a phone's notification extension to link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The Android receiver reaches it through the platform library. The iOS notification extension links
# a static library of this crate, which carries no more than it and what it depends on; the build of
# that library asks for the crate type itself, so no other build archives one.
[lib]
crate-type = ["rlib"]

[dependencies]
base64.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

# The workspace forbids unsafe code, which a C function Swift finds by its name cannot honour. This
# crate denies unsafe code and allows it on exactly those functions, in `ios`.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
# The host's own sealing, so a test opens what the host seals.
kr-delivery.workspace = true
