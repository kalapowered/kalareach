[package]
name = "companion-tauri"
description = "The KalaReach companion application's native backend: the named commands the WebView may call, and nothing else"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The desktop binary and the tests share one library. `cdylib` is what the mobile targets link.
name = "companion_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kalareach-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
kr-cbor.workspace = true
# The shared native client: sessions, cursors, drafts, controls and the upload path. The projected
# screen it can also paint is a desktop window's; see the target table below.
kr-client.workspace = true
kr-crypto.workspace = true
# Where the host on this machine keeps its runtime directory and its controller endpoint.
kr-ipc.workspace = true
# The candidate's attempt budget, kept on this computer's disk under its own secret store.
kr-pairing.workspace = true
kr-protocol.workspace = true
kr-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The name this computer offers a host it pairs with.
sysinfo.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true

# The three desktop targets. A desktop window paints a local terminal view; a phone has no local
# terminal, and reads a host's projection as protocol values and draws them itself, so the mobile
# builds take the shared client without the part that measures a screen with a terminal state
# library.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
kr-client = { workspace = true, features = ["terminal"] }
kr-term.workspace = true
opus.workspace = true
opusic-sys.workspace = true
webrtc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The platform user-verification ceremony section 10 asks for on an unlocked owner device.
block2.workspace = true
coreaudio-rs.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { workspace = true, features = ["std", "LAContext", "LAError", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Hello, the owner's confirmation on Windows.
windows = { workspace = true, features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future.workspace = true

[features]
# What `tauri build` turns on, and what a release build must have: the interface comes from the
# bundle rather than from a development server.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# The pairing suite runs this computer against kr-controller's in-process daemon, whose test
# support it includes by path.
iroh.workspace = true
kr-controller = { workspace = true, features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
kr-transport.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The mock runtime, so a test can call a command the way the page does: through the invoke path.
tauri = { workspace = true, features = ["test"] }

# The workspace forbids unsafe code, which the macOS user-verification ceremony cannot honour: it
# is a call into Apple's LocalAuthentication runtime and there is no safe wrapper for it. This
# crate denies it instead and allows it in exactly one function, in `verify`. Nothing else here may
# relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
