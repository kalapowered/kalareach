[package]
name = "companion-tauri"
description = "The KalaReach companion application's native backend: the named commands the WebView may call, and nothing else"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The desktop binary and the tests share one library. `cdylib` is what the mobile targets link.
name = "companion_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kalareach-companion"
path = "src/main.rs"

# Opens real windows to hold what the web view does with the navigation handlers, so it has its own
# main thread.
[[test]]
name = "navigation"
harness = false

# Opens a real window whose page listens for the host's events the way the interface does, so it
# has its own main thread too.
[[test]]
name = "host_events"
harness = false

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
# The one secure store, the Android TLS verifier's start and the browser-backed sign-in session.
companion-platform.workspace = true
kr-cbor.workspace = true
# The shared native client: sessions, cursors, drafts, controls, the upload path and the projected
# screen's painter, which measures text with the pinned width model on every platform.
kr-client.workspace = true
kr-crypto.workspace = true
# Where the host on this machine keeps its runtime directory and its controller endpoint.
kr-ipc.workspace = true
# The candidate's attempt budget, kept on this computer's disk under its own secret store.
kr-pairing.workspace = true
kr-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The name this computer offers a host it pairs with.
sysinfo.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true
# The desktop sign-in's loopback listener reads one request and writes one page.
tokio = { workspace = true, features = ["io-util", "net"] }
tracing.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The platform user-verification ceremony section 10 asks for on an unlocked owner device.
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { workspace = true, features = ["std", "LAContext", "LAError", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Hello, the owner's confirmation on Windows.
windows = { workspace = true, features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
# `std` is what lets a ceremony await Windows Hello's answer rather than block on it.
windows-future = { workspace = true, features = ["std"] }

[features]
# What `tauri build` turns on, and what a release build must have: the interface comes from the
# bundle rather than from a development server.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# The pinned width model, which a test measures a placed run against.
kr-width.workspace = true
# The pairing suite runs this computer against kr-controller's in-process daemon, whose test
# support it includes by path.
iroh.workspace = true
kr-controller = { workspace = true, features = ["testing"] }
# The description host's test catalogue and the conditions it reads, which the setup card's suite
# places under the in-process daemon.
kr-describe = { workspace = true, features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
kr-transport.workspace = true
tempfile.workspace = true
# Paused time, so the phone session's waits run in a test without taking that long, and the
# pairing suite's multi-threaded runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The mock runtime, so a test can call a command the way the page does: through the invoke path.
tauri = { workspace = true, features = ["test"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# A window of the test's own, with safe code, for Windows Hello's dialog to belong to.
tao.workspace = true

# The workspace forbids unsafe code, which the macOS user-verification ceremony cannot honour: it
# is a call into Apple's LocalAuthentication runtime and there is no safe wrapper for it. This
# crate denies it instead and allows it in exactly one function, in `verify`. Nothing else here may
# relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
