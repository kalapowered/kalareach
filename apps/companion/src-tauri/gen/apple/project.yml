name: companion-tauri
options:
  bundleIdPrefix: to.kala.reach.companion
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: KalaReach
      PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  # The notification extension. It is a separate process with its own binary, started by the
  # system when a notification arrives, with no application and no JavaScript context running.
  KalaReachNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../native/ios/NotificationService
      - path: ../../../native/ios/Shared
    info:
      path: ../../../native/ios/NotificationService/Info.plist
    entitlements:
      path: ../../../native/ios/NotificationService/KalaReachNotificationService.entitlements
    settings:
      base:
        PRODUCT_NAME: KalaReachNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion.notifications
        INFOPLIST_FILE: ../../../native/ios/NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../../native/ios/NotificationService/KalaReachNotificationService.entitlements
        SKIP_INSTALL: true

  # The native decisions, built and run without the application, so the four cases the
  # specification names are exercised by a test rather than by a device nobody has.
  KalaReachNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../../native/ios/Tests
      - path: ../../../native/ios/Shared
      - path: ../../../native/ios/KalaReachNative
    settings:
      base:
        PRODUCT_NAME: KalaReachNativeTests
        PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion.native-tests
        GENERATE_INFOPLIST_FILE: true
    # Its own scheme, with no host application: these are decisions about a payload and a clock,
    # and running them must not need the whole application to link first.
    scheme:
      testTargets:
        - KalaReachNativeTests

  companion-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: companion-tauri_iOS
      # The native half of the application: push registration, secure keys, the audio session,
      # the share sheet and the signing rule. Hand written, and kept outside this generated
      # directory so regenerating the project never touches it.
      - path: ../../../native/ios/KalaReachNative
      - path: ../../../native/ios/Shared
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: companion-tauri_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # The interface offers the platform's camera and photo pickers, and iOS refuses to show
        # either without the application saying in its own words what it wants them for.
        NSCameraUsageDescription:
          Take a photo to attach it to a session on one of your hosts.
        NSPhotoLibraryUsageDescription:
          Choose a photo or a video to attach it to a session on one of your hosts.
        NSMicrophoneUsageDescription:
          Speak to a session on one of your hosts.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: ../../../native/ios/App/companion-tauri_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - target: KalaReachNotificationService
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a