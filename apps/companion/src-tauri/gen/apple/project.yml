name: companion-tauri
options:
  bundleIdPrefix: to.kala.reach.companion
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
# Native WebRTC, as a prebuilt binary framework. Section 15 paragraph 2 requires native WebRTC and
# native platform audio to own capture and playback, so the application links the framework itself
# rather than reaching a WebView's `getUserMedia`. It is pinned by revision rather than by tag:
# a tag can be moved upstream and a revision cannot, and that revision's own manifest fixes the
# binary's address and its SHA-256.
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    revision: 4266157cd08f92115de885ab12d87196a8db87e1
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: KalaReach
      PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  # The notification extension. It is a separate process with its own binary, started by the
  # system when a notification arrives, with no application and no JavaScript context running.
  KalaReachNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../native/ios/NotificationService
      - path: ../../../native/ios/Shared
    # The description is written here rather than kept as a file beside the Swift, because the
    # project generator rewrites whatever path this names and would silently replace a hand-written
    # one with its own defaults -- which is how an extension ends up with no extension point and a
    # version its application does not share.
    info:
      path: KalaReachNotificationService/Info.plist
      properties:
        CFBundleDisplayName: KalaReach Notifications
        CFBundlePackageType: XPC!
        # An extension's version has to be its application's, or the system refuses to install it.
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        KRSharedKeychainGroup: $(AppIdentifierPrefix)to.kala.reach.companion.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    # The one thing this extension is entitled to: the access group holding the limited preview
    # key. It is deliberately not the application's own group, so the device authorisation key,
    # which lives there, is out of this process's reach entirely. Written here for the same reason
    # the description above is: the generator owns this file and rewrites whatever it names.
    entitlements:
      path: KalaReachNotificationService/KalaReachNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)to.kala.reach.companion.shared
    settings:
      base:
        PRODUCT_NAME: KalaReachNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion.notifications
        SKIP_INSTALL: true

  # The native decisions, built and run without the application, so the four cases the
  # specification names are exercised by a test rather than by a device nobody has.
  KalaReachNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../../native/ios/Tests
      - path: ../../../native/ios/Shared
      - path: ../../../native/ios/KalaReachNative
    # The test target compiles `KalaReachNative`, which imports WebRTC for the call and the audio
    # session, so it links the same product the application does.
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_NAME: KalaReachNativeTests
        PRODUCT_BUNDLE_IDENTIFIER: to.kala.reach.companion.native-tests
        GENERATE_INFOPLIST_FILE: true
    # Its own scheme, with no host application: these are decisions about a payload and a clock,
    # and running them must not need the whole application to link first.
    scheme:
      testTargets:
        - KalaReachNativeTests

  companion-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The Rust archive is linked, not carried: naming the directory as a source makes the
      # generator put every archive it finds into the application's resources, which is most of a
      # gigabyte of a file the application never opens.
      - path: Externals
        buildPhase: none
      - path: companion-tauri_iOS
      # The native half of the application: push registration, secure keys, the audio session,
      # the share sheet and the signing rule. Hand written, and kept outside this generated
      # directory so regenerating the project never touches it.
      - path: ../../../native/ios/KalaReachNative
      - path: ../../../native/ios/Shared
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: companion-tauri_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # The interface offers the platform's camera and photo pickers, and iOS refuses to show
        # either without the application saying in its own words what it wants them for.
        NSCameraUsageDescription:
          Take a photo to attach it to a session on one of your hosts.
        NSPhotoLibraryUsageDescription:
          Choose a photo or a video to attach it to a session on one of your hosts.
        NSMicrophoneUsageDescription:
          Speak to a session on one of your hosts. The microphone is open only during a call you
          started, and keeps running if the screen locks during that call.
        # The keychain group the extension shares with this application, with the team prefix the
        # build resolves. Swift does not expand build variables inside a string literal, so the
        # one place the expanded value exists is the description the build writes.
        KRSharedKeychainGroup: $(AppIdentifierPrefix)to.kala.reach.companion.shared
        # The group nothing outside this application may reach, where the device authorisation key
        # goes. Named for the same reason as the shared one: Swift does not expand a build variable
        # inside a string literal, so the expanded value has to be written by the build.
        KRPrivateKeychainGroup: $(AppIdentifierPrefix)to.kala.reach.companion
        UIBackgroundModes:
          - remote-notification
          # An explicitly started voice call keeps running when the screen locks. Section 15
          # paragraph 21 is precise about what this is and is not: it preserves a call the person
          # started, and it does not authorise unattended microphone activation. The audio session
          # is opened on one path, for a call, and WebRTC is held in manual audio mode so nothing
          # else can open the microphone.
          - audio
    # Remote notifications, and the two keychain groups this application writes to. The shared
    # group holds one limited key that the notification extension reads; the application's own
    # group holds everything the extension must never see.
    entitlements:
      path: companion-tauri_iOS/companion-tauri_iOS.entitlements
      properties:
        aps-environment: development
        # This application's own group first, and that order is the point: the platform adds an
        # item with no group named to the *first* group in this list. The extension is entitled to
        # the shared one, so a default write into it would put the device authorisation key where
        # the extension could read it.
        keychain-access-groups:
          - $(AppIdentifierPrefix)to.kala.reach.companion
          - $(AppIdentifierPrefix)to.kala.reach.companion.shared
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - target: KalaReachNotificationService
      # Declaring the package is not enough: the product is what the target links, and the
      # framework is embedded and re-signed by this build because the downloaded one is unsigned.
      - package: WebRTC
        product: WebRTC
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
      # The shared client reads this device's own network interfaces to decide how it can reach a
      # host. On this platform that reader is System Configuration, which the application links.
      - sdk: SystemConfiguration.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a