[workspace]
resolver = "3"
members = [
    "apps/companion/src-tauri",
    "apps/companion/native/platform",
    "crates/kr-attention",
    "crates/kr-automation",
    "crates/kr-cbor",
    "crates/kr-changeset",
    "crates/kr-cli",
    "crates/kr-client",
    "crates/kr-controller",
    "crates/kr-crypto",
    "crates/kr-delivery",
    "crates/kr-describe",
    "crates/kr-hook",
    "crates/kr-ipc",
    "crates/kr-pairing",
    "crates/kr-plugin-catalogue",
    "crates/kr-plugin-host",
    "crates/kr-plugin-runtime",
    "crates/kr-plugin-sdk",
    "crates/kr-plugin-service",
    "crates/kr-project",
    "crates/kr-protocol",
    "crates/kr-shell-integration",
    "crates/kr-term",
    "crates/kr-transfer",
    "crates/kr-transport",
    "crates/kr-voice",
    "crates/kr-worker",
    "tests/integration/backup",
    "tests/integration/sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
repository = "https://github.com/kalapowered/kalareach"
publish = false

[workspace.dependencies]
# The companion's native platform services: its one secure store, the Android TLS verifier's start
# and the browser-backed sign-in session.
companion-platform = { path = "apps/companion/native/platform", version = "=0.1.0" }
# The signing and verification primitives `tough` is built on. Declared here because the catalogue
# tests build their own trust roots and generations, which needs the same random source and key
# pair types that crate signs with.
aws-lc-rs = "=1.18.1"
base64 = "=0.23.1"
boot-time = "=0.1.3"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
ciborium = "=0.2.2"
clap = { version = "=4.6.7", features = ["derive"] }
# Reads a file's access-control list on macOS, where the mode bits do not describe it. Used to
# refuse replacing a document whose protection this host cannot carry across, rather than to grant
# anything.
exacl = { version = "=0.13.0", default-features = false }
# Stream combinators. The catalogue wraps the update client's transport to hold a whole metadata
# fetch inside the repository's approved byte budget, whatever length the metadata declares.
futures = "=0.3.34"
# How the rendezvous room's WebSocket is read and written: as a stream of messages and a sink for
# them, the only interface its WebSocket library has.
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
hex = "=0.4.3"
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
# WebP is deliberately absent. The pinned lossless decoder derives its Huffman group count from a
# sixteen-bit metadata field and allocates tables from it, which no pixel-based budget can bound, so
# the format is not compiled in and a WebP publishes without a preview. It returns when the pin
# bounds that allocation.
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
interprocess = { version = "=2.4.4", features = ["tokio"] }
iroh = { version = "=1.2.0", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
iroh-base = { version = "=1.2.0", default-features = false, features = ["key", "relay"] }
# The signed discovery record format, at the release iroh itself is built with. The transport
# publishes and reads a Pkarr record over an HTTP client of its own, which takes the proxy the host
# selected and never one from the environment, and verifies each record it reads with this code.
iroh-dns = { version = "=1.3.0", default-features = false }
iroh-mainline-address-lookup = "=0.5.0"
iroh-mdns-address-lookup = "=0.5.0"
iroh-relay = { version = "=1.2.0", default-features = false }
# The calendar and instant types `tough` states metadata expiry in.
jiff = { version = "=0.2.37", features = ["serde"] }
keyring = "=4.2.0"
kr-attention = { path = "crates/kr-attention", version = "=0.1.0" }
kr-automation = { path = "crates/kr-automation", version = "=0.1.0" }
kr-cbor = { path = "crates/kr-cbor", version = "=0.1.0" }
kr-changeset = { path = "crates/kr-changeset", version = "=0.1.0" }
kr-cli = { path = "crates/kr-cli", version = "=0.1.0" }
# The shared native client. Its local-terminal path is a feature rather than a default here, so a
# member says whether it has a terminal to paint; the desktop and host crates turn it on.
kr-client = { path = "crates/kr-client", version = "=0.1.0", default-features = false }
kr-controller = { path = "crates/kr-controller", version = "=0.1.0" }
kr-crypto = { path = "crates/kr-crypto", version = "=0.1.0" }
kr-delivery = { path = "crates/kr-delivery", version = "=0.1.0" }
kr-describe = { path = "crates/kr-describe", version = "=0.1.0" }
kr-ipc = { path = "crates/kr-ipc", version = "=0.1.0" }
kr-pairing = { path = "crates/kr-pairing", version = "=0.1.0" }
kr-plugin-catalogue = { path = "crates/kr-plugin-catalogue", version = "=0.1.0" }
kr-plugin-host = { path = "crates/kr-plugin-host", version = "=0.1.0" }
kr-plugin-runtime = { path = "crates/kr-plugin-runtime", version = "=0.1.0" }
kr-plugin-sdk = { path = "crates/kr-plugin-sdk", version = "=0.1.0" }
kr-plugin-service = { path = "crates/kr-plugin-service", version = "=0.1.0" }
kr-project = { path = "crates/kr-project", version = "=0.1.0" }
kr-protocol = { path = "crates/kr-protocol", version = "=0.1.0" }
kr-shell-integration = { path = "crates/kr-shell-integration", version = "=0.1.0" }
kr-term = { path = "crates/kr-term", version = "=0.1.0" }
kr-transfer = { path = "crates/kr-transfer", version = "=0.1.0" }
kr-transport = { path = "crates/kr-transport", version = "=0.1.0" }
kr-voice = { path = "crates/kr-voice", version = "=0.1.0" }
kr-worker = { path = "crates/kr-worker", version = "=0.1.0" }
# The kernel's own filesystem and network confinement, which the project service encloses every Git
# invocation in. A safe wrapper over three system calls; the ruleset is built from opened directory
# handles in the parent and applied by the child before Git exists.
landlock = "=0.4.7"
libc = "=0.2.189"
libproc = "=0.14.11"
libsodium-sys-stable = "=1.24.0"
# The CPU inference runtime, pinned to one exact release. The binding vendors a fixed llama.cpp
# revision, and that revision is what every signed model profile records as its runtime identity,
# so a profile qualified against one build of the runtime cannot be loaded by another.
llama-cpp-2 = { version = "=0.1.156", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.156", default-features = false }
# The Apple runtime bindings the companion application's user-verification ceremony calls through.
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false }
objc2-local-authentication = { version = "=0.3.2", default-features = false }
portable-pty = "=0.9.0"
# Draws an invitation's QR code in the terminal `kr pair invite` runs in. MIT licensed, with no
# dependencies of its own.
qrcodegen = "=1.8.0"
# Certificates a test issues for a loopback server of its own, so the transport's certificate and
# hostname checks are exercised against a real handshake rather than described.
rcgen = "=0.14.10"
# The managed-service transport. Asynchronous, so a cancelled call stops rather than continuing on
# a blocking thread, and cut to the smallest feature set that carries a signed JSON request: no
# cookies, no ambient proxy, no decompression, no HTTP/2 and no transport-level retry, because
# whether a managed-service request is sent again is a decision this client's own retry policy
# makes. `rustls-no-provider` keeps the TLS provider the workspace already pins.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
# The TLS library the transport hands its provider to. `ring` is the provider every other TLS user
# in this workspace is built on, and it is named here so the client carries one implementation of
# the primitives rather than a second.
rustls = { version = "=0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
# What `portable-pty`'s traits report a failure as. The worker implements two of them for its own
# Windows pseudo-console.
anyhow = "=1.0.104"
# Apple's blocks, which the user-verification ceremony's completion handler is one of.
block2 = "=0.6.2"
coreaudio-rs = { version = "=0.14.2", default-features = false, features = ["audio_unit"] }
opus = "=0.4.0"
opusic-sys = "=0.7.5"
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rusqlite = "=0.40.2"
rustix = "=1.1.4"
rustls-pki-types = "=1.15.1"
# Checks a service's certificate against the platform's own trust store, as the managed-service
# transport does, for the connections this product opens outside that transport: the rendezvous
# room's WebSocket and mail submission.
rustls-platform-verifier = "=0.7.0"
schemars = "=1.2.2"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
signal-hook = "=0.4.4"
spake2 = "=0.4.0"
subtle = "=2.6.1"
sysctl = "=0.6.0"
sysinfo = "=0.33.1"
# The windowing library Tauri draws with, for a test that needs a window of its own.
tao = { version = "=0.35.3", default-features = false }
# `custom-protocol` is what makes a built application serve its interface from the bundle instead
# of from a development server. It is not implied by an optimised profile.
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6", "wry"] }
tauri-build = { version = "=2.6.3", default-features = false }
# The companion reads an invitation from the pasteboard in native code, so the text never passes
# through the page.
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
thread-priority = "=3.1.1"
# A format-preserving TOML editor. Registering the tool server in an agent's configuration must
# leave that file's other settings, its ordering and its comments exactly as they were.
toml_edit = "=0.25.15"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["logging", "ring", "tls12"] }
# The Update Framework client. The same exact release the catalogue publishing pipeline signs with,
# so the end that writes a generation and the end that verifies one run the same code. Its own HTTP
# client is not built: it follows the environment's proxy variables and the platform verifier's
# certificate variables, and the catalogue fetches through a transport the host builds instead.
tough = "=0.24.0"
tokio-util = "=0.7.18"
# The rendezvous room's WebSocket. The client opens it on a TLS stream it has already verified, and
# `ring` is the digest provider every other TLS user here is built on.
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "getrandom", "ring"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
url = "=2.5.8"
webrtc = { version = "=0.21.0", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
# The one outbound HTTP request this product makes from a client: an image a person explicitly
# imported. Blocking, rustls-backed and used with an explicit response-size limit.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "_ring"] }
uuid = { version = "=1.26.1", features = ["v4"] }
vtparse = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
# The component engine, pinned to one exact release. A compiled-code cache entry is only valid for
# the version that produced it, so the pin is part of the cache key rather than a convenience.
wasmtime = { version = "=48.0.3", default-features = false, features = ["addr2line", "component-model", "cranelift", "demangle", "gc", "gc-drc", "gc-null", "runtime", "std"] }
wezterm-escape-parser = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb", features = ["std"] }
wezterm-surface = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
wezterm-term = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
widestring = "=1.2.0"
# Windows Hello for the companion's owner confirmations: the consent verifier and its window
# interop, and the asynchronous operation it answers with. Both versions are already in the lock.
windows = { version = "=0.61.3", default-features = false }
windows-future = { version = "=0.2.1", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
wit-parser = "=0.259.0"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
