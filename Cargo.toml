[workspace]
resolver = "3"
members = ["crates/kr-cbor", "crates/kr-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
repository = "https://github.com/kalapowered/kalareach"
publish = false

[workspace.dependencies]
base64 = "=0.23.1"
ciborium = "=0.2.2"
hex = "=0.4.3"
kr-cbor = { path = "crates/kr-cbor", version = "=0.1.0" }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
