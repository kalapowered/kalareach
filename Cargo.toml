[workspace]
resolver = "3"
members = [
    "crates/kr-cbor",
    "crates/kr-cli",
    "crates/kr-client",
    "crates/kr-controller",
    "crates/kr-crypto",
    "crates/kr-ipc",
    "crates/kr-pairing",
    "crates/kr-plugin-host",
    "crates/kr-plugin-runtime",
    "crates/kr-plugin-sdk",
    "crates/kr-project",
    "crates/kr-protocol",
    "crates/kr-shell-integration",
    "crates/kr-term",
    "crates/kr-transfer",
    "crates/kr-transport",
    "crates/kr-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
repository = "https://github.com/kalapowered/kalareach"
publish = false

[workspace.dependencies]
base64 = "=0.23.1"
boot-time = "=0.1.3"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
ciborium = "=0.2.2"
clap = { version = "=4.6.7", features = ["derive"] }
# Reads a file's access-control list on macOS, where the mode bits do not describe it. Used to
# refuse replacing a document whose protection this host cannot carry across, rather than to grant
# anything.
exacl = { version = "=0.13.0", default-features = false }
hex = "=0.4.3"
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
# WebP is deliberately absent. The pinned lossless decoder derives its Huffman group count from a
# sixteen-bit metadata field and allocates tables from it, which no pixel-based budget can bound, so
# the format is not compiled in and a WebP publishes without a preview. It returns when the pin
# bounds that allocation.
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
interprocess = { version = "=2.4.4", features = ["tokio"] }
iroh = { version = "=1.2.0", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
iroh-base = { version = "=1.2.0", default-features = false, features = ["key", "relay"] }
iroh-mainline-address-lookup = "=0.5.0"
iroh-mdns-address-lookup = "=0.5.0"
iroh-relay = { version = "=1.2.0", default-features = false }
keyring = "=4.2.0"
kr-cbor = { path = "crates/kr-cbor", version = "=0.1.0" }
kr-cli = { path = "crates/kr-cli", version = "=0.1.0" }
kr-client = { path = "crates/kr-client", version = "=0.1.0" }
kr-controller = { path = "crates/kr-controller", version = "=0.1.0" }
kr-crypto = { path = "crates/kr-crypto", version = "=0.1.0" }
kr-ipc = { path = "crates/kr-ipc", version = "=0.1.0" }
kr-pairing = { path = "crates/kr-pairing", version = "=0.1.0" }
kr-plugin-host = { path = "crates/kr-plugin-host", version = "=0.1.0" }
kr-plugin-runtime = { path = "crates/kr-plugin-runtime", version = "=0.1.0" }
kr-plugin-sdk = { path = "crates/kr-plugin-sdk", version = "=0.1.0" }
kr-project = { path = "crates/kr-project", version = "=0.1.0" }
kr-protocol = { path = "crates/kr-protocol", version = "=0.1.0" }
kr-term = { path = "crates/kr-term", version = "=0.1.0" }
kr-transfer = { path = "crates/kr-transfer", version = "=0.1.0" }
kr-transport = { path = "crates/kr-transport", version = "=0.1.0" }
kr-worker = { path = "crates/kr-worker", version = "=0.1.0" }
# The kernel's own filesystem and network confinement, which the project service encloses every Git
# invocation in. A safe wrapper over three system calls; the ruleset is built from opened directory
# handles in the parent and applied by the child before Git exists.
landlock = "=0.4.7"
libc = "=0.2.189"
libproc = "=0.14.11"
libsodium-sys-stable = "=1.24.0"
portable-pty = "=0.9.0"
# What `portable-pty`'s traits report a failure as. The worker implements two of them for its own
# Windows pseudo-console.
anyhow = "=1.0.104"
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rusqlite = "=0.40.2"
rustix = "=1.1.4"
rustls-pki-types = "=1.15.1"
schemars = "=1.2.2"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
signal-hook = "=0.4.4"
spake2 = "=0.4.0"
subtle = "=2.6.1"
sysctl = "=0.6.0"
sysinfo = "=0.33.1"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
thread-priority = "=3.1.1"
# A format-preserving TOML editor. Registering the tool server in an agent's configuration must
# leave that file's other settings, its ordering and its comments exactly as they were.
toml_edit = "=0.25.15"
tokio-util = "=0.7.18"
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }
vtparse = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
# The component engine, pinned to one exact release. A compiled-code cache entry is only valid for
# the version that produced it, so the pin is part of the cache key rather than a convenience.
wasmtime = { version = "=48.0.2", default-features = false, features = ["addr2line", "component-model", "cranelift", "demangle", "gc", "gc-drc", "gc-null", "runtime", "std"] }
wezterm-escape-parser = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb", features = ["std"] }
wezterm-surface = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
wezterm-term = { git = "https://github.com/kalapowered/wezterm", rev = "9a9015119497fd5803c35a10ea4ffc503f2a7dfb" }
widestring = "=1.2.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
wit-parser = "=0.259.0"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
