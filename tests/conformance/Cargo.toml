[package]
name = "kr-conformance"
description = "The conformance report keyed by the specification's identifiers, and the application matrix run in a real session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-conformance"
path = "src/main.rs"

[dependencies]
# The rule for where the evidence directory may be.
kr-test-artifacts.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# The observation opens a program's file without following a link at its name.
libc.workspace = true

[dev-dependencies]
# The application matrix runs each program as the root of a real session: a worker's own session,
# pseudo-terminal and runtime, attached to over the worker's own endpoint with the product's client.
kr-crypto.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
kr-protocol.workspace = true
kr-worker.workspace = true
# Each tree a test runs the report over, and each application a case starts, gets a directory of
# its own.
tempfile.workspace = true
tokio.workspace = true
# The patched-crates case reads Cargo.lock and Cargo.toml as TOML, and compares the Git sources
# that they name as URLs.
toml.workspace = true
url.workspace = true

[lints]
workspace = true
