# A tree the conformance report's own tests read and run. It is a workspace of its own, so the
# repository's workspace never builds it.
#
# The library embeds a file that a macro writes into the build script's output directory while the
# library compiles, as Tauri's context macro does with an application's icon and front end. The
# package `racy` has two test programs that do it, which Cargo may compile at the same time. The
# package `shared` has a library that does it and two test programs that do it after the library,
# which find the file there, as the companion's window tests do beside its library.
[package]
name = "late"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Cargo compiles a library's own test target beside the library, and both would expand the macro at
# once against one file; the tree has no unit test or documentation test.
[lib]
test = false
doctest = false

[dependencies]
embed = { path = "embed" }

[workspace]
members = ["racy", "shared"]
