repository = 'typescript-only'
groups = ['typescript']

scripts = ['scripts']
lane_directories = ['mobile']

[rust]
manifests = []

[ignored_runs]
held = false

[typescript]
packages = ['web']
compiler_from = []
skip_directories = ['node_modules', 'generated']

[unrun]
bench = 'a benchmark'
typescript = 'no step runs TypeScript'

[unrun.rust]
linux = 'no step runs this target'
macos = 'no step runs this target'
windows = 'no step runs this target'

[[step]]
id = 'web'
group = 'typescript'
what = "the web package's tests"
platforms = ['linux', 'macos']
reading = 'vitest'
package = 'web'
output = '{evidence}/conformance/web.json'
command = ['pnpm', '-C', 'web', 'test', '--outputFile.json={output}']
