repository = 'no-root-manifest'
groups = ['rust']

[rust]
manifests = ['first/Cargo.toml', 'second/Cargo.toml']

[ignored_runs]
held = false

[unrun]
bench = 'a benchmark'
typescript = 'no step runs TypeScript'

[[step]]
id = 'first'
group = 'rust'
what = 'the first workspace'
platforms = ['linux', 'macos', 'windows']
reading = 'cargo'
directory = 'first'
command = ['cargo', 'test', '--locked']

[[step]]
id = 'second'
group = 'rust'
what = 'the second workspace'
platforms = ['linux', 'macos', 'windows']
reading = 'cargo'
directory = 'second'
command = ['cargo', 'test', '--locked']
