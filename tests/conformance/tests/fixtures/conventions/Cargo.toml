# A tree the conformance report's own tests read and never build: each of its test targets steps
# outside the conventions a helper key relies on, and the reading needs only their source. It is a
# workspace of its own, so the repository's workspace never builds it either.
[package]
name = "conventions"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["vintage"]
