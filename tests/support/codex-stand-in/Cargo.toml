[package]
name = "kr-codex-stand-in"
description = "A stand-in for the Codex application server and its native terminal, speaking the protocol the pinned release speaks and checking every frame against that release's schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "codex-stand-in"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
http.workspace = true
# Every frame either side writes or reads is checked against the schemas the pinned release
# publishes, so a gateway that makes a frame the pinned release would not write is caught at
# either end.
jsonschema.workspace = true
# The server starts its commands in a session of its own, and ends all of one's processes at once;
# the terminal reads a person's keys one at a time where its input is a terminal.
rustix = { workspace = true, features = ["fs", "process", "termios"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal"] }
tokio-websockets.workspace = true

[dev-dependencies]
# The tests play the gateway between the two sides: it accepts the terminal's WebSocket.
tokio-websockets = { workspace = true, features = ["server"] }

[lints]
workspace = true
