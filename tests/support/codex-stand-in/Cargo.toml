[package]
name = "kr-codex-stand-in"
description = "A stand-in for the Codex application server and its native terminal, speaking the protocol the pinned release speaks and checking every frame against that release's schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "codex-stand-in"
path = "src/main.rs"

# The same program built again as the newer release: one source, a second program with another
# digest and another version (`NEWER`), so a case can install it beside the first and upgrade to it.
[[bin]]
name = "codex-stand-in-newer"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
http.workspace = true
# Every frame either side writes or reads is checked against the schemas the pinned release
# publishes, so a gateway that makes a frame the pinned release would not write is caught at
# either end.
jsonschema.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal"] }
tokio-websockets.workspace = true

[target.'cfg(unix)'.dependencies]
# The server starts its commands in a session of its own, and ends all of one's processes at once;
# the terminal reads a person's keys one at a time where its input is a terminal.
rustix = { workspace = true, features = ["fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
# The terminal reaches the gateway's socket through `uds_windows`, a non-blocking stream registered
# with `async-io` and read and written through the tokio traits, as the host's own socket is.
async-io.workspace = true
# The record is written through the handles and the access-list checks the host's own private
# files are.
kr-ipc.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
uds_windows.workspace = true
# The server starts each command in a job of its own and ends all of one's processes at once, and
# the terminal reads the console's modes and size.
windows-sys.workspace = true

[dev-dependencies]
# The tests play the gateway between the two sides: it accepts the terminal's WebSocket.
tokio-websockets = { workspace = true, features = ["server"] }

[target.'cfg(windows)'.dev-dependencies]
# A case that stands in for the gateway on Windows binds the socket the host's own code binds and
# reads the process the kernel names at the other end of a connection.
kr-worker.workspace = true
# The cases list the processes of a command in place of a process group.
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

# The workspace forbids unsafe code. This package denies it and allows it only in the module whose
# native calls have no safe form, with the reason stated there. Nothing else in the package may
# relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
