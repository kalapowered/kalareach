[package]
name = "kr-e2e-m1b"
description = "The cross-boundary checkpoint: the deployed site, pairing through it, the terminal workflow from a paired device, the published catalogue release and a plugin acting in a session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# The product's own reading of an origin, which the checkpoint's script asks before it runs a leg.
name = "kr-e2e-m1b-origin"
path = "src/bin/origin.rs"

[dependencies]
# The trust root a catalogue enrolment carries travels as base64.
base64.workspace = true
# The room's socket is read as a stream of messages and written as a sink of them.
futures-util.workspace = true
# The paired device's own endpoint, which dials the host over iroh.
iroh.workspace = true
kr-cbor.workspace = true
# The paired device is this library, with the projected screen a client draws from.
kr-client = { workspace = true, features = ["terminal"] }
# The room's frame vocabulary, the owner-confirmation digest of a catalogue enrolment and the
# pairing clock. The host itself is the `kr-controller` binary, never this library.
kr-controller.workspace = true
kr-crypto.workspace = true
# Host directories, process identities and placing a binary on the internal disk.
kr-ipc = { workspace = true, features = ["testing"] }
# The client half of short-code and direct pairing, which a paired device runs.
kr-pairing.workspace = true
# The enrolment a device asks the owner to confirm names the root's own key identifiers.
kr-plugin-catalogue.workspace = true
kr-plugin-sdk.workspace = true
kr-protocol.workspace = true
# What `kr attach` draws is read back through the product's own terminal engine.
kr-term.workspace = true
kr-transport.workspace = true
# Where the host's configuration document lives, as the host itself works it out.
kr-worker.workspace = true
rustls-platform-verifier.workspace = true
# The bounds a request's parameters are written under.
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }
tokio-rustls.workspace = true
tokio-websockets.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
# The terminals `kr` runs on, which are real pseudo-terminals as a person's are.
portable-pty.workspace = true
# Signals by recorded process, and the modes of a terminal read from the device itself.
rustix = { workspace = true, features = ["fs", "process", "termios"] }

[lints]
workspace = true
