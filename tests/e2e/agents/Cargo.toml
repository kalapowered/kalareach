[package]
name = "kr-e2e-agents"
description = "Qualification cases for the bundled agent connectors: a real host, a paired owner device and a vendor agent build started from a managed shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "cases"

[[test]]
name = "integration"

[[test]]
# The assumptions the Codex package's table makes of the pinned terminal and server, shown behind a
# gateway with the application stand-in or, as one switch says, the pinned build.
name = "gateway"

[dependencies]
# The host, the paired device, the terminal windows and the process record: the cross-boundary
# checkpoint's own harness, used as a library.
kr-e2e-m1b = { path = "../m1b" }
# The base64 text an agent's record holds an image as.
base64.workspace = true
# The SHA-256 of a mapped image.
kr-cbor.workspace = true
kr-client = { workspace = true, features = ["terminal"] }
# The owner-confirmation digest of an installation.
kr-controller.workspace = true
# Process identities, the host's directories and placing a binary on the internal disk.
kr-ipc = { workspace = true, features = ["testing"] }
# The host's reading of a command integration, which the owner's device is shown.
kr-plugin-sdk.workspace = true
kr-protocol.workspace = true
# Where the host's configuration document lives, as the host itself works it out.
kr-worker.workspace = true
# Searching a run's directory for the values of keys, which holds binaries of tens of megabytes.
memchr = "=2.8.3"
# The agent's own database, read-only, for an agent that keeps its conversations in one.
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# The person's agent configuration, read as TOML, key by key.
toml_edit.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# Signals by recorded process, and opening a mapped file without waiting on it.
rustix = { workspace = true, features = ["fs", "net", "process", "termios"] }

[dev-dependencies]
# A runtime whose clock is paused, so that a case reads a bound off the runtime's clock and not off
# the time the machine took.
tokio = { workspace = true, features = ["test-util"] }
# The keys and expiry a test signs a catalogue generation of its own with, through the catalogue's
# own generation builder, and the connector package the host reads.
aws-lc-rs.workspace = true
# The command table of the forwarder, which says whether the host has a launch for an agent in ACP
# mode: the cases of that mode start with it and fail while it has none.
clap.workspace = true
jiff.workspace = true
kr-hook = { path = "../../../crates/kr-hook" }
kr-plugin-catalogue = { workspace = true, features = ["testing"] }
kr-worker = { workspace = true, features = ["testing"] }
tough.workspace = true
url.workspace = true

[lints]
workspace = true
