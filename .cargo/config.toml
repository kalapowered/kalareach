# Build settings this workspace needs wherever it is built, so that a local build, the build box
# and continuous integration all link the same way. Nothing here selects a toolchain or a target:
# `rust-toolchain.toml` does that.

# Windows, x86-64 and ARM64. Both linker arguments are about one dependency.
#
# libsodium reaches this workspace as the library's own prebuilt MSVC binaries. Their objects ask
# for the *static* C runtime, and Rust's MSVC targets link the dynamic one. The linker reports the
# disagreement as `LNK4098`. The warning says that two runtimes were asked for, not that both were
# linked: an image that took code from both would have two heaps, two copies of the runtime's own
# state, and a free in one of them for an allocation from the other. Leaving the static runtime out
# of the link rules that out. The whole image, libsodium included, then uses the dynamic runtime
# Rust brought, and the warning does not appear. `LIBCMT` is the static runtime's release name and
# `LIBCMTD` its debug one, and neither is ever the right answer here. A link that still reports
# `LNK4098` has something else asking for another runtime, and the release workflow refuses it.
#
# The same prebuilt binaries ship no debug database, so the linker says so once per object file:
# several thousand `LNK4099` lines on every link that produces a binary, which is most of a build's
# output and says nothing about this workspace. That one is silenced rather than fixed, because
# fixing it would mean building libsodium from source on every Windows machine.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-Clink-arg=/NODEFAULTLIB:LIBCMT",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]

[target.aarch64-pc-windows-msvc]
rustflags = [
  "-Clink-arg=/NODEFAULTLIB:LIBCMT",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]

# The description process's processor baseline. llama.cpp compiles its CPU code for a fixed set of
# x86-64 instruction sets chosen when it is built, so the set is written here and never taken from
# the machine that compiles: a release built on a newer processor than the one it ships to would
# stop with an illegal instruction on the older one. The baseline is the x86-64-v3 level as compiled
# code uses it, `kr_describe::processor::Feature::X86_64`. Six of its members have a llama.cpp
# option, pinned on below (SSE4.2, AVX, AVX2, BMI2, FMA and F16C); the compilers add POPCNT, BMI1,
# LZCNT and MOVBE themselves. A host checks its processor against all ten before it offers a model,
# and a test holds the pins and that list equal. The options do nothing on a target that is not
# x86-64; 32-bit x86 has no model profile, so no process is started there. `force` keeps an
# environment variable of the same name from changing them, and `kr-describe-model` refuses to
# build when a `target-cpu` flag, or a target feature wider than the baseline, would override them.
[env]
GGML_NATIVE = { value = "OFF", force = true }
GGML_SSE42 = { value = "ON", force = true }
GGML_AVX = { value = "ON", force = true }
GGML_AVX2 = { value = "ON", force = true }
GGML_BMI2 = { value = "ON", force = true }
GGML_FMA = { value = "ON", force = true }
GGML_F16C = { value = "ON", force = true }
GGML_AVX_VNNI = { value = "OFF", force = true }
GGML_AVX512 = { value = "OFF", force = true }
GGML_AVX512_VBMI = { value = "OFF", force = true }
GGML_AVX512_VNNI = { value = "OFF", force = true }
GGML_AVX512_BF16 = { value = "OFF", force = true }
GGML_AMX_TILE = { value = "OFF", force = true }
GGML_AMX_INT8 = { value = "OFF", force = true }
GGML_AMX_BF16 = { value = "OFF", force = true }
