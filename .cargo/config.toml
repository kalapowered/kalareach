# Build settings this workspace needs wherever it is built, so that a local build, the build box
# and continuous integration all link the same way. Nothing here selects a toolchain or a target:
# `rust-toolchain.toml` does that.

# Windows, x86-64 and ARM64: every program of the product links the static C runtime.
#
# `-Ctarget-feature=+crt-static` makes Rust's MSVC targets link `LIBCMT`, the static C runtime,
# instead of the import libraries of the dynamic runtime (C++ objects ask for the static C++ library
# themselves), so that no program imports
# `VCRUNTIME140.dll` or an API set of the universal runtime. A machine without Microsoft's
# redistributable can then start the program, and nothing is installed or shipped beside it. The C
# libraries built here (aws-lc, SQLite, ring, blake3, and llama.cpp through the three settings in
# `[env]` below) are compiled for that runtime, and libsodium's prebuilt MSVC binaries ask for it
# in their objects, so the whole image uses one runtime: one heap and one copy of the runtime's
# own state. The linker reports two runtimes in one link as `LNK4098`, and the release workflow
# refuses a link that reports it. Rust adds `/defaultlib:libcmt` itself under this feature, so no
# link argument of ours names the runtime's library. A `RUSTFLAGS` in the environment replaces the
# flags below with no message, and the feature is then lost: the build script of `kr-crypto`, which
# every program that links libsodium builds, refuses an MSVC build whose target features lack it.
#
# libsodium's prebuilt debug library asks for `LIBCMTD`, the static runtime's debug name, while a
# link under `crt-static` takes `LIBCMT` whatever the profile. The one exclusion that is left
# leaves `LIBCMTD` out of the link, so that the debug library's objects resolve against the one
# runtime. No program that ships is built in the debug profile (test programs are, and so is a local
# debug build), and the exclusion does nothing in a release link, where nothing asks for `LIBCMTD`.
#
# The same prebuilt binaries ship no debug database, so the linker says so once per object file:
# several thousand `LNK4099` lines on every link that produces a binary, which is most of a build's
# output and says nothing about this workspace. That one is silenced rather than fixed, because
# fixing it would mean building libsodium from source on every Windows machine.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-Ctarget-feature=+crt-static",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]

[target.aarch64-pc-windows-msvc]
rustflags = [
  "-Ctarget-feature=+crt-static",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]

# The description process's processor baseline. llama.cpp compiles its CPU code for a fixed set of
# x86-64 instruction sets chosen when it is built, so the set is written here and never taken from
# the machine that compiles: a release built on a newer processor than the one it ships to would
# stop with an illegal instruction on the older one. The baseline is the x86-64-v3 level as compiled
# code uses it, `kr_describe::processor::Feature::X86_64`. Six of its members have a llama.cpp
# option, pinned on below (SSE4.2, AVX, AVX2, BMI2, FMA and F16C); the compilers add POPCNT, BMI1,
# LZCNT and MOVBE themselves. A host checks its processor against all ten before it offers a model,
# and a test holds the pins and that list equal. The options do nothing on a target that is not
# x86-64; 32-bit x86 has no model profile, so no process is started there. `force` keeps an
# environment variable of the same name from changing them, and `kr-describe-model` refuses to
# build when a `target-cpu` flag, or a target feature wider than the baseline, would override them.
[env]
GGML_NATIVE = { value = "OFF", force = true }
GGML_SSE42 = { value = "ON", force = true }
GGML_AVX = { value = "ON", force = true }
GGML_AVX2 = { value = "ON", force = true }
GGML_BMI2 = { value = "ON", force = true }
GGML_FMA = { value = "ON", force = true }
GGML_F16C = { value = "ON", force = true }
GGML_AVX_VNNI = { value = "OFF", force = true }
GGML_AVX512 = { value = "OFF", force = true }
GGML_AVX512_VBMI = { value = "OFF", force = true }
GGML_AVX512_VNNI = { value = "OFF", force = true }
GGML_AVX512_BF16 = { value = "OFF", force = true }
GGML_AMX_TILE = { value = "OFF", force = true }
GGML_AMX_INT8 = { value = "OFF", force = true }
GGML_AMX_BF16 = { value = "OFF", force = true }

# llama.cpp's static runtime. Its Rust crate compiles the vendored CMake project for the dynamic
# runtime unless `LLAMA_STATIC_CRT` is `1`, and the CMake project takes its runtime from
# `CMAKE_MSVC_RUNTIME_LIBRARY`, which the crate passes on from the environment with every other
# `CMAKE_` variable. Both name the one runtime of the Windows MSVC link above and do nothing on any
# other target. The crate builds llama.cpp in CMake's release configuration whatever the Rust profile
# is, and `LLAMA_LIB_PROFILE=Debug` would make it link the debug runtime's library by name, which the
# exclusion above does not stop, so the profile is pinned too. `force` keeps an environment variable
# of the same name from changing them.
LLAMA_STATIC_CRT = { value = "1", force = true }
CMAKE_MSVC_RUNTIME_LIBRARY = { value = "MultiThreaded", force = true }
LLAMA_LIB_PROFILE = { value = "Release", force = true }
