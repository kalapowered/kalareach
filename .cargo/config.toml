# Build settings this workspace needs wherever it is built, so that a local build, the build box
# and continuous integration all link the same way. Nothing here selects a toolchain or a target:
# `rust-toolchain.toml` does that.

# Windows, x86-64 and ARM64. Both linker arguments are about one dependency.
#
# libsodium reaches this workspace as the library's own prebuilt MSVC binaries. Those are built
# against the *static* C runtime, and Rust's MSVC targets link the dynamic one, so an image that
# links both ends up with two C runtimes in it: two heaps, two copies of the runtime's own state,
# and a free in one of them for an allocation from the other. That is what `LNK4098` reports, and
# leaving the static runtime out of the link is the remedy - the whole image, libsodium included,
# then uses the dynamic runtime Rust brought. `LIBCMT` is its release name and `LIBCMTD` its debug
# one, and neither is ever the right answer here.
#
# The same prebuilt binaries ship no debug database, so the linker says so once per object file:
# several thousand `LNK4099` lines on every link that produces a binary, which is most of a build's
# output and says nothing about this workspace. That one is silenced rather than fixed, because
# fixing it would mean building libsodium from source on every Windows machine.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-Clink-arg=/NODEFAULTLIB:LIBCMT",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]

[target.aarch64-pc-windows-msvc]
rustflags = [
  "-Clink-arg=/NODEFAULTLIB:LIBCMT",
  "-Clink-arg=/NODEFAULTLIB:LIBCMTD",
  "-Clink-arg=/IGNORE:4099",
]
