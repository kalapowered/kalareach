# How continuous integration checks Cargo.lock against the RustSec advisory database. `cargo audit`
# reads this file when it runs at the root of the workspace, so a local run applies the same rules.
#
# Every advisory against a crate that the lock takes from crates.io fails the check, whether it
# reports a vulnerability, unsound code or an unmaintained crate. A crate that the lock takes from
# Git is not checked, because `cargo audit` matches an advisory only to a crate from the advisory's
# own source; docs/README.md lists those crates. An advisory is let through only by naming it below,
# with the reason it is accepted and the condition for taking it out again. The tool ignores an
# advisory by its identifier, for every version of the crate and every route to it, so only the
# review of a lock change guards against a new route to a crate named below. An informational
# notice is printed and does not fail the check, because `cargo audit` has no setting that would
# make it. A yanked release is not an advisory, and the check does not look for one.

[advisories]
ignore = [
    # glib 0.18.5 is unsound: the iterator `Variant::array_iter_str` returns can hand a null
    # pointer to `CStr::from_ptr`. No crate in the lock calls `array_iter_str` outside glib's own
    # tests. glib comes with the companion application's GTK 3 window stack, on Linux only, and the
    # fix is in glib 0.20, which that stack does not use. Remove this once the lock carries no glib
    # older than 0.20.
    "RUSTSEC-2024-0429",
    # lru 0.16.4 is unsound when a key's `Drop` panics inside `LruCache::pop`. Its one user here is
    # the terminal emulator's image cache (wezterm-term), which is keyed by `[u8; 32]`, and that
    # has no `Drop` to panic. The fix is in lru 0.18.2. Remove this once the lock carries no lru
    # older than 0.18.2.
    "RUSTSEC-2026-0253",
    # adler 1.0.2 is unmaintained, succeeded by adler2. It checks the zlib streams miniz_oxide 0.7
    # inflates for the terminal emulator's compressed images. The advisory reports no defect.
    # Remove this once the lock no longer carries adler 1.0.2.
    "RUSTSEC-2025-0056",
    # paste 1.0.15 is unmaintained. It is a procedural macro, so it runs only while the workspace
    # compiles. It comes through netlink-packet-core, under iroh's network monitor (netwatch,
    # netdev), and through pulp and rav1e, under the image crate's EXR and AVIF codecs. The advisory
    # reports no defect. Remove this once the lock no longer carries paste.
    "RUSTSEC-2024-0436",
    # proc-macro-error 1.0.4 is unmaintained. It serves glib-macros and gtk3-macros 0.18, procedural
    # macros in the companion application's GTK 3 stack, so it too runs only while the workspace
    # compiles. The advisory reports no defect. Remove this once the lock no longer carries
    # proc-macro-error.
    "RUSTSEC-2024-0370",
    # The unic crates 0.9.0 are unmaintained. They are the Unicode identifier tables urlpattern 0.3
    # reads when the companion application parses the URL patterns in its capability files
    # (tauri-utils). The advisories report no defect. Remove these once the lock carries no unic
    # crate.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # zip 8.6.0 has eight advisories about reading an archive that an attacker made. Its one user
    # here is the build script of libsodium-sys-stable, which for a Windows (MSVC) target unpacks
    # libsodium's prebuilt libraries from an archive on libsodium's download host. The crate does
    # not ship that archive. The build script reads it from one of three places: SODIUM_DIST_DIR,
    # where continuous integration places it; a copy that an earlier download left in the crate's
    # source folder; or a download over plain HTTP. Continuous integration places it with
    # scripts/place-libsodium-archive.sh, which fixes the archive's size and SHA-256 digest and
    # refuses any other bytes before the build reads the archive. From all three places the build
    # script unpacks the archive only after checking its minisign signature against libsodium's
    # public key, which the build script holds, on the same bytes that it passes to zip, so only an
    # archive that upstream's key signed reaches extraction. The build script's only calls into zip
    # are `ZipArchive::new` and `ZipArchive::extract`. 0546 is about `extract`, so the build script
    # reaches it, behind that signature check. 0545 needs the zip crate's `aes-crypto` feature and
    # 0547 its `legacy-zip` feature. The build script asks for `deflate` alone, and the lock's entry
    # for zip 8.6.0 holds none of the crates that those two features add (aes, constant_time_eq,
    # getrandom, hmac, pbkdf2, sha1 and zeroize for the first, bitstream-io for the second). 0545 is
    # about an AES entry whose data ends early or is empty. 0548 is about the stream functions
    # `ZipStreamReader::visit`, `ZipStreamReader::extract` and `read_zipfile_from_stream`, which
    # neither the build script nor any crate of ours calls. Its fix in 9.0.5 is an opt-in check,
    # `ZipStreamReader::enforce_header_consistency(true)`, that is off by default, so a later use of
    # the stream reader in a crate of ours must turn it on. The other seven fixes are in zip 9.0.0.
    # The pinned crate, libsodium-sys-stable 1.24.0, asks for zip 8. Its releases 1.24.4, 1.24.5 and
    # 1.24.6 ask for zip 9.4 or a later 9.x. The source of 1.24.5 alone was checked: it bundles a
    # snapshot of libsodium's unreleased stable branch instead of the 1.0.22 release, and this
    # workspace builds libsodium's source only at a release tag. The host's own reader of a Windows
    # release archive, in kr-cli, uses zip 9. Remove these once the lock carries no zip older than
    # 9.0.5.
    "RUSTSEC-2026-0367", # set-user-ID and set-group-ID bits kept
    "RUSTSEC-2026-0368", # symbolic links whose targets leave the destination
    "RUSTSEC-2026-0369", # permissions applied through a symbolic link
    "RUSTSEC-2026-0429", # an abort on a symbolic link entry that declares a large size
    "RUSTSEC-2026-0545", # AES entries unchecked when the data ends early or is empty
    "RUSTSEC-2026-0546", # `extract` writes outside the destination through symbolic links
    "RUSTSEC-2026-0547", # legacy Shrink, Reduce and Implode decoders preallocate a declared size
    "RUSTSEC-2026-0548", # stream functions trust local-header names; the fix is opt-in
    # chrono 0.4.45 is unmaintained. The advisory names no defect and lists no patched version, and
    # it names `jiff` and `time` as alternatives. No crate of ours names chrono. The programs that
    # we ship reach it by two routes. On every platform it comes with rmcp 3.9.0, the
    # tool-protocol crate that the command line (kr-cli) and the hook (kr-hook) use, and with the
    # `chrono04` feature that rmcp's `schemars` feature turns on in schemars 1.2.2. On Windows
    # alone it comes with wmi 0.18.4, which the transport library's network watcher (netwatch
    # 0.19.3, under iroh 1.4.1 and portmapper 0.19.3) uses. The lock lists it under two more
    # crates. serde_with 3.23.0 names it only in weak features that no build turns on.
    # tokio-rustls-acme 0.9.1 comes with iroh-relay's `server` feature, which no normal or build
    # dependency of the workspace turns on: only the dev-dependencies of kr-transport and
    # kr-controller do, so only their test builds take chrono through it. No program that we ship
    # takes it through either. Remove this once the lock carries no chrono or the notice is
    # withdrawn.
    "RUSTSEC-2026-0543",
    # zvariant 5.15.0, zbus_names 4.3.4 and zvariant_derive 5.15.0 are unmaintained: each was merged
    # into zbus 6.0.0, as its wire module, its names module and its derive macros. They come with
    # zbus 5.19.0, on Linux only, by two routes. The keyring store under kr-crypto,
    # zbus-secret-service-keyring-store 1.0.1, reaches the Linux secret service with it, directly
    # and through secret-service 5.2.0. The companion application's opener plugin,
    # tauri-plugin-opener 2.5.5, uses it only to show a file in the file manager, which the
    # companion never asks for. No release of the store, of secret-service or of the plugin yet
    # allows zbus 6. The advisories report no defect. Remove these once the lock carries no
    # zvariant, zbus_names or zvariant_derive.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[output]
deny = ["unmaintained", "unsound"]
quiet = false

[yanked]
enabled = false
