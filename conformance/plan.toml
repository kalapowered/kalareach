# What the conformance report runs and reads in this repository. `kr-conformance` reads
# this file for `map` and for `run`; a step runs the argument vector it names, never a shell
# string. The loader adds `--show-output` after `--` to each `cargo test` that leaves its
# output captured, and `--skip <name>` for each entry of a step's `skips`.
repository = 'kalareach'
groups = ['rust', 'end-to-end', 'performance', 'typescript', 'applications', 'phones']
list_table_rows = true

[typescript]
packages = ['packages/protocol', 'packages/plugin-sdk', 'apps/companion']

[applications]
lock = 'tests/conformance/applications.lock'

# Why a test that no step runs is not run.
[unrun]
bench = 'a benchmark target: the performance group runs the measurements it holds'
typescript = '''no step of this run's selection runs the TypeScript suites'''

[unrun.rust]
linux = '''no step of this run's selection runs this target on this platform'''
macos = '''no step of this run's selection runs this target on this platform'''
windows = 'no step runs this target on Windows: the suites that drive a Unix pseudo-terminal are compiled there and qualified on Unix, and the pseudo-console is qualified on the Windows test machine'

[terminals]
names = [
    'iTerm2',
    'Terminal.app',
    'Ghostty',
    'WezTerm',
    'Windows Terminal',
    'a VTE-based Linux terminal',
    'the VS Code terminal',
]
reason = 'the physical terminal matrix runs on the terminal matrix hosts and virtual machines; this run recorded no run of it'

[[group_absent]]
group = 'end-to-end'
platform = 'windows'
reason = 'the end-to-end suites and the measurements drive Unix pseudo-terminals; on Windows the pseudo-console is qualified on the Windows test machine'
explains_unrun_rust = true

[[group_absent]]
group = 'performance'
platform = 'windows'
reason = 'the end-to-end suites and the measurements drive Unix pseudo-terminals; on Windows the pseudo-console is qualified on the Windows test machine'
explains_unrun_rust = true

[[group_absent]]
group = 'typescript'
platform = 'windows'
reason = 'the TypeScript suites are qualified on Linux and macOS'

[[group_absent]]
group = 'applications'
platform = 'windows'
reason = 'a console application on Windows is driven through the pseudo-console, which the Windows test machine qualifies'

[[group_absent]]
group = 'phones'
platform = 'windows'
reason = '''the phone applications' unit tests run on Linux (Kotlin, with Gradle) and on macOS (Swift, with Xcode)'''

[[excluded_package]]
platform = 'macos'
package = 'kr-sync-integration'
reason = '''every test of this package is a leg against a live deployment; the landing workflow's Linux job runs each leg against the deployment it names at a push to main and at a manual run that asks for the legs'''

[[lane]]
group = 'phones'
files = 'apps/companion/native/android/src/test/**'
reason = '''the Android application's unit tests run in the Linux report, with Gradle'''
reads = 'junit'

[[lane]]
group = 'phones'
files = 'apps/companion/native/ios/Tests/**'
reason = '''the iOS application's unit tests run in the macOS report, with Xcode'''
reads = 'xcode'

[[lane]]
group = 'phones'
files = 'apps/companion/native/android/android/src/androidTest/kotlin/to/kala/reach/companion/push/PushReceiverInstrumentedTest.kt'
reason = '''no gate builds or runs the Android push receiver's instrumented cases: `scripts/e2e-push-android-receiver.sh` runs them on the emulator'''

[[lane]]
files = 'apps/companion/e2e/**'
reason = '''Playwright over the built interface: `pnpm --dir apps/companion run e2e` runs it, in the landing workflow's companion job'''

[[case_table]]
files = 'tests/shells/*/*/case.json'
package = 'kr-shell-integration'
target = 'qualification'
tests = ['every_case_holds_against_the_package_it_names']

[[case_table]]
files = 'fixtures/shell-bridge/*.json'
package = 'kr-shell-integration'
target = 'harness'
tests = ['every_committed_scenario_holds_against_the_contract']

[[step]]
