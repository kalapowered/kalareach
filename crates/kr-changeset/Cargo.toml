[package]
name = "kr-changeset"
description = "The KalaReach change-set service: immutable captured versions, independent materialisations and the diff apply contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std.workspace = true
kr-cbor.workspace = true
kr-flush.workspace = true
kr-ipc.workspace = true
kr-project = { workspace = true }
kr-protocol.workspace = true
kr-transfer.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
kr-ipc = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# The system calls that make a staged name this host's own: a directory created against an open
# handle with a mode that admits nobody else, the same handle asked who owns it, and a removal
# named relative to it rather than by a path. On Linux it also takes an inherited access-control
# list off a copy this host staged, through the extended attribute the kernel keeps one in and
# through the copy's own descriptor.
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# Removing an open object rather than a name: the staged file this host verified is reopened for
# deletion and marked through its own handle, so no name can redirect the removal.
windows-sys.workspace = true

[features]
# The seam a test uses to stop an apply exactly where a crash would stop it, so the journal can be
# read afterwards. On by default so a plain `cargo test` reaches it; a binary that ships this crate
# turns default features off, and nothing in the service ever sets it.
default = ["fault-injection"]
fault-injection = []

# The workspace forbids unsafe code, which a crate that removes a staged file through the handle it
# verified cannot honour: reopening an object for deletion and setting its disposition are calls
# into `kernel32`, and neither has a safe binding. This crate denies unsafe code instead and allows
# it in exactly one module, `removal::windows`, which owns those two calls. Nothing else in this
# crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
