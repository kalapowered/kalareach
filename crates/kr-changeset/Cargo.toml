[package]
name = "kr-changeset"
description = "The KalaReach change-set service: immutable captured versions, independent materialisations and the diff apply contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std.workspace = true
kr-cbor.workspace = true
kr-ipc.workspace = true
kr-project = { workspace = true }
kr-protocol.workspace = true
kr-transfer.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
kr-ipc = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Reads a file's access-control list, so a destination whose protection this host cannot carry
# across a replacement is refused rather than replaced with its mode bits alone. Used to refuse,
# never to grant.
exacl.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Asks an open file whether it carries a POSIX access-control list, through the extended attribute
# the kernel keeps one in. The question is asked of the descriptor rather than of a name, and it is
# asked only to refuse.
rustix = { workspace = true, features = ["fs"] }

[features]
# The seam a test uses to stop an apply exactly where a crash would stop it, so the journal can be
# read afterwards. On by default so a plain `cargo test` reaches it; a binary that ships this crate
# turns default features off, and nothing in the service ever sets it.
default = ["fault-injection"]
fault-injection = []

[lints]
workspace = true
