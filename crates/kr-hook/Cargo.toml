[package]
name = "kr-hook"
description = "The KalaReach forwarder: the native bridge an application starts beside its unchanged terminal, and the relay a launched agent reaches its worker through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-hook"
path = "src/main.rs"

[dependencies]
# The registration and the credential beside it are read through one handle on their directory,
# without following a link, so the files read are the files that directory holds.
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
# The launch credential is read into the host's own zeroising buffer, so the copy this process
# holds is wiped when it is dropped rather than left for whatever reuses the memory.
kr-crypto.workspace = true
# The kernel's reading of this process, which is what the worker compares with what it launched.
kr-ipc.workspace = true
kr-protocol.workspace = true
# Claude Code starts its channel server as a stdio MCP server, so this is the MCP server library
# the command line's own contact tools already use, at the same pinned release.
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
# The tests put a copy of this binary on the internal disk and start it from there.
kr-ipc = { workspace = true, features = ["testing"] }
# The forwarder is proved against the worker's own listener: the endpoint it binds, the
# registration it writes, the hello it reads and the authentication it performs. A second listener
# written for the tests would prove only that the two agree with each other.
kr-worker.workspace = true
# The bridge files the plugin package installs are pinned here by their SHA-256 digests.
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
