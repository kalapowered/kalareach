[package]
name = "kr-release"
description = "KalaReach's release signing: the one place a release manifest is signed and verified, and the tool that assembles a release's manifest and record from a built tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-release"
path = "src/bin/kr-release.rs"

[dependencies]
# The key pairs a manifest is signed with, and the random source The Update Framework's signing
# asks for.
aws-lc-rs.workspace = true
clap.workspace = true
# The expiry a role states, which a release's has none of.
jiff.workspace = true
kr-protocol.workspace = true
# How a host starts each shell and where it puts its marked entry in the person's own startup
# files, which a release states for each shell package it carries.
kr-shell-integration.workspace = true
serde.workspace = true
serde_json.workspace = true
# The digest of every file a release lists, and of the sources and patches a shell package is
# built from.
sha2.workspace = true
thiserror.workspace = true
# The lock a release's pinned libraries are read out of.
toml_edit.workspace = true
tokio = { workspace = true, features = ["rt"] }
# The update channel's metadata, its signed envelope and its keys: the same implementation the
# plugin catalogue verifies with, so one verifier stands behind both.
tough.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
