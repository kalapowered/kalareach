# Clippy reads the nearest clippy.toml, so this file stands in for the repository's for this package
# alone. It sets no minimum Rust version of its own: the package's `rust-version`, which is the
# repository's, is the one Clippy then uses.
#
# This crate tells a person what the machine showed, and it decides on what it read. A read has three
# answers: there, not there, and could not be read. The methods below fold the third answer into one
# of the first two, so a failed read becomes a statement about the machine or a decision. Read with
# `records::look`, or with a call that returns the error, and carry the error to the text. A place
# where nothing rests on the fold (a clean-up whose text claims nothing, a display that names the
# identifier instead) carries `#[expect(clippy::disallowed_methods, reason = "...")]` with the reason,
# on the statement that makes the fold and never on a whole function, so that a later fold in the
# same function is a place of its own that needs its own reason.
#
# Iterating over a result is covered in three ways. `Result::iter` and `Result::iter_mut` are
# listed, and so are the iterator methods that skip what fails (`flatten`, `flat_map`, `filter_map`).
# A `for` loop over a `Result` is refused by the compiler's own lint, which `-D warnings` makes an
# error, and `Result::into_iter` has no path that this list can name.
#
# The waits and the completion calls are listed with their `Ex` forms (alertable waits, a signal and a
# wait in one call, the completion routines). `MsgWaitForMultipleObjects` and its `Ex` form are in
# `Win32_UI_WindowsAndMessaging`, which this package's features leave out, so no call to them compiles
# and no path to them resolves: a call needs that feature, and then both go in this list.

disallowed-methods = [
    { path = "std::path::Path::exists", reason = "it answers false when the look failed; look with records::look, or with std::fs::metadata and keep the error" },
    { path = "std::path::Path::is_file", reason = "it answers false when the look failed; look with records::look, or with std::fs::metadata and keep the error" },
    { path = "std::path::Path::is_dir", reason = "it answers false when the look failed; look with records::look, or with std::fs::metadata and keep the error" },
    { path = "std::path::Path::is_symlink", reason = "it answers false when the look failed; look with std::fs::symlink_metadata and keep the error" },
    { path = "std::result::Result::ok", reason = "it drops the error of a failed read; match on the Result and carry the error" },
    { path = "std::result::Result::unwrap_or", reason = "it turns a failed read into a value; match on the Result and carry the error" },
    { path = "std::result::Result::unwrap_or_default", reason = "it turns a failed read into a value; match on the Result and carry the error" },
    { path = "std::result::Result::unwrap_or_else", reason = "it turns a failed read into a value; match on the Result and carry the error" },
    { path = "std::result::Result::or", reason = "it replaces a failed read with another result; match on the Result and carry the error" },
    { path = "std::result::Result::or_else", reason = "it replaces a failed read with another result; match on the Result and carry the error" },
    { path = "std::result::Result::iter", reason = "it iterates over nothing for a failed read, so the error disappears; match on the Result and carry the error" },
    { path = "std::result::Result::iter_mut", reason = "it iterates over nothing for a failed read, so the error disappears; match on the Result and carry the error" },
    { path = "std::iter::Iterator::flatten", reason = "over results it skips the failed ones; match on each result and carry the error" },
    { path = "std::iter::Iterator::flat_map", reason = "over results it skips the failed ones; match on each result and carry the error" },
    { path = "std::iter::Iterator::filter_map", reason = "over results it skips the failed ones; match on each result and carry the error" },
    { path = "std::result::Result::is_ok", reason = "it turns a failed read into false; match on the Result and carry the error" },
    { path = "std::result::Result::is_err", reason = "it turns a failed read into a statement; match on the Result and carry the error" },
    { path = "std::result::Result::is_ok_and", reason = "it turns a failed read into false; match on the Result and carry the error" },
    { path = "std::result::Result::is_err_and", reason = "it turns an answer into a statement about the error; match on the Result" },
    { path = "std::result::Result::map_or", reason = "it turns a failed read into a value; match on the Result and carry the error" },
    { path = "std::result::Result::map_or_else", reason = "it turns a failed read into a value; match on the Result and carry the error" },
    { path = "windows_sys::Win32::System::Threading::WaitForSingleObject", reason = "it answers a failure as a number that a caller can take for a timeout or for the object; wait with ffi::wait, which answers signalled, timed out or failed" },
    { path = "windows_sys::Win32::System::Threading::WaitForMultipleObjects", reason = "it answers a failure as a number that a caller can take for a timeout or for an object; wait with ffi::wait_any, which answers the object, timed out or failed" },
    { path = "windows_sys::Win32::System::Pipes::PeekNamedPipe", reason = "it answers a failure as an error that a caller can take for the end of the pipe; read with ffi::pipe_read, which answers data, ended or failed" },
    { path = "windows_sys::Win32::Storage::FileSystem::ReadFile", reason = "it answers a failure as an error that a caller can take for the end of the pipe; read a pipe with ffi::pipe_read, which answers data, ended or failed, and a transfer with the pipe module's own wait" },
    { path = "windows_sys::Win32::System::Threading::WaitForSingleObjectEx", reason = "it answers a failure as a number that a caller can take for a timeout or for the object, and a wait that a completion routine ended as a third; wait with ffi::wait, which answers signalled, timed out or failed" },
    { path = "windows_sys::Win32::System::Threading::WaitForMultipleObjectsEx", reason = "it answers a failure as a number that a caller can take for a timeout or for an object, and a wait that a completion routine ended as a third; wait with ffi::wait_any, which answers the object, timed out or failed" },
    { path = "windows_sys::Win32::System::Threading::SignalObjectAndWait", reason = "it signals one object and waits on another, and answers a failure as a number that a caller can take for a timeout or for the object; signal with a call whose answer is checked, then wait with ffi::wait or ffi::wait_any" },
    { path = "windows_sys::Win32::System::IO::GetOverlappedResultEx", reason = "it answers a failed transfer, a transfer that is not complete and a wait that a completion routine ended the same way, as zero; read the result with ffi::overlapped_result, which tells done, not complete and failed apart" },
    { path = "windows_sys::Win32::System::IO::GetQueuedCompletionStatusEx", reason = "its answer is only a wake-up: the job's own count and the retained processes decide, so a call carries an expectation that says so at its one place" },
    { path = "windows_sys::Win32::Storage::FileSystem::ReadFileEx", reason = "it starts a read whose completion routine the platform calls later, and answers a failure as zero with an error to read; read a pipe with ffi::pipe_read, and a transfer with the pipe module's own wait" },
    { path = "windows_sys::Win32::System::IO::GetOverlappedResult", reason = "it answers a failed transfer and a transfer that is not complete the same way, as zero; read the result with ffi::overlapped_result, which tells done, not complete and failed apart" },
    { path = "windows_sys::Win32::System::Pipes::ConnectNamedPipe", reason = "it answers a failure, a connect that is pending and a client that is already there as the same zero with an error to read; connect with ffi::connect_named_pipe, which tells them apart" },
    { path = "windows_sys::Win32::System::Pipes::WaitNamedPipeW", reason = "its answer is only a wake-up: the open that follows decides, so a call carries an expectation that says so at its one place" },
    { path = "windows_sys::Win32::System::IO::GetQueuedCompletionStatus", reason = "its answer is only a wake-up: the job's own count and the retained processes decide, so a call carries an expectation that says so at its one place" },
]
