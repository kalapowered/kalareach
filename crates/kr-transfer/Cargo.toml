[package]
name = "kr-transfer"
description = "The KalaReach transfer service: uploads, verified downloads, handle-based filesystem authority and bounded previews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
image.workspace = true
kr-cbor.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# The filesystem clone a snapshot takes where the platform offers one: `clonefile` on Apple and the
# `FICLONE` ioctl on Linux, both as safe wrappers.
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The reparse-point attribute of an opened object, which `cap-std` exposes only through this trait.
cap-primitives = "=4.0.3"
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[dev-dependencies]
# The tests read a file identity the way the service does, through an opened directory.
cap-fs-ext.workspace = true
cap-std.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true

# The workspace forbids unsafe code, which a crate that creates a Windows directory with an
# owner-only access-control list, and reads one back to check it, cannot honour: both come from
# `advapi32`. This crate denies it instead and allows it in exactly one module, `windows`, which
# owns those calls. Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
