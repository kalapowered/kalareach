[package]
name = "kr-transfer"
description = "The KalaReach transfer service: uploads, verified downloads, handle-based filesystem authority and bounded previews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
image.workspace = true
kr-cbor.workspace = true
kr-flush.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# The filesystem clone a snapshot takes where the platform offers one: `clonefile` on Apple and the
# `FICLONE` ioctl on Linux, both as safe wrappers.
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The reparse-point attribute of an opened object, which `cap-std` exposes only through this trait.
cap-primitives = "=4.0.3"
# An opened object's owner and discretionary access-control list are read and written through
# `advapi32`, which is what this feature brings in beyond the workspace's own list.
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The mount race places and removes a bind mount inside a namespace of its own.
rustix = { workspace = true, features = ["fs", "mount"] }

[dev-dependencies]
# The tests read a file identity the way the service does, through an opened directory.
cap-fs-ext.workspace = true
cap-std.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true

# The workspace forbids unsafe code, which a crate that asks an opened file for its access-control
# list cannot honour: the platform reaches that list only through its own interface, which has no
# safe binding. This crate denies it instead and allows it in exactly two modules, `apple` and
# `windows`, each compiled on its own platform and each owning that platform's calls. Nothing else
# in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
