[package]
name = "kr-attention"
description = "The KalaReach attention engine: the rule set, quiet hours and escalation, review and visit acknowledgements, and the environment feature store they are rebuilt from, one across every session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# An item's key is a keyed digest, so a reader who is served the record without the session's text
# cannot try candidate texts against the key and find out which one it was.
hmac.workspace = true
kr-protocol.workspace = true
# The feature store is a small table of its own beside the session journal: per-actor
# acknowledgement revisions, consumed event cursors and the items rebuilt from them.
rusqlite = { workspace = true, features = ["bundled"] }
# An item's key is derived from the subject its condition is about, and a subject is sometimes a
# command line or an application's own notification text. A digest of the exact bytes keeps the key
# deterministic across a replay and bounded whatever it covers.
sha2.workspace = true
thiserror.workspace = true
# The key secret is random and lives as long as the store. A version-four identifier is the
# workspace's random source, and two of them are what the secret is built from.
uuid.workspace = true

# A database is journalled under the name it was opened by, so the store asks the file SQLite has
# open how many names reach it. On this platform that answer comes from the handle SQLite already
# holds, which is the one handle anything here has on the file.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# The rollback test holds a write lock on the store from outside, so the engine's own write is
# refused for a reason the test controls rather than one the filesystem happens to give it.
rusqlite = { workspace = true, features = ["bundled"] }
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
