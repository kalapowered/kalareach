[package]
name = "kr-term-probe"
description = "Runs a corpus of terminal sequences inside a physical terminal and compares where its cursor lands with the canonical grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-term-probe"
path = "src/bin/kr-term-probe.rs"

[dependencies]
kr-term.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio", "termios"] }

[lints]
workspace = true
