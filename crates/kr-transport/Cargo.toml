[package]
name = "kr-transport"
description = "KalaReach transport: iroh endpoints, the connection handshake, stream kinds, actor envelopes and dispatch leases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
boot-time.workspace = true
# A lookup answers as a stream, one item for each selected service.
futures.workspace = true
iroh.workspace = true
iroh-dns.workspace = true
iroh-mainline-address-lookup.workspace = true
iroh-mdns-address-lookup.workspace = true
iroh-relay.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-pairing.workspace = true
kr-protocol.workspace = true
# The HTTP client the Pkarr publisher and resolver use, so their proxy is the one this endpoint
# selects rather than one from the environment.
reqwest.workspace = true
serde.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
serde_json.workspace = true
# The loopback proxy and relay front the network tests stand between an endpoint and its relay.
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
