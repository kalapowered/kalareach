[package]
name = "kr-transport"
description = "KalaReach transport: iroh endpoints, the connection handshake, stream kinds, actor envelopes and dispatch leases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
boot-time.workspace = true
# A lookup answers as a stream, one item for each selected service.
futures.workspace = true
iroh.workspace = true
iroh-dns.workspace = true
iroh-mainline-address-lookup.workspace = true
iroh-mdns-address-lookup.workspace = true
iroh-relay.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-pairing.workspace = true
kr-protocol.workspace = true
# The HTTP client the Pkarr publisher and resolver use, so their proxy is the one this endpoint
# selects rather than one from the environment.
reqwest.workspace = true
serde.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Read, not used to connect: a relay's WebSocket upgrade that the network refused is reported in
# this crate's error types, which is where the refused status is found.
tokio-websockets.workspace = true
tracing.workspace = true
url.workspace = true

[features]
# The entry points that bind an endpoint asking one name server of the caller's choosing and no
# other, for this crate's own tests, which stand a name server of their own on loopback, and the
# constructors and counts of a control channel that the control daemon's tests read a frame at a
# moment of their own with. They are compiled only with this feature, and no shipped build enables
# it.
testing = []

[dev-dependencies]
# This crate's own tests, with the name-server choice above compiled in.
kr-transport = { path = ".", features = ["testing"] }
iroh = { workspace = true, features = ["test-utils"] }
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
# Certificates from an authority a test makes, for the relay front and the intercepting proxy.
rcgen.workspace = true
serde_json.workspace = true
# The loopback proxy and relay front the network tests stand between an endpoint and its relay.
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls.workspace = true

[lints]
workspace = true
