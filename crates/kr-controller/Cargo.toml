[package]
name = "kr-controller"
description = "The KalaReach control daemon: the environment registry, create admission, worker supervision and the local service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-controller"
path = "src/bin/kr-controller.rs"

# The description process with no model, which this crate's own tests start in place of
# `kr-describe-inference`. It is built only with the `testing` feature and is not part of any
# release: no installation names it.
[[bin]]
name = "kr-stub-inference"
path = "src/bin/kr-stub-inference.rs"
required-features = ["testing"]

[dependencies]
# Each time bound on authority is published whole through one atomic pointer, which the write
# boundary reads inside a poll.
arc-swap.workspace = true
# The delivery credential the gateway reads is 32 bytes in unpadded base64url.
base64.workspace = true
clap.workspace = true
kr-automation.workspace = true
iroh.workspace = true
kr-cbor.workspace = true
kr-changeset.workspace = true
# The managed-service seams: one HTTP exchange and one signature, both supplied by the embedder.
kr-client = { workspace = true, default-features = false }
kr-crypto.workspace = true
kr-delivery.workspace = true
# Session names, pins and generated-description provenance: the environment's session-metadata
# store and its deterministic titles. That crate holds no model runtime (kr-describe-model does),
# and this daemon maps none: it names every session from metadata.
kr-describe.workspace = true
kr-flush.workspace = true
kr-ipc.workspace = true
kr-loopback.workspace = true
kr-pairing.workspace = true
# The catalogue client: verification, storage and network, and no component engine, so this
# daemon links no Wasm engine.
kr-plugin-catalogue.workspace = true
kr-plugin-sdk.workspace = true
# The runtime's launcher and client, which link no engine: this daemon starts the plugin runtime and
# looks for one a previous daemon started, and never runs a component.
kr-plugin-service.workspace = true
kr-protocol.workspace = true
kr-project.workspace = true
kr-shell-integration.workspace = true
kr-transfer.workspace = true
kr-transport.workspace = true
kr-voice.workspace = true
kr-attention.workspace = true
kr-worker.workspace = true
# The model files are fetched with the HTTP client that kr-client's builder makes, whose type this
# crate names.
reqwest.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
# Mail submission, opened on a TLS stream verified against the platform's trust, which kr-client
# builds for every TLS client here, with no way to switch the verification off. The rendezvous
# room's socket is kr-client's.
rustls.workspace = true
# The older answer shape a compatibility reader accepts publishes its schema like any protocol
# message, so it is checked before typed decoding like any other.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
# A webhook's address is parsed once to find the origin it is delivered through.
url.workspace = true

[features]
# The pause the host's own tests use to stand between an attention action's admission and its
# store write, the hooks that place the description process, its clock and the conditions it reads,
# and the stub that stands in for the description process. It compiles to nothing without this
# feature, and no shipped build enables it.
testing = ["kr-describe/testing"]

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl.workspace = true

[dev-dependencies]
# The tests act exactly when a held rename was refused, through the retry's own seam, and make the
# flush of a directory fail after a rename.
kr-flush = { workspace = true, features = ["testing"] }
# This crate's own tests, with the pause above compiled in.
kr-controller = { path = ".", features = ["testing"] }
# The keys and expiry a catalogue suite test signs a generation of its own with, through the
# catalogue's own generation builder.
aws-lc-rs.workspace = true
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
jiff.workspace = true
kr-cbor.workspace = true
kr-client = { workspace = true, features = ["terminal"] }
# The change-set tests stop an apply where a crash would stop it, which the service compiles only
# for them.
kr-changeset = { workspace = true, features = ["fault-injection"] }
kr-crypto.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
# The bundle a test seeds a catalogue from is made of files of its own, trusting what the test names.
kr-plugin-catalogue = { workspace = true, features = ["testing"] }
# The managed storage and backup manifest services, on a loopback socket, for the daemon's carrier
# of its backup outbox to talk to.
kr-service-stand-in = { path = "../../tests/support/service-stand-in" }
kr-term.workspace = true
kr-transfer.workspace = true
# The connector packages a test publishes and installs are the worker's own test packages, so the
# integrations a session is given are read from the packages a worker reads.
kr-worker = { workspace = true, features = ["testing"] }
# Certificates a test issues for a loopback TLS server of its own, so a rendezvous request, the
# room's WebSocket and mail submission are checked against a real handshake.
rcgen.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
tempfile.workspace = true
# The catalogue's fetch, asked directly, to show which proxy a repository is fetched through.
tough.workspace = true
# A loopback room for the host's WebSocket to attach to, and the room's end of it.
futures-util.workspace = true
tokio-websockets = { workspace = true, features = ["server"] }

[lints]
workspace = true
