[package]
name = "kr-cli"
description = "The KalaReach command line: create, attach, detach, close, list, status and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr"
path = "src/bin/kr.rs"

[[bin]]
name = "kr-attach-guard"
path = "src/bin/kr-attach-guard.rs"

[dependencies]
clap.workspace = true
kr-cbor.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
rustix = { workspace = true, features = ["stdio", "termios"] }
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
kr-ipc = { workspace = true, features = ["testing"] }

[lints]
workspace = true
