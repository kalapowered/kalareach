[package]
name = "kr-cli"
description = "The KalaReach command line: create, attach, detach, close, list, status and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr"
path = "src/bin/kr.rs"

[[bin]]
name = "kr-attach-guard"
path = "src/bin/kr-attach-guard.rs"

[dependencies]
# The trust root a repository is added with travels in the request as standard base64.
base64.workspace = true
clap.workspace = true
# A release archive `kr host update` stages: gzip, then tar.
flate2.workspace = true
kr-cbor.workspace = true
kr-client = { workspace = true, features = ["terminal"] }
kr-controller = { workspace = true }
# The key a first owner's confirmation is signed with at this terminal.
kr-crypto.workspace = true
# A service definition moved aside for a check is put back as the machine store publishes a record.
kr-flush.workspace = true
kr-ipc.workspace = true
# The owner-confirmation proof and the grants an invitation proposes.
kr-pairing.workspace = true
kr-protocol.workspace = true
kr-shell-integration.workspace = true
kr-term.workspace = true
# The sign-in address, opened in the default browser.
open.workspace = true
qrcodegen.workspace = true
rmcp.workspace = true
schemars.workspace = true
# The free space staging a release needs is read from the filesystem it goes to.
rustix = { workspace = true, features = ["fs", "stdio", "termios"] }
serde.workspace = true
serde_json.workspace = true
# The digest of each file a release lists, read as it is unpacked or copied.
sha2.workspace = true
signal-hook.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
# A release is checked against the update channel's root: a threshold of the keys that root names
# for its targets role signs each release's manifest. The root's format and its signature check
# are The Update Framework's, the same code the plugin catalogue verifies with; the role types it
# checks carry an expiry, which is why its time type is here too.
jiff.workspace = true
tough.workspace = true

[dev-dependencies]
# The update tests make channel roots and sign release manifests with keys of their own.
aws-lc-rs.workspace = true
# The tests act exactly when a held rename was refused, through the retry's own seam.
kr-flush = { workspace = true, features = ["testing"] }
# The Windows start and pairing tests register a test environment's scheduled task and host a
# daemon that starts its workers through it.
kr-controller = { workspace = true, features = ["testing"] }
# The attach tests host a real session and run `kr` against it on a real pseudo-terminal.
kr-ipc = { workspace = true, features = ["testing"] }
# The contact tests read what the session's worker was sent, so they can count the bounded waits
# one long poll renews and the subscriptions it holds.
kr-worker = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
# The contact tests drive `kr agent-tools --stdio` the way an installed agent does: as a child
# process speaking the Model Context Protocol over its standard streams. They also feed the
# session's attention engine an upstream approval, and checkpoint the session's journal from a
# connection of their own while a wait is under way.
kr-attention.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw", "transport-child-process"] }
rusqlite.workspace = true
# The setup tests write a home directory of their own rather than this user's.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace forbids unsafe code, which a crate that calls the console API cannot honour. This
# crate denies it instead and allows it in exactly one module, `terminal::windows::console`, which
# owns every call into the operating system. Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
