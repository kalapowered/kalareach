[package]
name = "kr-cli"
description = "The KalaReach command line: create, attach, detach, close, list, status and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr"
path = "src/bin/kr.rs"

[[bin]]
name = "kr-attach-guard"
path = "src/bin/kr-attach-guard.rs"

[dependencies]
clap.workspace = true
kr-cbor.workspace = true
kr-client.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
kr-shell-integration.workspace = true
kr-term.workspace = true
rmcp.workspace = true
schemars.workspace = true
rustix = { workspace = true, features = ["stdio", "termios"] }
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
# The attach tests host a real session and run `kr` against it on a real pseudo-terminal. Both
# dependencies are tests only, so the command itself does not carry them.
kr-crypto.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
kr-worker.workspace = true
portable-pty.workspace = true
# The contact tests drive `kr agent-tools --stdio` the way an installed agent does: as a child
# process speaking the Model Context Protocol over its standard streams.
rmcp = { workspace = true, features = ["client", "transport-async-rw", "transport-child-process"] }
# The setup tests write a home directory of their own rather than this user's.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace forbids unsafe code, which a crate that calls the console API cannot honour. This
# crate denies it instead and allows it in exactly one module, `terminal::windows::console`, which
# owns every call into the operating system. Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
