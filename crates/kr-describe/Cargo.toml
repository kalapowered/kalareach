[package]
name = "kr-describe"
description = "The KalaReach description service: deterministic session titles, the scheduler and resource policy for one shared CPU-only inference process per execution environment, its signed model profiles, the wire to that process and its serving code, and the names, pins and provenance store; the model runtime itself is kr-describe-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# What the tests of this crate and of kr-describe-model drive: a model that answers from the prompt,
# and the stub executable that serves it over real pipes.
testing = []

[[bin]]
name = "kr-describe-stub"
path = "src/bin/kr-describe-stub.rs"
required-features = ["testing"]

[dependencies]
# The profile's identity is signed over a canonical encoding, not over a JSON rendering, so the
# transcript is built the same way every other signature in this product is built.
kr-cbor.workspace = true
kr-crypto.workspace = true
# The description process reports its own start identity when it says it is ready, so the daemon
# can end that process and no other.
kr-ipc.workspace = true
kr-protocol.workspace = true
# Privacy mode's contract. Section 24 gives every subsystem one trait, and this crate implements
# it over its own stores rather than restating the rule.
kr-worker.workspace = true
# Names, pins and generated-description provenance are a store of their own beside the session
# journal, because section 24 gives them their own owner and they outlive the session.
rusqlite = { workspace = true, features = ["bundled"] }
# The wire to the description process is section 23's frame, read against each message's schema
# before it is decoded, as every other frame in this product is.
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# The qualified available-memory signal the reserve is checked against, and the process figures
# reported beside the separated model and runtime ones.
sysinfo.workspace = true
thiserror.workspace = true
# Background scheduling for the inference thread, through the one mechanism this build can apply
# on each platform. What it cannot apply, it reports as unqualified rather than assuming.
thread-priority.workspace = true
# The end of an answer that ran out of room falls on a boundary between characters a person sees.
unicode-segmentation.workspace = true

# The description process's environment lock: an exclusive advisory lock the operating system
# releases when the process ends, as the daemon's own singleton lock is.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
kr-describe = { path = ".", features = ["testing"] }
# Places the stub executable on the internal disk before a test starts it.
kr-ipc = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Reads the build settings the processor baseline is held equal to.
toml_edit.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
