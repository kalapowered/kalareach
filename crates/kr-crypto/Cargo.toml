[package]
name = "kr-crypto"
description = "KalaReach cryptography: a narrow libsodium wrapper, purpose-separated keys and secret storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-crypto-vectors"
path = "src/bin/kr-crypto-vectors.rs"

[dependencies]
hkdf.workspace = true
hmac.workspace = true
keyring.workspace = true
kr-cbor.workspace = true
# The host's shared directory flush, which the directory store's names are flushed through.
kr-flush.workspace = true
libc.workspace = true
kr-protocol.workspace = true
libsodium-sys-stable.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# The Apple mobile systems. `keyring`'s default backend set turns on the Apple keychain store
# without its protected-data mode, and that store refuses to build for iOS without it: an item
# there is readable only after the device has been unlocked once, which is the only accessibility
# class a key on a phone should have. The feature is named here rather than in whatever happens to
# link this crate, because it is this crate's keychain backend and this crate's decision.
[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[dependencies.serde]
workspace = true

[dependencies.hex]
workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace forbids unsafe code, which a crate that calls a C library cannot honour. This
# crate denies it instead and allows it in exactly one module, `sodium`, which owns every call
# into libsodium. Nothing else in the tree may relax the workspace rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
