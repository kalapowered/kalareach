[package]
name = "kr-client"
description = "KalaReach native client library: local IPC and iroh connections, typed methods, cursors and replaceable service clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The account sign-in: the S256 challenge is base64url of a SHA-256 digest, an ID token's payload
# is base64url JSON, and a returned state is compared in constant time.
base64.workspace = true
# The rendezvous room socket carries its frames in one task, which polls both directions at once.
futures-util.workspace = true
iroh.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-flush.workspace = true
kr-ipc.workspace = true
# The candidate's half of pairing: its state machines, proofs and attempt budget, which the pairing
# module drives over the transport the host serves.
kr-pairing.workspace = true
# The document union, the control model and the visibility grammar a package contributes. A client
# renders what packages produce, so the contract it renders against is the package contract's.
kr-plugin-sdk.workspace = true
kr-protocol.workspace = true
# Only the projected screen needs it, and only a client with a local terminal to paint has one.
kr-term = { workspace = true, optional = true }
kr-transport.workspace = true
# The managed-service transport, with the feature set the workspace cuts it to.
reqwest.workspace = true
# Named so this client can install the TLS provider it is built on when the process has none. A
# process that already chose one keeps it, so what this buys is a default and not a guarantee.
rustls.workspace = true
# The operating system's certificate verifier, which every TLS client here verifies a server with
# on macOS, Windows, iOS and Android. On Linux it would trust whatever SSL_CERT_FILE or SSL_CERT_DIR
# names, so there the distribution's store is read directly instead (`services::http`).
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
# The rendezvous room socket opens its own TCP connection, so its TLS and its upgrade are the room's
# alone.
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
tokio-websockets.workspace = true
tracing.workspace = true
# A request address is compared with the configured gateway origin as a parsed scheme, host and
# port, because two spellings of one address are one origin and text comparison would say they are
# not.
url.workspace = true
zeroize.workspace = true

[features]
# Everything a client with a terminal on the same machine needs, which is everything.
default = ["terminal"]
# The projection's painter and the pinned Unicode width model it measures runs with.
#
# It is a feature rather than always present because the width model is measured by a terminal
# state library whose own dependency does not build for Apple's mobile systems, and because a
# phone has no local terminal to paint. A phone still holds a host's projection with the same
# code as every other client, since a screen and its updates are protocol values, and draws the
# held screen itself. A mobile client therefore takes this library without this feature, and
# everything else in it, the held screen included, is the same code on every platform.
terminal = ["dep:kr-term"]

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
# A disposable owner-only host tree, so a local endpoint in a test lives on the internal disk and
# disappears with the test.
kr-ipc = { workspace = true, features = ["testing"] }
# The transport's contract is checked against a TLS server the test starts on loopback, so the
# test issues that server's certificates and answers the handshake itself.
rcgen.workspace = true
# A test host answers with a result type of the test's own, which publishes its schema like any
# protocol message so the client can read it.
schemars.workspace = true
# The draft store writes to a caller-supplied directory, so its tests supply a disposable one.
tempfile.workspace = true
# The loopback server listens and reads, which the library itself has no need to do, and a test
# that stalls the server in one phase of an exchange drives the clock itself rather than waiting
# out a deadline in real time.
# The account lock is held across processes, so its test starts this test binary as two children.
tokio = { workspace = true, features = ["io-util", "net", "process", "test-util"] }
tokio-rustls.workspace = true
# The room's end of a rendezvous socket in the room socket's tests.
tokio-websockets = { workspace = true, features = ["server"] }

[lints]
workspace = true
