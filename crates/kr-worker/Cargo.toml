[package]
name = "kr-worker"
description = "The KalaReach session worker: pseudo-terminal, lifecycle, attachments, input lease and receipt journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-worker"
path = "src/bin/kr-worker.rs"

[dependencies]
clap.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-ipc.workspace = true
# A connector is read from its installed package with the SDK's own package check, and its table is
# the SDK's: the core declarative table cannot express a protocol of notification pairs.
kr-plugin-sdk.workspace = true
kr-protocol.workspace = true
kr-shell-integration.workspace = true
kr-term.workspace = true
# A reverse file operation an upstream asks for runs through the transfer service's handle-based
# file authority, never through a path of its own. The worker calls that authority and nothing
# else of the crate: its previews and their image decoders are linked with it and never reached.
kr-transfer.workspace = true
kr-transport.workspace = true
libc.workspace = true
portable-pty.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustix = { workspace = true, features = ["event", "param", "process", "termios", "time"] }
serde.workspace = true
# An executable an integrated invocation runs is hashed through the one descriptor its identity is
# read from, a megabyte at a time, rather than read whole into memory first.
sha2.workspace = true
# The gateway's core-declarative path reads a connector's frames itself, without calling a
# component: the table says which member carries the request identifier and which carries the
# method, and this is what reads them. A parser written here instead would be a second JSON
# implementation inside the trusted core.
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# The terminal is this host's own pseudo-console, because the pipe modes its boundaries need cannot
# be set on a pipe after it exists. `windows-sys` is what creates it; `anyhow` is only what the
# terminal library's traits report a failure as.
anyhow.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The question ledger records the executable and the parent of a calling process, which macOS
# answers through the same process-information calls the host's identity checks already use.
libproc.workspace = true
# An adopted program's argument vector, which macOS keeps as `KERN_PROCARGS2`.
sysinfo.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
sysinfo.workspace = true

[features]
# The pause the host's own tests use to enter the window between a durable receipt acceptance and
# the broker's admission of the same mutation. It compiles to nothing without this feature, and no
# shipped build enables it.
testing = []

[dev-dependencies]
# This crate's own tests, with the pause above compiled in. A test cannot otherwise stand inside
# the interval the dispatch marker divides, because every other seam a test controls is called
# under the broker's own lock.
kr-worker = { path = ".", features = ["testing"] }
kr-cbor.workspace = true
# The performance measurement stops its clock when a *client* is holding a screen and has drawn
# it, which is what the section-27 figure means by usable. That is the client library's own work,
# so the measurement uses the client library rather than a second opinion about it.
kr-client = { workspace = true, features = ["terminal"] }
# The host tests start a real control daemon beside a real worker. The dependency is only in
# tests, so the two crates do not depend on each other at build time.
kr-controller.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }
# The committed time fixture is JSON, and so is the shell package manifest the host tests describe:
# one records what three operating systems report, the other an installation of their own.
serde_json.workspace = true
# What an earlier build of this host wrote is a stored shape, so the tests that prove a journal
# migrates and that retention keeps what it must write those rows themselves.
rusqlite = { workspace = true, features = ["bundled"] }
# A session that launches a real shell package needs a home directory on the internal disk that is
# removed with the test, because nothing a launched process opens may be in the workspace.
tempfile.workspace = true

# The workspace forbids unsafe code, which a crate that waits on the terminal's own descriptor
# cannot honour. This crate denies it instead and allows it in exactly two modules:
# `pty::descriptor`, which owns that single wait, and `action::adapter::unix`, which reads the
# kernel's clock discipline through the one interface the platform exposes for it. Nothing else in
# this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
