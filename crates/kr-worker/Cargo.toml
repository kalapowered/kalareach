[package]
name = "kr-worker"
description = "The KalaReach session worker: pseudo-terminal, lifecycle, attachments, input lease and receipt journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-worker"
path = "src/bin/kr-worker.rs"

[dependencies]
clap.workspace = true
kr-cbor.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
kr-term.workspace = true
kr-transport.workspace = true
portable-pty.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
kr-cbor.workspace = true
# The host tests start a real control daemon beside a real worker. The dependency is only in
# tests, so the two crates do not depend on each other at build time.
kr-controller.workspace = true
kr-crypto.workspace = true
kr-ipc = { workspace = true, features = ["testing"] }

# The workspace forbids unsafe code, which a crate that waits on the terminal's own descriptor
# cannot honour. This crate denies it instead and allows it in exactly one module, `pty::descriptor`,
# which owns that single call. Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
