[package]
name = "kr-voice"
description = "The KalaReach voice coordinator: context selection, delegation, the voice grant and the unlocked-screen confirmation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kr-cbor.workspace = true
# The broker contract and the replaceable provider seam. A voice session reaches a managed call
# through this crate and through nothing else.
kr-client = { workspace = true, default-features = false }
kr-crypto.workspace = true
kr-protocol.workspace = true
thiserror.workspace = true

[features]
# The seam a test uses to script what a person says, for the actions the host's grammar does not
# read yet. It compiles to nothing without this feature, and no shipped build enables it.
testing = []

[dev-dependencies]
# This crate's own tests, with the seam above compiled in.
kr-voice = { path = ".", features = ["testing"] }
kr-cbor.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
