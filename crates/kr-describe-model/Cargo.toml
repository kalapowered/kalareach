[package]
name = "kr-describe-model"
description = "The KalaReach description model: the CPU-only llama.cpp runtime the description process runs, the check that a downloaded model file is the one its signed profile records, the description process executable, and the benchmark that measures them against real weights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The description service: the serving code and model seam the description process runs, the
# signed profiles whose assets it verifies, and the service the benchmark drives. That crate holds
# no model; this one is the only crate that does, so a process that links the service alone links no
# model runtime.
kr-describe.workspace = true
kr-protocol.workspace = true
# The privacy generation a benchmarked answer is validated under, which the description service's
# own types carry.
kr-worker.workspace = true
# The runtime. CPU only: no GPU or accelerator feature is asked for here, and every profile this
# crate will load records zero GPU layers.
llama-cpp-2.workspace = true
llama-cpp-sys-2.workspace = true
# Streaming digests of model assets, which are gigabytes and are never read into memory whole.
sha2.workspace = true
# The benchmark's whole-process and model figures.
sysinfo.workspace = true
# The benchmark's terminal workload.
vtparse.workspace = true

[dev-dependencies]
kr-crypto.workspace = true
# Places the description process on the internal disk before a test starts it.
kr-ipc = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Where an answer ended early may end: on a boundary between characters a person sees.
unicode-segmentation.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
