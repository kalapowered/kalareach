[package]
name = "kr-plugin-runtime"
description = "KalaReach component hosting: the Wasmtime engine, per-instance limits, the compiled-code cache, the binding lifecycle and the plugin host that serves them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-ipc.workspace = true
kr-plugin-sdk.workspace = true
kr-plugin-service.workspace = true
kr-protocol.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
thread-priority.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
wasmtime.workspace = true

# The open flag that stops a name replaced by a named pipe from holding a read open until somebody
# writes to it. `cap-std` exposes it through its own `OpenOptionsExt`; the constant is this crate's
# only use of the C library.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# What this crate's own tests use to hold the engine's epoch still and advance it one tick at a
# time. It compiles to nothing without this feature, and no shipped build enables it.
testing = []

[dev-dependencies]
# This crate's own tests, with the held epoch reachable: a deadline is reached when a test advances
# the epoch, never because the machine was slow.
kr-plugin-runtime = { path = ".", features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
# The bundled generation is seeded into a catalogue with no network, under a kernel denial of it.
kr-plugin-catalogue = { workspace = true, features = ["testing"] }
tempfile.workspace = true

# The workspace forbids unsafe code, which a crate that reads a compiled artefact back cannot
# honour: `wasmtime::component::Component::deserialize_file` is an unsafe function. This crate
# denies it instead and allows it in exactly one module, `runtime::cache`, which owns that single
# call and verifies the file's own manifest before it makes it. Nothing else in this crate may
# relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
