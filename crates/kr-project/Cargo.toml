[package]
name = "kr-project"
description = "The KalaReach project service: repositories, workspaces, the restricted Git execution profile and staged publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The record of what this service made in its own temporary directory is opened without following a
# link, which `cap-std` offers only through this trait.
cap-fs-ext.workspace = true
cap-std.workspace = true
kr-cbor.workspace = true
kr-flush.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
kr-transfer.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# The no-replace rename a staged repository is published with: `renameat2(RENAME_NOREPLACE)` on
# Linux and `renameatx_np(RENAME_EXCL)` on Apple, both as safe wrappers.
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The boundary every Git invocation runs inside on this platform.
landlock.workspace = true

[target.'cfg(windows)'.dependencies]
# The boundary every Git invocation runs inside on this platform: an application container with its
# own grants, inside a job object that ends every descendant.
windows-sys = { workspace = true, features = [
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
# The tests act exactly when a held rename was refused, through the retry's own seam.
kr-flush = { workspace = true, features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
# The recovery tests put the journal into the state a crash leaves, which means writing the rows a
# dying daemon would have left rather than asking the service to pretend.
rusqlite = { workspace = true, features = ["bundled"] }
# The crate's own tests build real repositories with installed Git and act in the seams the
# `git-fixtures` feature compiles. They get the feature from here, so that a plain `cargo test`
# runs them, and so that no build that is not a test build has it.
kr-project = { path = ".", features = ["git-fixtures"] }
# The restricted-profile fixture is one committed document, read by the tests that plant it.
serde_json.workspace = true
tempfile.workspace = true

[features]
# The seams the tests act in (`ProjectService::interpose`, `before_reconciling` and
# `after_publication`, and the types and queries they use), which nothing in the service ever sets,
# and the tests that build real repositories with the installed Git, including the
# restricted-profile fixtures whose planted helpers must never run. No build enables it but a test
# build of this crate and of the crates whose tests act in the seams: a build that ships this
# crate has none of them, which `tests/shipped.rs` shows.
git-fixtures = []

# The workspace forbids unsafe code, which a crate that applies an operating-system boundary to a
# child process cannot honour: each platform's mechanism is a call with no safe form. This crate
# denies it instead and allows it in the four modules of `boundary` that own those calls. Nothing
# else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
