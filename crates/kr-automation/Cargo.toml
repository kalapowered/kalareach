[package]
name = "kr-automation"
description = "The KalaReach automation engine: workflow definitions, runs, causal budgets and admission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kr-attention.workspace = true
kr-changeset.workspace = true
# The journal is opened the way every store is, waiting out a previous holder that is letting go.
kr-flush = { workspace = true, features = ["sqlite"] }
kr-ipc.workspace = true
kr-project.workspace = true
kr-protocol.workspace = true
kr-transfer.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The test that stands the journal in the interval its previous holder is letting go of its index.
kr-flush = { workspace = true, features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
# The source workflow's tests hold the bound a brokered Git read is given, in the seam the project
# service compiles only for tests.
kr-project = { workspace = true, features = ["git-fixtures"] }
tempfile.workspace = true

[lints]
workspace = true
