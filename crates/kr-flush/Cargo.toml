[package]
name = "kr-flush"
description = "KalaReach's directory flush: how every local store makes a name it changed survive a crash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
# A held directory is opened again relative to its own descriptor.
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# A held directory is opened again relative to its own handle, which only the native open offers.
windows-sys.workspace = true

# The workspace forbids unsafe code, which a crate that asks the kernel directly cannot honour. This
# crate denies it instead and allows it in exactly one module, `windows`, which opens a held
# directory a second time relative to its handle. Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
