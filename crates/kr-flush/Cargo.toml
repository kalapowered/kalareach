[package]
name = "kr-flush"
description = "KalaReach's local store durability: the directory flush and file lock that make a store's names survive a crash and keep two processes from writing one store, and the open of a store whose previous holder is still letting go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# What a store's own tests use to act exactly when one of its renames was refused as held, to make
# the flush of one directory fail after the name it follows was given, and to stand a store in the
# interval its previous holder is letting go of its index: never enabled in a build a store ships.
testing = []
# The open of a SQLite store whose previous holder is still letting go of it ([`release`]). A store
# that uses SQLite asks for it; a crate that does not links no SQLite for it.
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# A held directory is opened again relative to its own descriptor, a store's lock is taken on its
# file, and a directory that is another account's is told by the owner of the process.
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# A held directory is opened again relative to its own handle, which only the native open offers.
# `Win32_System_Memory` is for the test seam that holds a store's index mapped the way a process
# that is ending does (`release::held_index`), which no shipped build compiles.
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

# The workspace forbids unsafe code, which a crate that asks the kernel directly cannot honour. This
# crate denies it instead and allows it in the `windows` module, which opens a held directory a
# second time relative to its handle, and in the test seam that maps a store's index file the way a
# process that is ending holds it (`release::held_index`, compiled only for tests on Windows).
# Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
