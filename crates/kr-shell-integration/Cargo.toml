[package]
name = "kr-shell-integration"
description = "The KalaReach root-editor bridge contract: transport and handshake, reader events, the fence and detach state machine and the cross-shell fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kr-shell-fixtures"
path = "src/bin/kr-shell-fixtures.rs"

[dependencies]
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-ipc.workspace = true
kr-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# A startup file is rewritten under a lock the kernel holds, so a `kr` process that dies releases
# it rather than leaving a file every later write would wait on.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# The package tests drive a built shell in a real pseudo-terminal and check its proof against the
# transcript this contract defines.
hmac.workspace = true
# A program a test writes is placed by a process of its own, so that no child another test starts
# holds it open for writing when it is started.
kr-ipc = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
