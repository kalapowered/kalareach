[package]
name = "kr-ipc"
description = "KalaReach local typed-frame IPC: runtime directories, peer credentials, host identities and worker descriptors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-protocol.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process", "time"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true
sysctl.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
sysinfo.workspace = true
widestring.workspace = true
windows-sys.workspace = true

[features]
# A disposable owner-only host tree for the other host crates' tests.
testing = []

[dev-dependencies]
kr-ipc = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace forbids unsafe code, which a crate that reads the machine's own interrupt-time
# counter and duplicates its own connection's handle cannot honour. This crate denies it instead and
# allows it in exactly two modules: `clock::windows`, which owns the counter call, and
# `endpoint::platform::handle`, which owns duplicating a pipe handle and handing it to the runtime.
# Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
