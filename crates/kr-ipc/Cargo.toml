[package]
name = "kr-ipc"
description = "KalaReach local typed-frame IPC: runtime directories, peer credentials, host identities and worker descriptors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-flush.workspace = true
kr-protocol.workspace = true
rustix = { workspace = true, features = ["fs", "mm", "net", "process", "time"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true
sysctl.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
widestring.workspace = true
# The owner-only access-control list a private directory carries is built and read through
# `advapi32`, the clock floor's file is mapped through `kernel32`'s file mappings, and a file's
# access is read with the entry types and security classes the system services declare: those
# are the first three features this crate brings in beyond the workspace's own list. The boot
# identity is read from the kernel's process list and from the boot counter in the page the kernel
# shares with every process: the last four declare that call and that page's layout.
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_SystemServices", "Wdk_System_SystemInformation", "Wdk_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[features]
# A disposable owner-only host tree for the other host crates' tests.
testing = []

[dev-dependencies]
# The tests act exactly when a held rename was refused, through the retry's own seam.
kr-flush = { workspace = true, features = ["testing"] }
kr-ipc = { workspace = true, features = ["testing"] }
# The store's tests write the release manifests every process of a release reads at its start.
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace forbids unsafe code, which a crate that asks the kernel directly cannot honour. This
# crate denies it instead and allows it in exactly eight modules, each of which says why:
# `clock::windows` (the interrupt-time counter), `paths::windows` (owner-only access-control lists),
# `paths::account` (the system's account database, which a directory-service account is only in),
# `identity::process_times` (a process's creation time, whether it has exited, and ending it),
# `identity::macos_signal` (a process's version on macOS, and signalling a process by it),
# `identity::boot_records` (the kernel's process list and its boot counter),
# `floor::platform` (the shared mapping of the clock floor's file and the atomics on it, on each
# platform) and `starter::windows` (the launch pipe, a process's facts and a child created
# suspended). Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
