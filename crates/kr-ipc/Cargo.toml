[package]
name = "kr-ipc"
description = "KalaReach local typed-frame IPC: runtime directories, peer credentials, host identities and worker descriptors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kr-cbor.workspace = true
kr-crypto.workspace = true
kr-protocol.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process", "time"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true
sysctl.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
sysinfo.workspace = true
widestring.workspace = true
# The owner-only access-control list a private directory carries is built and read through
# `advapi32`, which is what this feature brings in beyond the workspace's own list.
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[features]
# A disposable owner-only host tree for the other host crates' tests.
testing = []

[dev-dependencies]
kr-ipc = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace forbids unsafe code, which a crate that asks the Windows kernel directly cannot
# honour. This crate denies it instead and allows it in exactly three Windows modules, each of which
# says why: `clock::windows` (the interrupt-time counter), `paths::windows` (owner-only access-control
# lists) and `identity::process_times` (a process's creation time and whether it has exited).
# Nothing else in this crate may relax the rule.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
