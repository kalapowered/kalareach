  "named": [
    {
      "scope": "environment",
      "path": "*.partial",
      "reason": "a temporary file an interrupted write left; nothing reads it"
    },
    {
      "scope": "environment",
      "path": ".*.tmp",
      "reason": "a temporary file an interrupted write left; nothing reads it"
    },
    {
      "scope": "environment",
      "path": ".config.lock",
      "reason": "the lock on the configuration document; empty"
    },
    {
      "scope": "environment",
      "path": ".machine-group.*",
      "reason": "a temporary file an interrupted step left; nothing reads it"
    },
    {
      "scope": "environment",
      "path": "backup",
      "reason": "the backup service's staging area: objects in the archive's own formats"
    },
    {
      "scope": "environment",
      "path": "boot",
      "reason": "the boot the environment last ran in; a record that does not decode is read as none and written again, which costs one pass over sessions of an earlier boot"
    },
    {
      "scope": "environment",
      "path": "capabilities",
      "reason": "the capability revision, a number as text; an environment whose record cannot be read keeps revision zero"
    },
    {
      "scope": "environment",
      "path": "catalogue",
      "reason": "the plugin catalogue's repositories: TUF metadata and package payloads in the formats TUF and the package format fix, and each repository's trust checkpoint under datastore/ in TUF's metadata form; the catalogue's database is the store of that name"
    },
    {
      "scope": "environment",
      "path": "controller-identity",
      "reason": "a marker that the controller's keys were made, which names the kind of key store; read as absent when it cannot be read"
    },
    {
      "scope": "environment",
      "path": "controller-service.lock",
      "reason": "the lock on the service definition; empty"
    },
    {
      "scope": "environment",
      "path": "controller.lock",
      "reason": "the daemon's singleton lock, which holds its process number as text"
    },
    {
      "scope": "environment",
      "path": "controller.log",
      "reason": "the daemon's log, as text"
    },
    {
      "scope": "environment",
      "path": "environment",
      "reason": "the environment's identity, written once as text and never changed"
    },
    {
      "scope": "environment",
      "path": "jobs",
      "reason": "per-session launch definitions and their diagnostics, named by session and read by the daemon that started them"
    },
    {
      "scope": "environment",
      "path": "login-session",
      "reason": "written only on Windows, which keeps no store of releases; a record that does not decode is an error that names it"
    },
    {
      "scope": "environment",
      "path": "models",
      "reason": "the description model's files and their markers, downloaded content that a marker compared whole with the one expected says is complete"
    },
    {
      "scope": "environment",
      "path": "plugin-cache",
      "reason": "compiled plugin components, a cache written again when absent"
    },
    {
      "scope": "environment",
      "path": "power.json",
      "reason": "a document the sleep setting used to live in; nothing reads it"
    },
    {
      "scope": "environment",
      "path": "secrets",
      "reason": "the secret store's fallback files, one per name, in the secret store's own format"
    },
    {
      "scope": "environment",
      "path": "services",
      "reason": "plugin service directories"
    },
    {
      "scope": "environment",
      "path": "sessions",
      "reason": "the per-session journals, which keep the archive's own rule (kr host import-journals)"
    },
    {
      "scope": "environment",
      "path": "spool",
      "reason": "output history, a bounded spool the archive's own rule reads"
    },
    {
      "scope": "environment",
      "path": "terminfo",
      "reason": "terminal descriptions compiled from the build's own, written again when absent"
    },
    {
      "scope": "environment",
      "path": "workers",
      "reason": "one working directory per worker"
    },
    {
      "scope": "state_root",
      "path": ".*.tmp",
      "reason": "a temporary file an interrupted write left; nothing reads it"
    },
    {
      "scope": "state_root",
      "path": "entry-locks",
      "reason": "the locks that keep two writers of one startup file apart; empty files"
    },
    {
      "scope": "state_root",
      "path": "environment-id",
      "reason": "written once, as text, and never changed: a build reads no other form"
    },
    {
      "scope": "state_root",
      "path": "environments",
      "reason": "the state directories of the environments, each of which is named under its own scope"
    },
    {
      "scope": "state_root",
      "path": "host",
      "reason": "the store of releases on a platform whose default state root holds it; its record is the store install-record, and roots/<digest>.root is a frozen form (two paths separated by a NUL byte) that a change replaces with a file of another name"
    },
    {
      "scope": "state_root",
      "path": "kept-answers",
      "reason": "answers a person gave that the host has not taken, kept on this device by the client; not host state, so not a store of the host's (an unreadable one is reported by name)"
    },
    {
      "scope": "state_root",
      "path": "machine-merge-plan",
      "reason": "the client's merge plan, kept on this device; not host state (an unreadable one is reported by name and moved aside by the person)"
    },
    {
      "scope": "state_root",
      "path": "machine-merge-plan.lock",
      "reason": "the lock on the merge plan; empty"
    },
    {
      "scope": "state_root",
      "path": "run",
      "reason": "the runtime root on a platform whose default state root holds it; nothing in it outlives a boot"
    }
  ]
}
