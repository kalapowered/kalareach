# A squid that asks every CONNECT for a user name and password (HTTP Basic), on the loopback.
# scripts/real-proxy.sh fills in @RUN@ (the run folder), @PORT@ and @LIBEXEC@ (squid's helpers).
http_port 127.0.0.1:@PORT@
pid_filename @RUN@/squid.pid
cache_log @RUN@/cache.log
# The log holds the request line and the user field and no header, so a login that the host sent
# in a header is checked in the host's own logs, and this log shows which requests were answered.
logformat kr %ts.%03tu %>a %rm %ru %>Hs %Ss %un
access_log stdio:@RUN@/access.log kr
cache deny all
cache_store_log none
coredump_dir @RUN@
visible_hostname real-proxy
forwarded_for delete
shutdown_lifetime 1 seconds
auth_param basic program @LIBEXEC@/basic_ncsa_auth @RUN@/passwd
auth_param basic realm real-proxy
acl signed_in proxy_auth REQUIRED
acl tunnel method CONNECT
http_access allow tunnel signed_in
http_access deny all
