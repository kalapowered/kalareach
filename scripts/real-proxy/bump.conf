# A squid that intercepts TLS, on the loopback, with a certificate authority made for the run. It has
# two ports that differ in one thing: the second one refuses a request that asks to upgrade to a
# WebSocket. It verifies nothing about the servers it reaches, which are the cases' own.
# scripts/real-proxy.sh fills in @RUN@, @PORT@ (passes upgrades), @BLOCKPORT@ and @LIBEXEC@.
http_port 127.0.0.1:@PORT@ ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB tls-cert=@RUN@/ca.pem tls-key=@RUN@/ca.key
http_port 127.0.0.1:@BLOCKPORT@ ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB tls-cert=@RUN@/ca.pem tls-key=@RUN@/ca.key
pid_filename @RUN@/squid.pid
cache_log @RUN@/cache.log
logformat kr %ts.%03tu %>a %rm %ru %>Hs %Ss %un
access_log stdio:@RUN@/access.log kr
cache deny all
cache_store_log none
coredump_dir @RUN@
visible_hostname real-proxy
forwarded_for delete
shutdown_lifetime 1 seconds
sslcrtd_program @LIBEXEC@/security_file_certgen -s @RUN@/ssl_db -M 4MB
sslcrtd_children 2
tls_outgoing_options flags=DONT_VERIFY_PEER
# No shared TLS session cache: its shared-memory name is too long for macOS.
sslproxy_session_cache_size 0
# Squid drops a request's `Upgrade` offer unless it is told which protocols may be upgraded. Names
# are case sensitive, and a client writes the name either way.
http_upgrade_request_protocols websocket allow all
http_upgrade_request_protocols WebSocket allow all
acl step1 at_step SslBump1
acl websocket req_header Upgrade -i websocket
acl blocking localport @BLOCKPORT@
ssl_bump peek step1
ssl_bump bump all
http_access deny websocket blocking
http_access allow all
