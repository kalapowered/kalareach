# A squid that offers HTTP Digest only, so a client that sends Basic is never accepted. On the
# loopback. scripts/real-proxy.sh fills in @RUN@, @PORT@ and @LIBEXEC@.
http_port 127.0.0.1:@PORT@
pid_filename @RUN@/squid.pid
cache_log @RUN@/cache.log
logformat kr %ts.%03tu %>a %rm %ru %>Hs %Ss %un
access_log stdio:@RUN@/access.log kr
cache deny all
cache_store_log none
coredump_dir @RUN@
visible_hostname real-proxy
forwarded_for delete
shutdown_lifetime 1 seconds
auth_param digest program @LIBEXEC@/digest_file_auth @RUN@/passwd
auth_param digest realm real-proxy
acl signed_in proxy_auth REQUIRED
acl tunnel method CONNECT
http_access allow tunnel signed_in
http_access deny all
