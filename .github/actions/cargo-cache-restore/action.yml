name: Restore the cargo cache
description: >-
  Restores the registry and the build output of the third-party crates that a run on the default
  branch saved for this entry. A run that finds no cache of exactly its dependencies takes the
  newest one of the same settings, so that only the crates that changed are built again. A run on
  the default branch takes one of the same week only, so that what a cache holds is built again
  from nothing every week: a cache that is restored and saved again only grows. The
  `cargo-cache-save` action saves one.

inputs:
  name:
    description: The entry's name in the key. Jobs that build different things do not share an entry.
    required: true
  paths:
    description: What the entry holds, one path on each line.
    required: false
    default: |
      ~/.cargo/registry/index
      ~/.cargo/registry/cache
      target

outputs:
  cache-hit:
    description: "'true' when the cache of exactly these dependencies was restored."
    value: ${{ steps.restore.outputs.cache-hit }}
  primary-key:
    description: The key a cache of these dependencies is saved under.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Name the cache
      id: key
      shell: bash
      run: |
        part="$(bash scripts/cargo-cache-key.sh)"
        echo "part=$part" >> "$GITHUB_OUTPUT"
        echo "settings=${part%%-*}" >> "$GITHUB_OUTPUT"
        week="${part#*-}"
        echo "week=${part%%-*}-${week%-*}" >> "$GITHUB_OUTPUT"

    - name: Restore
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.paths }}
        key: cargo-v1-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.part }}
        restore-keys: cargo-v1-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref == 'refs/heads/main' && steps.key.outputs.week || steps.key.outputs.settings }}-
