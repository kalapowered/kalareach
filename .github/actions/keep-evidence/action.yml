name: Keep a job's evidence
description: >-
  Uploads what a job leaves as its evidence, as the job's workflow artifact, and tries once more
  when the first upload fails. Every hosted job ends with such an upload, and a name lookup or a
  connection that fails for a moment would otherwise turn a job red whose every other step passed,
  hours of tests included. The upload action does not retry a request that never reached the
  service, so the second try is made here, after a pause of one minute.

  The step still fails when both tries fail: the evidence is part of the result, and a job that
  kept none of it has not passed. With `if-no-files-found: error` and nothing at the path both
  tries fail, as the one try would without this action; with `warn` or `ignore` the first try
  passes and there is no second. Both tries use the same name and no `overwrite`, which would
  delete another artifact of that name. A first try that failed after the service had made the
  artifact leaves the second one to fail on the name, and the step fails with it.

  Whether the step runs, and for how long, is the calling step's own `if` and `timeout-minutes`.
  A timeout there covers both tries and the pause.

  The runner fetches the upload action that this action calls when this action's own step starts,
  not when the job is set up. A job that keeps evidence therefore calls this action once with
  `only-load` right after its checkout, so that the fetch is made with the job's other downloads
  and not after the hours of work that the evidence comes from.

inputs:
  name:
    description: >-
      The artifact's name. It must not be the name of another artifact of the run. Required
      unless `only-load` is `true`.
    required: false
  path:
    description: >-
      A file, a directory or a wildcard pattern, or several of them on lines of their own.
      Required unless `only-load` is `true`.
    required: false
  if-no-files-found:
    description: >-
      What a try does when the path holds nothing: `warn`, `error` or `ignore`, as the upload
      action reads it.
    required: false
    default: warn
  only-load:
    description: >-
      `true` makes every step of this action skip, so that the call only has the runner fetch the
      upload action. It keeps nothing and takes no `name` or `path`.
    required: false
    default: 'false'

outputs:
  tries:
    description: >-
      '1' when the first try's upload step ended without failing, '2' when the second one's did
      and the first one's failed, and empty when neither did (both failed and the action failed,
      or the call was `only-load`). An upload step that ends without failing has kept an artifact
      unless the rule is `warn` or `ignore` and the path held nothing.
    value: ${{ steps.first.outcome == 'success' && '1' || (steps.second.outcome == 'success' && '2' || '') }}

runs:
  using: composite
  steps:
    # The caller's condition has already decided that this action runs, so every step here stands
    # under `always()` or `!cancelled()` and not under the default `success()`, which a job that
    # is already red would never pass. With `only-load` the first try skips, and every later step
    # waits on the first try having failed, so none of them runs either.
    - name: Keep the evidence
      id: first
      if: ${{ always() && inputs.only-load != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Wait before the second try
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        echo "::warning title=Evidence not kept::The first try to keep ${ARTIFACT_NAME} failed. Trying once more in 60 seconds."
        sleep 60

    - name: Keep the evidence, second try
      id: second
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Say that the second try kept the evidence
      if: ${{ always() && steps.first.outcome == 'failure' && steps.second.outcome == 'success' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        echo "::notice title=Evidence kept by the second try::${ARTIFACT_NAME} was kept by the second try, after the first one failed."

    - name: Fail when both tries failed
      if: ${{ always() && steps.first.outcome == 'failure' && steps.second.outcome != 'success' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        FIRST_TRY: ${{ steps.first.outcome }}
        SECOND_TRY: ${{ steps.second.outcome }}
      run: |
        echo "::error title=Evidence not kept::${ARTIFACT_NAME} was not kept (first try: ${FIRST_TRY}, second try: ${SECOND_TRY}), and a job without its evidence has not passed."
        exit 1
