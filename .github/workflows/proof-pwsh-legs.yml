name: proof-pwsh-legs

# Runs the PowerShell cases that need a real Windows console on a hosted runner.
on:
  push:
    branches: ["proof/pwsh-legs"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-pwsh-legs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Choose where the tests keep their artefacts
        run: |
          $temporary = (Get-Item $env:TEMP).FullName
          "KR_TEST_ARTIFACTS_DIR=$temporary\kr-test-artifacts" >> $env:GITHUB_ENV

      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Place libsodium's archives
        id: libsodium
        uses: ./.github/actions/libsodium-archive

      - name: Restore the cargo cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: windows

      - name: What this runner is
        run: |
          [System.Environment]::OSVersion.VersionString
          $PSVersionTable.PSVersion.ToString()
          (Get-Command pwsh).Source
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); Get-Module PSReadLine -ListAvailable | Select-Object Name, Version, Path | Format-List'
          whoami /priv

      - name: Build the control daemon, the worker and the forwarder the suites run
        run: cargo build --locked -p kr-controller -p kr-worker -p kr-hook -p kr-plugin-host -p kr-release

      - name: The PowerShell bridge client over a named pipe
        run: cargo test --locked -p kr-shell-integration --test pwsh_windows

      - name: The worker's library
        run: cargo test --locked -p kr-worker --lib fence::bridge

      - name: PowerShell sessions through a real daemon and worker
        timeout-minutes: 40
        env:
          KR_ALLOW_PROFILE_WRITE: "1"
        run: cargo test --locked -p kr-cli --test shell_windows -- --ignored --exact --test-threads=1 --nocapture a_handler_the_person_bound_on_ctrl_d_runs_outside_the_detach_condition another_chord_is_the_editors_own_on_windows ctrl_d_in_a_foreground_program_reaches_the_program ctrl_d_is_bound_to_the_detach_decision_in_a_managed_session ctrl_d_with_text_in_the_buffer_is_the_editors_own_on_windows
