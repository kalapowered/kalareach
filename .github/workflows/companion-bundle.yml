name: companion-bundle

# Builds the companion's desktop bundle on Windows the way a person builds it (`pnpm desktop build`),
# and reads what that makes: the link of the application and both installers.
#
# The application links the static C runtime, through the `crt-static` target feature that the
# workspace's configuration gives the MSVC targets, so it imports no runtime library. The Tauri
# command line asks for its own static runtime, a hybrid that would put a second runtime in the link,
# unless the environment says otherwise. The build step below starts with `STATIC_VCRUNTIME=true` in
# its environment, which is what the command line would have set, so a build that passes shows that
# the entry replaces it. Two reads then look at the link: the build's log has no `LNK4098` (the
# linker's report of objects that ask for two runtimes), and the executable imports no runtime
# library (none of Visual C++'s, the universal runtime's, an older or a debug one, or libsodium's)
# and every import is a Windows library. A step before the build links three small programs, one
# that carries its runtime, one that imports the dynamic runtime and one that asks for both, and
# shows that each read refuses what it must: a read that finds nothing is worth something only when
# it is shown to find the fault. Each installer is then opened: the NSIS installer is run silently
# into a directory of the runner's own and removed again, and the MSI is extracted with an
# administrative install, which registers nothing. In both, the files are listed and the installed
# executable's imports are read again. The application is never started.
#
# Nothing is uploaded and no cache is saved. A tool that a read needs and the runner lacks fails the
# job; no read is skipped.

on:
  workflow_dispatch:
  push:
    branches: ["main", "task/T-WIN-RUNTIME-1"]
    paths:
      - apps/companion/src-tauri/**
      - apps/companion/scripts/desktop.mjs
      - apps/companion/package.json
      - pnpm-lock.yaml
      - .cargo/config.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/kr-crypto/build.rs
      - crates/kr-crypto/build/**
      - scripts/read-windows-imports.py
      - scripts/place-libsodium-archive.sh
      - .github/actions/libsodium-archive/**
      - .github/workflows/companion-bundle.yml

permissions:
  contents: read

concurrency:
  group: companion-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here reads debug information, and the build is one a cache does not hold.
  CARGO_INCREMENTAL: "0"

jobs:
  windows-bundle:
    name: windows bundle
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # libsodium's prebuilt archives, placed from the cache or once from its host, so that the build
      # downloads nothing from there.
      - name: Place libsodium's archives
        uses: ./.github/actions/libsodium-archive

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      # The tool every read needs, found before the long build so that a runner without it stops the
      # job at once. It is Microsoft's, from the Visual C++ tools on the runner.
      - name: Find dumpbin
        shell: bash
        run: |
          dumpbin=$(python scripts/read-windows-imports.py find-dumpbin --arch x64)
          echo "dumpbin: $dumpbin"
          echo "DUMPBIN=$dumpbin" >> "$GITHUB_ENV"

      # The reads, put through what they must refuse before they are trusted with the build: recorded
      # output of the tool first, then real links on this runner.
      - name: Hold the reads to what they must refuse
        shell: bash
        run: |
          python scripts/read-windows-imports.py self-test
          python scripts/read-windows-imports.py control --dumpbin "$DUMPBIN"

      - name: Install the packages
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The entry's own cases, which no other job runs. They start bash, which must be Git's and not
      # the one the Windows subsystem for Linux brings, so they run in a bash step.
      - name: Run the entry's cases
        shell: bash
        run: pnpm -C apps/companion test:desktop

      # The bundle build, as a person starts it, with the variable that the Tauri command line would
      # have set. The log is kept for the next step to read.
      - name: Build the bundle
        shell: bash
        env:
          STATIC_VCRUNTIME: "true"
        run: |
          log="$(cygpath -u "$RUNNER_TEMP")/bundle-build.log"
          pnpm -C apps/companion desktop build 2>&1 | tee "$log"

      - name: Read the link
        shell: bash
        run: |
          log="$(cygpath -u "$RUNNER_TEMP")/bundle-build.log"
          exe=target/release/kalareach-companion.exe
          if [ ! -s "$log" ]; then
            echo "::error::The log of the bundle build is not there, so its link cannot be read."
            exit 1
          fi
          if [ ! -f "$exe" ]; then
            echo "::error::The build made no $exe."
            exit 1
          fi

          # The entry replaced the variable that this step's environment gave the build.
          if ! grep -F 'STATIC_VCRUNTIME was `true` in the environment' "$log"; then
            echo "::error::The entry did not say that it replaced STATIC_VCRUNTIME=true."
            exit 1
          fi

          # Read one: the linker did not report objects that ask for two C runtimes.
          # Python is a Windows program: it is given the log's path as Windows writes it.
          python scripts/read-windows-imports.py messages "$(cygpath -m "$log")"

          # Read two: the libraries the executable imports. No runtime library is among them, and
          # every one is a Windows API set or a library of the system directory.
          python scripts/read-windows-imports.py imports --dumpbin "$DUMPBIN" "$exe"

      # The installer run silently into a directory of the runner's own, and then removed. The
      # installed executable must import what the built one does, and the same reads hold it.
      - name: Open the NSIS installer
        shell: pwsh
        run: |
          function Get-Imports([string]$path) {
            $out = & $env:DUMPBIN -nologo -dependents $path
            if ($LASTEXITCODE -ne 0) { throw "dumpbin could not read $path" }
            $out | ForEach-Object { $_.Trim().ToLowerInvariant() } |
              Where-Object { $_ -match '^[a-z0-9_.+-]+\.dll$' } | Sort-Object -Unique
          }
          $built = Get-Imports 'target/release/kalareach-companion.exe'
          $setups = @(Get-ChildItem 'target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($setups.Count -ne 1) { throw "expected one NSIS installer, found $($setups.Count)" }
          Write-Host "installer: $($setups[0].Name), $($setups[0].Length) bytes"

          $dir = Join-Path $env:RUNNER_TEMP 'nsis-install'
          $run = Start-Process -FilePath $setups[0].FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer ended with $($run.ExitCode)" }

          Get-ChildItem $dir -Recurse -File | ForEach-Object { '{0,12} {1}' -f $_.Length, $_.FullName.Substring($dir.Length + 1) }
          $installed = @(Get-ChildItem $dir -Recurse -Filter 'kalareach-companion.exe')
          if ($installed.Count -ne 1) { throw "expected one installed executable, found $($installed.Count)" }
          $after = Get-Imports $installed[0].FullName
          if (Compare-Object $built $after) { throw "the installed executable imports other libraries than the built one" }
          python scripts/read-windows-imports.py imports --dumpbin $env:DUMPBIN $installed[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'the installed executable imports a runtime library or one that no Windows library holds' }

          $uninstall = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path $uninstall)) { throw 'the installation has no uninstaller' }
          $run = Start-Process -FilePath $uninstall -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the uninstaller ended with $($run.ExitCode)" }
          if (Test-Path $installed[0].FullName) { throw 'the uninstaller left the executable' }
          Remove-Item $dir -Recurse -Force

      # An administrative install extracts the files and registers nothing.
      - name: Open the MSI
        shell: pwsh
        run: |
          function Get-Imports([string]$path) {
            $out = & $env:DUMPBIN -nologo -dependents $path
            if ($LASTEXITCODE -ne 0) { throw "dumpbin could not read $path" }
            $out | ForEach-Object { $_.Trim().ToLowerInvariant() } |
              Where-Object { $_ -match '^[a-z0-9_.+-]+\.dll$' } | Sort-Object -Unique
          }
          $built = Get-Imports 'target/release/kalareach-companion.exe'
          $packages = @(Get-ChildItem 'target/release/bundle/msi' -Filter '*.msi')
          if ($packages.Count -ne 1) { throw "expected one MSI, found $($packages.Count)" }
          Write-Host "package: $($packages[0].Name), $($packages[0].Length) bytes"

          $dir = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $run = Start-Process -FilePath 'msiexec.exe' -ArgumentList '/a', "`"$($packages[0].FullName)`"", '/qn', "TARGETDIR=`"$dir`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "msiexec ended with $($run.ExitCode)" }

          Get-ChildItem $dir -Recurse -File | ForEach-Object { '{0,12} {1}' -f $_.Length, $_.FullName.Substring($dir.Length + 1) }
          $extracted = @(Get-ChildItem $dir -Recurse -Filter 'kalareach-companion.exe')
          if ($extracted.Count -ne 1) { throw "expected one extracted executable, found $($extracted.Count)" }
          $after = Get-Imports $extracted[0].FullName
          if (Compare-Object $built $after) { throw "the extracted executable imports other libraries than the built one" }
          python scripts/read-windows-imports.py imports --dumpbin $env:DUMPBIN $extracted[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'the extracted executable imports a runtime library or one that no Windows library holds' }
          Remove-Item $dir -Recurse -Force
