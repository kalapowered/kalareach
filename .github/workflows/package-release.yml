name: package-release

# Publishes the generated TypeScript packages for one commit.
#
# A tag of the form `packages/v<version>+<short commit>` is the whole trigger: the tag names the
# commit, `scripts/release-packages.sh` refuses to pack anything else, and the release that appears
# carries the two archives and the digests a consumer pins them by.
#
# The release is assembled as a draft, and it is published only once the asset set on GitHub's side
# matches what was packed. After that the job fetches every asset back by the URL GitHub serves it
# at, checks it against those digests, and writes those URLs into the release notes, so the notes
# name URLs that were fetched rather than URLs that were assumed.
on:
  push:
    tags:
      - 'packages/v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      # rust-toolchain.toml pins the exact toolchain; the generators are built with it.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Pack the packages
        run: bash scripts/release-packages.sh --output "$RUNNER_TEMP/packages" --tag "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"

          # The part of the notes that does not depend on where the assets end up. The last step
          # rebuilds the notes around it with the URLs GitHub reports.
          {
            echo
            echo 'Verify a downloaded archive against the sums:'
            echo
            echo "    grep -v '^#' SHA512SUMS | sha512sum -c -"
            echo
            echo 'SHA512SUMS:'
            echo
            sed 's/^/    /' "$packages/SHA512SUMS"
            echo
            echo 'The procedure, and what a consumer does with a release, are in'
            echo 'docs/releases/packages.md.'
          } >"$RUNNER_TEMP/notes-tail.md"

          {
            echo "The generated TypeScript packages, packed from commit $GITHUB_SHA."
            echo
            echo 'A consumer pins an archive by its URL and the integrity below, and its lockfile'
            echo 'then carries both.'
            cat "$RUNNER_TEMP/notes-tail.md"
          } >"$RUNNER_TEMP/notes-draft.md"

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Packages $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes-draft.md" \
            "$packages"/*.tgz "$packages/SHA512SUMS"

          # A draft is not in the listing everyone sees, so it is found through the listing that
          # includes drafts for a caller with write access.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" >"$RUNNER_TEMP/release-id"

          if [ "$(wc -l <"$RUNNER_TEMP/release-id")" -ne 1 ]; then
            echo "$GITHUB_REF_NAME matches $(wc -l <"$RUNNER_TEMP/release-id") releases:" >&2
            cat "$RUNNER_TEMP/release-id" >&2
            exit 1
          fi

          release="$(cat "$RUNNER_TEMP/release-id")"

          # The asset set is checked while nothing can install it: every archive that was packed, at
          # the length it was packed at, and nothing else attached.
          for file in "$packages"/*; do
            printf '%s %s\n' "$(basename "$file")" "$(wc -c <"$file" | tr -d ' ')"
          done | sort >"$RUNNER_TEMP/packed-assets"

          gh api "repos/$GITHUB_REPOSITORY/releases/$release" \
            --jq '.assets[] | "\(.name) \(.size)"' | sort >"$RUNNER_TEMP/uploaded-assets"

          if ! diff "$RUNNER_TEMP/packed-assets" "$RUNNER_TEMP/uploaded-assets"; then
            echo 'The release holds something other than what was packed; it stays a draft.' >&2
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release" \
            -F draft=false --jq '.html_url'

      - name: Check what the release serves, and name those URLs in the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"
          served="$RUNNER_TEMP/served"
          mkdir -p "$served"

          # GitHub's own record of where each asset is served, rather than a URL built here: it
          # percent-encodes parts of a tag, and what a consumer pins has to be what resolves.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | "\(.name) \(.browser_download_url)"' >"$RUNNER_TEMP/served-assets"

          while read -r name url; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --output "$served/$name" "$url"
          done <"$RUNNER_TEMP/served-assets"

          cmp "$packages/SHA512SUMS" "$served/SHA512SUMS"
          (cd "$served" && grep -v '^#' SHA512SUMS | sha512sum -c -)

          {
            echo "The generated TypeScript packages, packed from commit $GITHUB_SHA."
            echo
            echo 'A consumer pins an archive by its URL and the integrity below, and its lockfile'
            echo 'then carries both:'
            echo
            while read -r name url; do
              case "$name" in
                *.tgz) echo "- $url" ;;
              esac
            done <"$RUNNER_TEMP/served-assets"
            cat "$RUNNER_TEMP/notes-tail.md"
          } >"$RUNNER_TEMP/notes.md"

          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"
