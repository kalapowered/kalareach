name: package-release

# Publishes the generated TypeScript packages for one commit.
#
# A tag of the form `packages/v<version>+<short commit>` is the whole trigger: the tag names the
# commit, `scripts/release-packages.sh` refuses to pack anything else, and the release that appears
# carries the two archives and the digests a consumer pins them by.
#
# The release is assembled as a draft and published only once GitHub's record of every asset, down
# to the sha256 it computed over the bytes it stored, matches what was packed. Publication then
# confirms that the release cannot be replaced, and the last step fetches each asset back from the
# URL GitHub serves it at, holds it to the packed sha512, and writes those URLs into the notes.
on:
  push:
    tags:
      - 'packages/v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One tag is one release, and the refusal below cannot see a run that has not created its draft
    # yet: two runs for the same tag would both pass it and both go on to create one. So runs for
    # one tag are serialised here instead, and a run that has already begun is never cancelled for a
    # later one, because it is the run that holds the draft. A duplicate that waits meets the
    # refusal when its turn comes, which is where it belongs.
    concurrency:
      group: package-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      # rust-toolchain.toml pins the exact toolchain; the generators are built with it.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Pack the packages
        run: bash scripts/release-packages.sh --output "$RUNNER_TEMP/packages" --tag "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"

          # One tag is one release, and a release is never assembled twice. A draft left behind by
          # an upload that failed is named here rather than joined by a second one.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) draft=\(.draft)\"" \
            >"$RUNNER_TEMP/existing"

          if [ -s "$RUNNER_TEMP/existing" ]; then
            echo "$GITHUB_REF_NAME already has a release:" >&2
            cat "$RUNNER_TEMP/existing" >&2
            echo 'A draft left by a run that failed: delete the draft and run this workflow again' >&2
            echo 'for the same tag. A published release: leave it where it is and release the' >&2
            echo 'corrected commit under its own tag.' >&2
            exit 1
          fi

          # The tag is what says which commit was packed, so the release names a tag the
          # repository already has rather than one that publishing would create.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --silent; then
            echo "Could not confirm that $GITHUB_REF_NAME is a tag on this repository." >&2
            exit 1
          fi

          # The part of the notes that does not depend on where the assets end up. The last step
          # rebuilds the notes around it with the URLs GitHub reports.
          {
            echo
            echo 'Verify a downloaded archive against the sums:'
            echo
            echo "    grep -v '^#' SHA512SUMS | sha512sum -c -"
            echo
            echo 'SHA512SUMS:'
            echo
            sed 's/^/    /' "$packages/SHA512SUMS"
            echo
            echo 'The procedure, and what a consumer does with a release, are in'
            echo 'docs/releases/packages.md.'
          } >"$RUNNER_TEMP/notes-tail.md"

          {
            echo "The generated TypeScript packages, packed from commit $GITHUB_SHA."
            echo
            echo 'A consumer pins an archive by its URL and the integrity below, and its lockfile'
            echo 'then carries both.'
            cat "$RUNNER_TEMP/notes-tail.md"
          } >"$RUNNER_TEMP/notes-draft.md"

          # Creating the draft returns it, and everything below works from that answer: a release
          # takes a while to appear in the listing, and the endpoint that fetches one by its tag
          # answers for published releases only, so the id and the upload address the creation
          # reports are what name the draft afterwards.
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --raw-field "tag_name=$GITHUB_REF_NAME" \
            --raw-field "name=Packages $GITHUB_REF_NAME" \
            --field draft=true \
            --field "body=@$RUNNER_TEMP/notes-draft.md" \
            --jq '"\(.id) \(.upload_url)"' >"$RUNNER_TEMP/draft"

          release="$(cut -d' ' -f1 <"$RUNNER_TEMP/draft")"
          upload="$(cut -d' ' -f2 <"$RUNNER_TEMP/draft")"

          case "$release" in
            '' | *[!0-9]*)
              echo 'Creating the draft did not name one release:' >&2
              cat "$RUNNER_TEMP/draft" >&2
              exit 1
              ;;
          esac

          # The upload address ends in the template of the parameters it takes; gh fills the name
          # in as the query string of each upload.
          upload="${upload%%\{*}"

          # An upload that ends in a lost connection or a 5xx is worth repeating; one that ends in
          # the name already being taken fails the same way on the third attempt as on the first.
          for file in "$packages"/*.tgz "$packages/SHA512SUMS"; do
            attempt=1
            until gh api --method POST "$upload" \
              --raw-field "name=$(basename "$file")" \
              --header 'Content-Type: application/octet-stream' \
              --input "$file" --silent; do
              if [ "$attempt" -ge 3 ]; then
                echo "Uploading $(basename "$file") to draft release $release failed." >&2
                echo 'Delete the draft and run this workflow again for the same tag.' >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
          done

          # The asset set is held to what was packed while nothing can install it: every archive, at
          # its length, with the sha256 GitHub computed over the bytes it stored, and nothing else
          # attached.
          for file in "$packages"/*; do
            printf '%s %s sha256:%s\n' \
              "$(basename "$file")" \
              "$(wc -c <"$file" | tr -d ' ')" \
              "$(sha256sum "$file" | cut -d' ' -f1)"
          done | sort >"$RUNNER_TEMP/packed-assets"

          # Reading a release moments after writing to it can reach a copy that has not caught up,
          # so every read below is attempted a few times before its answer is believed. Each one is
          # a read: repeating it changes nothing, and an answer that is simply wrong is still wrong
          # on the last attempt.
          attempt=1
          while :; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/$release" \
                 --jq '.assets[] | "\(.name) \(.size) \(.digest)"' \
                 | sort >"$RUNNER_TEMP/stored-assets" \
               && cmp -s "$RUNNER_TEMP/packed-assets" "$RUNNER_TEMP/stored-assets"; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo 'The release holds something other than what was packed; it stays a draft.' >&2
              diff "$RUNNER_TEMP/packed-assets" "$RUNNER_TEMP/stored-assets" >&2 || true
              echo 'A digest of null is GitHub reporting none for that asset, which leaves nothing' >&2
              echo 'to compare and is equally a reason not to publish it.' >&2
              echo 'Delete the draft and run this workflow again for the same tag.' >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release" \
            -F draft=false --jq '.html_url'

          # What a consumer pins is a URL and a digest, so the release behind them has to be one
          # nobody can point somewhere else. That is the repository's immutable-releases setting,
          # which this token cannot read directly but which every published release reports. The
          # question is asked of the tag rather than of the identifier, because the tag is what a
          # consumer resolves, and the answer has to name the release this run published: a tag
          # answering for some other release is the one case the identifier alone would not show.
          attempt=1
          while :; do
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '"\(.id) \(.immutable)"' 2>/dev/null || echo '')"
            if [ "$published" = "$release true" ]; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              case "$published" in
                "$release false")
                  echo "$GITHUB_REF_NAME was published as a release whose assets can be replaced." >&2
                  echo 'Turn on immutable releases for this repository, then release the next commit.' >&2
                  ;;
                "$release" | "$release "*)
                  echo "$GITHUB_REF_NAME was published, and this is not an answer about whether its" >&2
                  echo "assets can be replaced, so it is not one to publish against: $published" >&2
                  ;;
                *)
                  echo "$GITHUB_REF_NAME does not resolve to the release this run published." >&2
                  echo "It published release $release; the tag answers: ${published:-nothing}" >&2
                  ;;
              esac
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

      - name: Check what the release serves, and name those URLs in the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"
          served="$RUNNER_TEMP/served"
          mkdir -p "$served"

          # GitHub's own record of where each asset is served, rather than a URL built here: it
          # percent-encodes parts of a tag, and what a consumer pins has to be what resolves. Asked
          # of the tag for the same reason, and attempted a few times, because a read that follows
          # a write can reach a copy that has not caught up and answer with part of the set.
          cut -d' ' -f1 <"$RUNNER_TEMP/packed-assets" | sort >"$RUNNER_TEMP/packed-names"

          attempt=1
          while :; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                 --jq '.assets[] | "\(.name) \(.browser_download_url)"' \
                 >"$RUNNER_TEMP/served-assets" \
               && cut -d' ' -f1 <"$RUNNER_TEMP/served-assets" | sort \
                 | cmp -s - "$RUNNER_TEMP/packed-names"; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "$GITHUB_REF_NAME does not serve what this run packed." >&2
              echo 'Packed:' >&2
              cat "$RUNNER_TEMP/packed-names" >&2
              echo 'Served:' >&2
              cut -d' ' -f1 <"$RUNNER_TEMP/served-assets" >&2 || true
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          while read -r name url; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --output "$served/$name" "$url"
          done <"$RUNNER_TEMP/served-assets"

          cmp "$packages/SHA512SUMS" "$served/SHA512SUMS"
          (cd "$served" && grep -v '^#' SHA512SUMS | sha512sum -c -)

          {
            echo "The generated TypeScript packages, packed from commit $GITHUB_SHA."
            echo
            echo 'A consumer pins an archive by its URL and the integrity below, and its lockfile'
            echo 'then carries both:'
            echo
            while read -r name url; do
              case "$name" in
                *.tgz) echo "- $url" ;;
              esac
            done <"$RUNNER_TEMP/served-assets"
            cat "$RUNNER_TEMP/notes-tail.md"
          } >"$RUNNER_TEMP/notes.md"

          # By the identifier the creation returned, because `gh release edit` resolves a tag
          # first and this is a write to one known release rather than a question about the tag.
          release="$(cut -d' ' -f1 <"$RUNNER_TEMP/draft")"

          case "$release" in
            '' | *[!0-9]*)
              echo 'The release this run published is not named in the record it kept:' >&2
              cat "$RUNNER_TEMP/draft" >&2
              exit 1
              ;;
          esac

          attempt=1
          until gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release" \
            --field "body=@$RUNNER_TEMP/notes.md" --silent; do
            if [ "$attempt" -ge 5 ]; then
              echo "Writing the served URLs into the notes of release $release failed." >&2
              echo 'The release itself is published and carries what was packed; only its notes are' >&2
              echo 'in doubt, because a request that ends without an answer may still have been' >&2
              echo 'applied. Read the notes of that release and, if they are still the text the' >&2
              echo 'draft was created with, put the URLs below into them by hand.' >&2
              cat "$RUNNER_TEMP/notes.md" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"
