name: release-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  floors:
    name: windows probe
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: Build the description process
        run: |
          cargo build --locked --release --target "$TARGET" -p kr-describe-model --bin kr-describe-inference

      - name: Where the AVX-512 instructions are
        run: |
          vswhere="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          install=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          dumpbin=$(find "$(cygpath -u "$install")/VC/Tools/MSVC" -path '*/bin/Hostx64/x64/dumpbin.exe' | sort -V | tail -1)
          out=$(ls -d target/$TARGET/release/build/llama-cpp-sys-2-*/out | head -1)
          echo "== out: $out"
          echo "== cmake cache (arch flags)"
          grep -h -E '^(CMAKE_CXX_FLAGS|CMAKE_C_FLAGS|CMAKE_CXX_FLAGS_RELEASE|GGML_[A-Z0-9_]*(AVX|NATIVE|SSE|FMA|F16C|BMI)[A-Z0-9_]*):' "$out"/build/CMakeCache.txt || true
          for flags in $(find "$out/build" -name flags.make); do
            echo "== $flags"
            grep -h -E '^(C|CXX)_FLAGS' "$flags" | cut -c1-400
          done
          echo "== llama.lib"
          lib=$(find "$out/build/src" -name llama.lib | head -1)
          echo "$lib"
          "$dumpbin" -nologo -disasm:bytes "$lib" | tr -d '\r' > llama.txt
          wc -l llama.txt
          grep -n -E '^[[:space:]]+[0-9A-Fa-f]+: 62 ' llama.txt | grep -v -E '\?\?|db ' | head -20
          echo "== context of the first hit"
          first=$(grep -n -E '^[[:space:]]+[0-9A-Fa-f]+: 62 .*vpmullq' llama.txt | head -1 | cut -d: -f1)
          echo "first hit at line $first"
          start=$((first - 80)); [ "$start" -gt 1 ] || start=1
          sed -n "${start},$((first + 25))p" llama.txt
          echo "== member names before the first hit"
          head -n "$first" llama.txt | grep -n -E '(\.obj|File Type|Dump of)' | tail -5
          echo "== the same, for the second function"
          second=$(grep -n -E '^[[:space:]]+[0-9A-Fa-f]+: 62 .*vpmullq' llama.txt | sed -n 3p | cut -d: -f1)
          start=$((second - 40)); sed -n "${start},$((second + 10))p" llama.txt
