name: release-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  floors:
    name: windows probe
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: Build the description process
        run: |
          cargo build --locked --release --target "$TARGET" -p kr-describe-model --bin kr-describe-inference

      - name: The two functions in full
        run: |
          vswhere="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          install=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          dumpbin=$(find "$(cygpath -u "$install")/VC/Tools/MSVC" -path '*/bin/Hostx64/x64/dumpbin.exe' | sort -V | tail -1)
          out=$(ls -d target/$TARGET/release/build/llama-cpp-sys-2-*/out | head -1)
          lib="$out/lib/llama.lib"
          "$dumpbin" -nologo -disasm:bytes "$lib" | tr -d '\r' | sed -E 's/<[^>]*>//g' | tr '[:upper:]' '[:lower:]' > llama.txt
          wc -l llama.txt
          awk 'BEGIN { RS = ""; FS = "\n" } /vpmullq/ { n++; print "=== BLOCK " n " (" NF " lines)"; print $0; print "=== END" }' llama.txt
          echo "== all jump operands in blocks that hold vpmullq"
          awk 'BEGIN { RS = ""; FS = "\n" } /vpmullq/ { for (i = 1; i <= NF; i++) if ($i ~ /^ +[0-9a-f]+: .*  (j[a-z]+|call) /) print $i }' llama.txt | sed -E 's/^ +[0-9a-f]+: ([0-9a-f]{2} )+ +//' | sort | uniq -c | sort -rn | head -30
