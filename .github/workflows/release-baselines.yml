name: release-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  floors:
    name: windows probe
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: The guarded plant as dumpbin shows it
        run: |
          vswhere="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          install=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          dumpbin=$(find "$(cygpath -u "$install")/VC/Tools/MSVC" -path '*/bin/Hostx64/x64/dumpbin.exe' | sort -V | tail -1)
          cat > planted.rs <<'RUST'
          #![no_std]
          use core::arch::asm;
          #[unsafe(no_mangle)]
          pub unsafe extern "C" fn planted() {
              unsafe {
                  asm!(
                      "cmp dword ptr [rip + __isa_available], 6",
                      "jl 2f",
                      "vpaddd zmm0, zmm1, zmm2",
                      "2:"
                  )
              };
          }
          #[panic_handler]
          fn panic(_: &core::panic::PanicInfo) -> ! {
              loop {}
          }
          RUST
          rustc --edition 2024 --crate-type staticlib --target "$TARGET" -C panic=abort -C codegen-units=1 -C target-feature=+avx512f -o planted.lib planted.rs
          "$dumpbin" -nologo -disasm:bytes planted.lib | tr -d '\r' > planted.txt
          wc -l planted.txt
          n=$(grep -n 'vpaddd' planted.txt | head -1 | cut -d: -f1)
          echo "vpaddd at $n"
          sed -n "$((n - 12)),$((n + 8))p" planted.txt | cat -A | cut -c1-120
          echo "== awk"
          command -v awk; awk --version 2>&1 | head -1 || true
          printf 'a\ncmp   dword ptr [__isa_available],6\nb\n\nc\n' > t.txt
          awk '/^[[:space:]]*$/ { print "blank at " NR; next } { if ($0 ~ /cmp .*\[__isa_available\],[6-9]/) print "guard at " NR }' t.txt
