name: core-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The plugin runtime's tests run real components. A run that has not built them would skip those
  # cases with a printed reason, which is right on a developer's machine and wrong here: the build
  # step below is part of this job, so an absent component is a failure.
  KR_REQUIRE_PLUGIN_FIXTURES: "1"
  # Section 27 puts every test artefact in one platform-resolved directory and asks for a release
  # run's evidence to be retained. Each performance measurement writes its host, its figure and its
  # verdict here before it asserts anything, so a run the target failed on keeps the number.
  KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
  # The deployment the checkpoint step reports on. It is an address and not a credential, so it is
  # named here in the open rather than kept as a secret: the legs sign with keys they make for the
  # run, spend nothing and take back what they published, so an address is the whole of what that
  # step needs. It is deliberately not KR_DEPLOYED_ORIGIN, which would turn the offline legs in
  # every other job's test run into calls on this deployment as well.
  KR_CHECKPOINT_ORIGIN: "https://reach.kala.to"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    env:
      # This workspace's test build is large: a debug build of every crate's test targets, and then
      # an optimised build for the two timed measurements, in one directory. Debug information is
      # the greater part of that and nothing this job does reads it - a panic still names its file
      # and its line - so the profiles this job builds in carry none.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The runner has one build cache and no reason to keep incremental artefacts between steps.
      CARGO_INCREMENTAL: "0"
    steps:
      # The runner arrives with toolchains this project never uses, and removing them and the
      # container images widens the margin the build has to work in. This reading and the one the
      # last step takes are what that margin was.
      - name: Free the disk the build needs
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      # libsodium-sys-stable builds libsodium from the source archive it ships, so the native
      # library is compiled and its length constants are checked against this wrapper on every run.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The workspace contains the companion application's backend, which links the system WebView
      # and the window toolkit. A workspace-wide check needs them present before it can compile.
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # The test components are compiled to wasm32-wasip2 and are not committed: Rust embeds build
      # paths in a component's custom sections, so two machines produce different bytes for the same
      # source and a committed artefact could not be checked.
      - name: Install the component target
        run: rustup target add wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fixtures/plugins/components/target
          # The key names how the artefacts were built as well as what they were built from. A
          # cache from a run that kept debug information would otherwise be restored into this
          # directory, and the build would leave both sets of artefacts in it.
          key: cargo-${{ runner.os }}-nodebuginfo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'fixtures/plugins/components/Cargo.lock') }}

      - name: Build the test components
        run: bash scripts/build-plugin-fixtures.sh

      # The package that ships with the host, checked against the lock that names it. This
      # recomputes every digest under bundled-plugins/ and fails on any drift. It reaches no
      # network and needs no plugin repository: the bundle and the lock beside it are the whole
      # input, which is what a host with nothing reachable has too.
      - name: The bundled package matches its lock
        run: bash scripts/sync-bundled-plugins.sh --verify

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # The project service encloses every Git invocation in a boundary the kernel applies, and what
      # that boundary is differs by platform. This runs its tests again on their own and prints what
      # this runner's kernel and Git are, so a pass or a failure here names the system it happened
      # on rather than leaving it to be inferred.
      - name: Repository boundary
        # Whatever the step before it did: a run that ends in an unrelated failure is still the run
        # that says what this kernel and this Git are, and whether the boundary holds on them.
        if: ${{ !cancelled() }}
        run: |
          uname -srm
          git --version
          cargo test --locked -p kr-project --test boundary -- --nocapture

      # Seven checks put a bind mount inside the tree they look at, from inside a mount namespace
      # this account creates: three in change-set capture, two in the transfer authority and two
      # in project locations. Ubuntu 24.04 denies an unprivileged account that namespace unless
      # AppArmor's restriction on it is lifted, and each check fails rather than passes where it
      # cannot make one, so the workspace test above leaves them out. This step lifts the
      # restriction for itself on this runner and puts it back however the step ends, shows the
      # namespace refused before and given after, and runs the seven by name. A name that matched
      # no test would run nothing and still exit 0, so the step counts the seven it saw pass.
      - name: Mount checks inside a mount namespace of this account's own
        # Whatever the steps before it did, like the boundary step above.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          restriction=kernel.apparmor_restrict_unprivileged_userns
          checks=(
            a_file_mounted_inside_this_repository_s_own_data_is_not_captured_around
            a_tree_reached_on_another_mount_is_not_taken_for_this_one
            two_views_of_one_directory_are_both_looked_through
            a_mount_placed_while_reads_resolve_never_reaches_the_other_tree
            a_removal_stops_before_a_directory_mounted_into_the_tree
            bind_mount_and_cross_device_grafts_are_refused
            recursive_removal_refuses_a_grafted_mount
          )
          log="$RUNNER_TEMP/mount-checks.log"
          : >"$log"
          before="$(sysctl -n "$restriction")"
          echo "$restriction is $before"
          if unshare -r -m true; then
            echo "before the change: unshare -r -m was given"
          else
            echo "before the change: unshare -r -m was refused"
          fi
          # However the step ends from here on, the runner's own setting is put back first, and a
          # setting that could not be put back fails the step.
          put_back() {
            local status=$?
            if ! sudo sysctl -w "$restriction=$before"; then
              echo "$restriction could not be put back to $before" >&2
              status=1
            fi
            exit "$status"
          }
          trap put_back EXIT
          sudo sysctl -w "$restriction=0"
          if ! unshare -r -m true; then
            echo "after the change: unshare -r -m was still refused" >&2
            exit 1
          fi
          echo "after the change: unshare -r -m was given"
          failed=0
          cargo test --locked -p kr-changeset --test capture -- --ignored --exact --color never \
            "${checks[@]:0:3}" 2>&1 | tee -a "$log" || failed=1
          cargo test --locked -p kr-transfer --test authority -- --ignored --exact --color never \
            "${checks[@]:3:2}" 2>&1 | tee -a "$log" || failed=1
          cargo test --locked -p kr-project --test locations -- --ignored --exact --color never \
            "${checks[@]:5:2}" 2>&1 | tee -a "$log" || failed=1
          passed=0
          for check in "${checks[@]}"; do
            if grep -q -F -x "test $check ... ok" "$log"; then
              passed=$((passed + 1))
            else
              echo "$check did not pass" >&2
            fi
          done
          echo "$passed of the ${#checks[@]} mount checks passed"
          [ "$failed" -eq 0 ] && [ "$passed" -eq "${#checks[@]}" ]

      - name: Generated protocol schema is current
        run: cargo run --locked -p kr-protocol --bin kr-protocol-gen -- --check

      - name: Cryptography vectors are current
        run: cargo run --locked -p kr-crypto --bin kr-crypto-vectors -- --check

      - name: Generated plugin SDK schema, WIT package and fixtures are current
        run: cargo run --locked -p kr-plugin-sdk --bin kr-plugin-sdk-gen -- --check

      - name: Fixture packages validate
        run: |
          for package in fixtures/plugins/valid/*/; do
            cargo run --locked -p kr-plugin-sdk --bin kr-plugin-sandbox -- "$package"
          done

      - name: Pairing vectors are current
        run: cargo run --locked -p kr-pairing --bin kr-pairing-vectors -- --check

      - name: Terminal fixtures are current
        run: cargo run --locked -p kr-term --bin kr-term-fixtures -- --check

      # Every crate in Cargo.lock, checked against the RustSec advisory database as it stands when
      # this step runs. .cargo/audit.toml says what fails the check and names each advisory this
      # workspace has accepted, with its reason and the condition for removing it. The checker is
      # one release, and its archive has to match the digest here before it runs; it and the
      # database are public downloads, so the step needs no credential. It runs whatever the steps
      # before it did, and every step after it runs whatever this one does, so an advisory published
      # since the last run fails the job without hiding any other result.
      - name: Dependencies against the RustSec advisories
        if: ${{ !cancelled() }}
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
        run: |
          set -euo pipefail
          release="cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION"
          tag="cargo-audit%2Fv$CARGO_AUDIT_VERSION"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$release.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/$tag/$release.tgz"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$release.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$release.tgz" --directory "$RUNNER_TEMP"
          status=0
          "$RUNNER_TEMP/$release/cargo-audit" audit || status=$?
          # Which state of the database this run was judged against, pass or fail. `cargo audit`
          # keeps it in the Cargo home.
          git -C "${CARGO_HOME:-$HOME/.cargo}/advisory-db" log -1 \
            --format="advisory database at %H (%cI)" || true
          exit "$status"

      # The legs that check a client against a live deployment rather than against something this
      # repository wrote. The workspace test above ran them with no deployment named, where each one
      # prints why it did nothing; this one names one, so a leg that did not run is a failure here.
      # Every principal is made when a leg starts and discarded when it ends, no account is created
      # and nothing is bought, and each leg gives back what it published before it reports.
      #
      # It sits after every check that reads only this repository, so all of those have reported by
      # the time anything here contacts a service, and a deployment that is unreachable fails this
      # job without taking their answers with it. Every step after it states `!cancelled()`.
      - name: The deployment answers every leg
        if: ${{ !cancelled() }}
        run: bash scripts/e2e-deployment.sh "$KR_CHECKPOINT_ORIGIN"

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the Secret Service. A headless runner has neither the service nor a session bus to
      # reach it on, so the step below starts both for itself; these are the packages it needs.
      - name: Install a credential store for this runner
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring dbus-x11

      # The one test that writes to this machine's own credential store. It does nothing until a run
      # says it may, because on a person's machine that store is their login keyring, so the switch
      # is set here and on no other step.
      #
      # The store lives for this step and nowhere else. `dbus-run-session` gives the command a
      # session bus of its own and ends it when the command returns; the keyring is made under a
      # directory this step created, which the shell removes as it exits, whether the command
      # succeeded, failed or stopped on its own error, so the runner's own home keeps nothing. The
      # test refuses to run at all unless the store answered, and the item it writes is named for
      # the run and taken away before it finishes.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            store="$(mktemp -d)"
            # The removal is a function and the trap names it, so what is removed is read from the
            # variable when it runs rather than parsed again as a command line.
            take_it_away() { rm -rf -- "${store:?}"; }
            trap take_it_away EXIT
            export XDG_DATA_HOME="$store/data" XDG_RUNTIME_DIR="$store/run"
            mkdir -p "$XDG_DATA_HOME/keyrings" "$XDG_RUNTIME_DIR"
            chmod 700 "$store" "$XDG_RUNTIME_DIR"
            echo -n "the keyring this step makes" |
              gnome-keyring-daemon --unlock --daemonize --components=secrets
            # The daemon takes the bus name once it is ready, and the test needs it taken before it
            # asks for a store. Waiting for the name is what makes that ordering certain, and a wait
            # that ran out is this step failing rather than a test deciding what it means.
            ready=no
            for _ in $(seq 1 30); do
              if dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                   /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                   string:org.freedesktop.secrets | grep -q "boolean true"; then
                ready=yes
                break
              fi
              sleep 1
            done
            if [ "$ready" != yes ]; then
              echo "no credential store answered on this session bus" >&2
              exit 1
            fi
            cargo test --locked -p kr-client --lib -- --nocapture --exact \
              sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again
          '

      # KR-PERF-007 is a throughput target, so the figure comes from an optimised build. Serially,
      # because three of the tests in this file are timings and they measure each other otherwise.
      # Each measurement step below runs whatever the one before it did, so a figure one of them
      # could not meet does not hide the next one's result. A failure still fails the job.
      - name: Terminal output handling
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p kr-term --test perf -- --nocapture --test-threads=1

      # KR-PERF-005 and KR-PERF-006 are timed targets, so their figures come from an optimised
      # build too. The harness prints the measurement conditions section 27 states beside each
      # figure and asserts the scheduling target where those conditions hold; a runner that cannot
      # meet them records the figure and names the shortfall instead. The property behind the
      # figure is asserted in the test step above, so a run that got that far has it. Serially,
      # because the two measurements would otherwise time each other.
      - name: Transport scheduling and reconnect
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p kr-transport --test perf -- --nocapture --test-threads=1

      # The figures and verdicts the two steps above wrote, kept whether or not they met their
      # targets: a run that fell short is the evidence for how far short it fell, and on which
      # processor.
      - name: Keep the performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence
          path: /tmp/kr-test-artifacts
          if-no-files-found: error

      # What the disk had left once the build and every check above it were done, beside the
      # reading the first step took.
      - name: What the disk has left
        if: ${{ !cancelled() }}
        run: df -h /

  windows:
    name: windows
    runs-on: windows-2025
    env:
      # The runner has one build cache and no reason to keep incremental artefacts between steps.
      CARGO_INCREMENTAL: "0"
      # What this job does *not* set is RUSTFLAGS. The Windows link needs two arguments about the
      # vendored C library, and they are in `.cargo/config.toml` so that every Windows build gets
      # them; RUSTFLAGS in the environment replaces that file's flags rather than adding to them,
      # so setting it here would quietly undo them.
      # Section 27 puts every test artefact in one platform-resolved directory. This runner's
      # temporary directory is where that is on Windows.
      KR_TEST_ARTIFACTS_DIR: C:\kr-test-artifacts
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # What this runner is, printed before anything asserts on it: a pass or a failure below then
      # names the Windows build, the console host, the shells it happened on and the privileges its
      # account holds, which decide whether an access-control list binds that account at all.
      - name: What this runner is
        run: |
          [System.Environment]::OSVersion.VersionString
          $PSVersionTable.PSVersion.ToString()
          (Get-Command pwsh).Source
          (Get-Command git).Source
          & "$env:ProgramFiles\Git\usr\bin\sh.exe" -c 'echo the POSIX shell the test scripts use is here'
          whoami /priv

      # Everything the workspace compiles for this target, including the test targets: a test that
      # only builds on Unix is a Windows failure, and this is where it is caught.
      - name: Compile the workspace and its tests
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # What has been qualified on this platform, and only that: the terminal engine, the
      # repository boundary, the attach client, the contact tools against a session's job, the
      # worker's own library, the suite that drives a real pseudo-console, a real PowerShell and a
      # real job object and hosts a worker on its own pipe, where a launched agent's helper is
      # placed, what a question's caller token reaches, a controller's and the local command
      # line's authority at a worker's pipe, the local endpoint, descriptors and process identity
      # the host rests on (the descriptor reader checks both the directory's and the file's
      # access-control lists here), every local store's directory flush, the persistence suite, the
      # decision a worker start makes about breaking away from the daemon's job, the real-worker
      # host tests from the built executable, and the first-owner pairing against a real control
      # daemon on loopback. "The attach client" means the part of it that runs
      # here - `crates/kr-cli/tests/attach.rs` is a Unix file, so what passes is that crate's library
      # and its path tests rather than a real attachment. The contact tools run in
      # `crates/kr-cli/tests/contact_windows.rs`, beside the Unix suite, with the tool server
      # started by a root shell inside the session's job.
      #
      # The persistence suite runs with PowerShell 7 as each session's root shell rather than the
      # `/bin/sh` this platform has not got. The host tests that start a real worker are run from the
      # built test executable rather than through `cargo test`, because cargo's own job kills its
      # members on close and forbids breakaway, so a worker started under it cannot be made the
      # independent process it must be; the executable, run directly, is not inside that job, and the
      # worker starts. Three of those tests are held back, named at their step: two need the worker's
      # rendezvous to complete on this platform, which it does not yet, and one uses a POSIX shell
      # binary this platform has not got. Each gives its reason in its ignore attribute in
      # `crates/kr-worker/tests/host.rs`.
      #
      # What this runner cannot do at all is qualify a console interactively. The pseudo-console
      # tests open a console of their own and drive it, which works here; what needs a real machine
      # is the release matrix - Windows Terminal, an IME, a physical keyboard and a GUI logon - and
      # `docs/host/README.md` has that procedure for the Windows test machine.
      # One command per step. Three in one script would run under a shell that carries on after a
      # native command fails, and the step would then report whatever the last one returned: a
      # failure in the first two could pass.
      # The pairing tests below run `kr` against a real control daemon they find built beside them,
      # so the daemon's binary is built before the kr-cli suites run.
      - name: Build the control daemon the pairing tests use
        run: cargo build --locked -p kr-controller

      # kr-cli's suites include the first-owner pairing tests in `crates/kr-cli/tests/pair_windows.rs`,
      # which start the daemon on loopback (its network listener comes up on this platform), confirm
      # the first owner at a pseudo-console outside every session, and refuse it with no console,
      # inside a session, and where session membership cannot be established.
      - name: Test the terminal engine, the repository boundary, the attach client and pairing
        run: cargo test --locked -p kr-term -p kr-project -p kr-cli

      - name: Test the worker's library
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --lib

      # The settings-sync store's locks on this platform. It takes an exclusive lock on the store
      # and one on each request, and a request one process is holding is refused to another, which
      # is the operating system's lock and not a compiled-in one. The suite proves that by starting
      # a second process, so it is the file locking of this platform that answers.
      - name: Test the settings-sync store
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-client --test sync

      # The session job object and, beside it, a worker hosted on its own named pipe: each worker's
      # journal and pipe are its own, the pipe's list is its owner's, and a local caller on it is
      # served as that owner and held to the worker's own session.
      - name: Drive a pseudo-console, PowerShell and the session job object
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test windows

      # Where the worker places a helper that an agent it launched started: by the job the agent
      # was started in, since a Windows process keeps naming a parent that has exited, and that job
      # is let go of with the last instance that names the agent.
      - name: Place a launched agent's helper by the job it was started in
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test question_bindings

      # The local endpoint on this platform and what it rests on. A worker's endpoint is a named
      # pipe that carries its own access-control list: a caller without the owner's identity is
      # refused when it opens it, and so is the owner arriving over the network, which is why this
      # case opens a pipe through the runner's own file-sharing server. The pipe names the process
      # at its other end; a descriptor is published under its owner's list and replaced whole; a
      # process's start identity is the creation time Windows records, in its hundreds of
      # nanoseconds, so two processes started within one second are two identities, and a process
      # this account may only ask when it started is identified without its liveness being guessed.
      - name: Test the local endpoint, the descriptors and the process identity
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-ipc --test windows

      # The crate's own tests, among them the environment identity's list and the profile it is
      # kept in, and the two frame-writer tests that used to be skipped here: on this platform a
      # named pipe has no writability of its own the writer can hold while the reader holds the other
      # half, so a waiter polls rather than parking and a fresh pipe answers the first offer as
      # pending, and both tests now assert that pipe-granularity behaviour by condition. The cost of
      # the poll and the rule that every caller bounds it are on `Readiness::ready` and in
      # `docs/transport/README.md`.
      - name: Test the local IPC library
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-ipc --lib

      # What the originating agent may do with a question on this platform's identities: a caller
      # token works only for the helper it was issued to.
      - name: Test what a question's caller token reaches
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test questions_answer

      # A controller's authority at a worker's own pipe, and the local command line on it, which
      # the pipe admits as its owner and the worker still holds to its own session.
      - name: Test controller and local authority at a worker's pipe
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test authority

      # A worker of the previous release keeps running across an upgrade and states its start in
      # whole seconds. The registry settles every record of one each time it is opened: a process
      # still running is recorded at the creation time Windows records, and one that has gone is
      # marked ended. The test process stands in for such a worker.
      - name: Settle the registry's records of a previous release's workers
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-controller --lib registry

      # A Windows worker must be independent of the daemon's kill-on-close job, so the start asks to
      # break away from that job only when the daemon's own job would kill it on close. This checks
      # that decision for the four job contexts the product can be started in.
      - name: Decide a worker's breakaway from the daemon's job
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-controller --lib supervision::tests::a_worker_breaks_away_from_a_kill_on_close_or_a_breakaway_permitting_job

      # The environment feature store on this platform, among its tests the claim a controller of
      # the previous release wrote on it with its start in whole seconds, which the next owner
      # reads and replaces.
      - name: Test the attention store
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-attention

      # Every local store flushes the directory it changes a name in through one shared handle in
      # kr-ipc, opened with the right the change used and passing over a directory on the path this
      # account may not add to. The flush itself is checked in "Test the local IPC library" above;
      # this runs the client's own stores that call it - the drafts store, the offline-answer store,
      # the settings-sync store and its membership file, and the recovery-bundle record.
      - name: Test the client's stores and their directory flush
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-client --lib

      # The root editor's own transport on this platform. The bridge endpoint is a named pipe
      # rather than a socket, so the client keeps one asynchronous read in flight and collects it
      # between the reader's operations; a client that never reads cannot complete a handshake at
      # all. The suite starts PowerShell 7 on the module files in the checkout and holds the
      # worker's half of the handshake, so it needs no installed editor and no console.
      - name: The PowerShell bridge client over a named pipe
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-shell-integration --test pwsh_windows

      # The reference bridge against a real endpoint on this platform. The published Windows
      # address carries the pipe prefix and the endpoint layer supplies it again, so a client that
      # passes the address through unchanged asks for a name no listener holds.
      - name: The reference bridge over a real endpoint
        if: ${{ !cancelled() }}
        # Quoted: a plain YAML scalar cannot end in a colon, and the filter does.
        run: "cargo test --locked -p kr-shell-integration --lib host::scripted::"

      # The repository boundary refuses every operation on this platform and names what it cannot
      # hold. Run again on its own so a pass or a failure names this system.
      - name: Repository boundary
        if: ${{ !cancelled() }}
        run: |
          [System.Environment]::OSVersion.VersionString
          git --version
          cargo test --locked -p kr-project --test boundary -- --nocapture

      # What a change set carries across a replacement, on the platform whose access-control lists
      # have no counterpart on the others. No apply case runs here: the platform-independent cases
      # are Unix-only, and the three that check what an apply carries across a Windows access-control
      # list each need a repository tool, which the Windows repository boundary refuses to run, so
      # they are ignored. `--all-targets` above compiles them; each runs with `--ignored` on a
      # Windows host whose boundary runs a repository tool, which no host does yet. `--nocapture`
      # prints that nothing ran rather than hiding it.
      - name: Test what an apply carries across
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-changeset --test apply -- --nocapture

      # The handle-based authority itself: the no-escape policy against the fixture's own tree, and
      # what a replacement reads, writes and verifies on an object's access-control list and the
      # account it belongs to. `--nocapture` prints every case the runner could not build the
      # objects for, so a prerequisite it lacks is visible rather than counted as a pass.
      - name: Test filesystem authority and access-control lists
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-transfer --lib --test authority -- --nocapture

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the Credential Manager, which this runner's account already has. The one test that
      # writes to it does nothing until a run says it may, because on a person's machine that store
      # holds their own credentials, so the switch is set here and on no other step. What the test
      # writes is named for the run and taken away before the test finishes.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: cargo test --locked -p kr-client --lib -- --nocapture --exact sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again

      # Section 24 at the worker: the durability contract, the outbox, retention, the journal-fault
      # seam, local state and forward-only migration. The root shell each session runs is PowerShell
      # 7 here rather than the `/bin/sh` this platform has not got, and the owner-only check reads
      # each state directory's access-control list. One test is Unix-only and absent here: its root
      # program is a POSIX script that turns off echo, traps the interrupt signal and reads a line at
      # a time, and its store-side halves run in the tests below it.
      - name: Test the persistence suite
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test persistence

      # A Windows worker start inside a job that kills on close and forbids breakaway is refused with
      # a named failure, which `cargo test`'s own job is, so this runs under cargo. The real-worker
      # host tests are ignored here for that reason; they run from the built executable in the next
      # step, outside cargo's job.
      - name: The named breakaway failure inside cargo's job
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test host

      # The real-worker host tests, run from the built executable directly rather than through cargo,
      # so they are not inside cargo's kill-on-close job and the worker starts. This runner's own job
      # does not kill on close, so no breakaway is asked for. Three are held back: two need the
      # worker's rendezvous to complete on this platform, which it does not yet (the worker does not
      # report itself in time), and one places a POSIX `/bin/cat` as a stand-in shell binary, which
      # this platform has not got. Each gives its reason in its ignore attribute in
      # `crates/kr-worker/tests/host.rs`.
      - name: The real-worker host tests, from the built executable
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Build without running, and take the executable Cargo says it built rather than the newest
          # file in the cache, so a failed build cannot fall through to a stale executable.
          $json = cargo test --locked -p kr-worker --test host --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = $json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'host' -and $_.executable } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { Write-Error 'cargo reported no host test executable'; exit 1 }
          & $exe --ignored --test-threads=1 --nocapture `
            --skip a_daemon_restart_keeps_the_session_and_its_shell `
            --skip the_descriptor_is_published_whole_and_owner_only_and_names_the_worker `
            --skip a_worker_that_reports_it_could_not_start_leaves_no_directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The other Windows target the product ships on. Nothing is executed for it here; this is
      # the compile the release baseline asks for.
      - name: Compile for ARM64
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked -p kr-ipc -p kr-worker -p kr-controller -p kr-cli -p kr-term -p kr-project --target aarch64-pc-windows-msvc

  shell-packages:
    name: shell-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # What the shells need to configure and build from their own release tarballs. Upstream is
      # fetched by the build script, never vendored. The fish package is a Rust shell built through
      # CMake, and its own build turns the message catalogues with gettext.
      - name: Install the shells' build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libncurses-dev cmake gettext
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: shells-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Section 26 asks packaging to verify clean patch application. The patches apply to the
      # pinned release with no fuzz at all, so a patch that has drifted from the release it names
      # fails here rather than being reconciled by hand.
      - name: Patches apply cleanly to the pinned releases
        run: bash scripts/build-shells.sh --all --check-patches

      # Fetches the pinned tarballs by digest, applies the patch sets, builds both packages and
      # runs each shell's own test suite. The identity written beside each binary is what the
      # package declares in its handshake.
      - name: Build the packages
        run: bash scripts/build-shells.sh --zsh --bash --require-upstream-tests

      # fish's own suite drives a terminal through Python and takes longer than this job has to
      # give it; the manifest still names it, so a person rebuilding the package runs it. What this
      # job proves about fish is that the patches apply, the shell builds, and the package answers
      # the contract in the step below.
      - name: Build the fish package
        run: bash scripts/build-shells.sh --fish --no-upstream-tests

      # This package builds no shell: it is qualified against the editor the runner already has,
      # and the module records what it found where the tests look for it.
      - name: Qualify the PSReadLine package
        run: |
          pwsh -NoProfile -Command '
            Import-Module ./shells/psreadline/module/KalaReach.ShellBridge.psd1
            Publish-KalaReachQualification | Format-List'

      # The identity is a digest of the inputs, so the same inputs land in the same place and a
      # second run has nothing to do.
      - name: A second build reports nothing changed
        run: |
          bash scripts/build-shells.sh --all | tee /tmp/kr-shell-rebuild.log
          grep -q 'zsh .* is current, nothing changed' /tmp/kr-shell-rebuild.log
          grep -q 'bash .* is current, nothing changed' /tmp/kr-shell-rebuild.log
          grep -q 'fish .* is current, nothing changed' /tmp/kr-shell-rebuild.log

      # Everything a person needs to rebuild the same package from the same upstream release: the
      # patch set, the sources the patches bring with them, the startup entry, the manifest that
      # pins and describes them, the licence, and the identity the run produced.
      - name: Collect the published patch sets and identities
        run: |
          # The same layout the build script and the document expect, so the archive can be
          # unpacked and built without moving anything.
          mkdir -p /tmp/kr-shell-packages/scripts /tmp/kr-shell-packages/docs/shell-integration
          cp scripts/build-shells.sh /tmp/kr-shell-packages/scripts/
          cp docs/shell-integration/packages.md /tmp/kr-shell-packages/docs/shell-integration/
          cp LICENSE /tmp/kr-shell-packages/
          for shell in zsh bash fish; do
            mkdir -p "/tmp/kr-shell-packages/shells/$shell"
            cp -r "shells/$shell/patches" "shells/$shell/src" "shells/$shell/startup" \
                  "/tmp/kr-shell-packages/shells/$shell/"
            cp "shells/$shell/manifest.json" "shells/$shell/LICENSE" \
               "/tmp/kr-shell-packages/shells/$shell/"
            identity="$(cat "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/$shell/current")"
            cp "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/$shell/$identity/kr-shell-identity.json" \
               "/tmp/kr-shell-packages/shells/$shell/"
          done
          # The package that patches nothing publishes its module and what it qualified against.
          mkdir -p /tmp/kr-shell-packages/shells/psreadline
          cp -r shells/psreadline/module shells/psreadline/startup \
                /tmp/kr-shell-packages/shells/psreadline/
          cp shells/psreadline/manifest.json shells/psreadline/LICENSE \
             /tmp/kr-shell-packages/shells/psreadline/
          identity="$(cat "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/powershell/current")"
          cp "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/powershell/$identity/kr-shell-identity.json" \
             /tmp/kr-shell-packages/shells/psreadline/

      - name: Publish the patch sets and identity records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-packages
          path: /tmp/kr-shell-packages
          if-no-files-found: error

      # The cases that drive a package are left out of a run that has built none, such as the rust
      # job's. This job built them above, so it runs those cases with --include-ignored, and a
      # package that is missing, or is not the one this tree gives, fails the case that needed it.
      - name: Drive the built packages through the contract
        run: |
          cargo test --locked -p kr-shell-integration \
            --test zsh --test bash --test fish --test pwsh -- --test-threads=1 --include-ignored

      # Section 7 qualifies the packages against the startup customisations people run. The
      # customisations are pinned by digest and fetched once here. The checks that need a package
      # or a customisation are left out of an ordinary run, and this job has both, so it runs them
      # with --include-ignored, where a package or a customisation that is missing fails.
      - name: Qualify the packages against the startup customisations
        env:
          KR_TEST_ARTIFACTS_DIR: /tmp/kr-shell-qualification
        run: |
          bash scripts/fetch-shell-stacks.sh
          # An installation a person updates holds two builds. The identity is a digest of the
          # build's inputs, so a flag that reaches the compiler makes a second package rather than
          # a second copy of the first; the pinned build is put back afterwards.
          CPPFLAGS="-DKR_QUALIFICATION_BUILD=1" bash scripts/build-shells.sh --zsh --no-upstream-tests
          bash scripts/build-shells.sh --zsh --no-upstream-tests
          cargo test --locked -p kr-shell-integration --test qualification -- \
            --test-threads=1 --include-ignored
          cat /tmp/kr-shell-qualification/qualification-cases.tsv

  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated types are current
        run: pnpm -r generate:check

      - name: Test
        run: pnpm -r test

  companion:
    name: companion
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # What the desktop shell links against on Linux: the WebView, its dependencies and the
      # window toolkit. macOS has its own in the system.
      - name: Install the desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: companion-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check the interface
        run: |
          pnpm -C apps/companion lint
          pnpm -C apps/companion typecheck

      # The unit and component tests, and the semantic-display measurement. Each measurement prints
      # its figure and its verdict, so a run that fell short leaves the number behind.
      - name: Test the interface
        run: pnpm -C apps/companion test

      - name: Build the interface
        run: pnpm -C apps/companion build

      # The backend, its boundary, and the shared client's upload sequence.
      - name: Test the native backend
        run: cargo test --locked -p companion-tauri -p kr-client

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the login keychain. The one test that writes to it does nothing until a run says it
      # may, because on a person's machine that keychain is their own, so the switch is set here and
      # on no other step. What the test writes is named for the run and taken away before the test
      # finishes. The step above ran the same suite with the switch unset, where this test prints
      # why it did nothing. The Linux half of this matrix has the Secret Service leg in the job that
      # starts a bus for it, so this step is this platform's alone.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: |
          cargo test --locked -p kr-client --lib -- --nocapture --exact \
            sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again

      - name: Install the browsers the end-to-end run drives
        run: pnpm -C apps/companion exec playwright install --with-deps chromium webkit

      - name: Drive the built interface
        env:
          KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
        run: pnpm -C apps/companion e2e

      # The figures, the traces and the screenshots the run produced, kept whether it passed or not.
      - name: Keep the end-to-end evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-evidence-${{ matrix.os }}
          path: /tmp/kr-test-artifacts
          if-no-files-found: ignore

      # The desktop application itself, compiled the way it is shipped: the production bundle, and
      # the feature that makes the binary serve it from inside itself rather than from a
      # development server.
      - name: Build the desktop application
        run: |
          pnpm -C apps/companion build
          cargo build --locked -p companion-tauri --release --features custom-protocol

  # The whole workspace on macOS: the lint, the workspace's tests, the end-to-end demonstrations and
  # the performance measurements, on the platform whose service manager, process table, disk images
  # and pseudo-terminals the host's macOS paths are written against. It runs beside the companion's
  # macOS leg rather than inside it, so neither waits for the other.
  #
  # What it leaves to the other jobs, because they run it natively and nothing in it differs on
  # macOS: formatting and the generated-file checks (rust), the TypeScript packages (typescript),
  # and compiling for Linux and Windows (rust and windows).
  #
  # A case this runner cannot run is left out by name, in the step that would otherwise count it as
  # passed, and the comment there says where it runs instead. A case that depends on something this
  # host provides comes after a step that shows the host provides it, or runs where its own output
  # says whether it ran.
  macos:
    name: macos
    runs-on: macos-15
    # Every step has a limit of its own, and the limits add up to less than this one, so a step that
    # hangs is ended and the steps after it still report. This one is under GitHub's six hours.
    timeout-minutes: 355
    env:
      # As in the rust job: no debug information in the profiles the tests build in, and no
      # incremental artefacts, which nothing here reads and the disk has to hold.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # What this runner is, printed before anything asserts on it, so a pass or a failure below
      # names the system, the login session, the keychain and the disk it happened on. The two
      # scripts start four build jobs unless told otherwise, and this runner has fewer processors
      # and less memory than that assumes, so every build here is given one job per processor.
      - name: What this runner is
        timeout-minutes: 2
        run: |
          sw_vers
          uname -srm
          echo "processors: $(sysctl -n hw.logicalcpu) logical, $(sysctl -n machdep.cpu.brand_string)"
          echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          echo "account: $(id -un), uid $(id -u); launchd session: $(launchctl managername)"
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" 2>&1 || true
          df -h /System/Volumes/Data
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      # The host runs the first Git on PATH, and on this runner that is Homebrew's. These steps run
      # Apple's own Git instead, the newest of those in the Xcodes this runner has: the Git of a Mac
      # with Xcode. It goes first on PATH as a two-line script that runs it by its own path, so the
      # Git that runs finds its helper directory and templates where Xcode put them, and the host,
      # which asks the copy of Git in that helper directory whether it is the same program, runs
      # that copy itself.
      - name: Put Apple's Git first
        timeout-minutes: 2
        run: |
          set -euo pipefail
          newest=""
          newest_version=""
          for developer in /Applications/Xcode_*.app/Contents/Developer; do
            application="${developer%/Contents/Developer}"
            # The image gives each Xcode more than one name; the others are links to the same one.
            if [ -L "$application" ] || [ ! -x "$developer/usr/bin/git" ]; then
              continue
            fi
            version="$("$developer/usr/bin/git" --version | awk '{ print $3 }')"
            later="$(printf '%s\n%s\n' "${newest_version:-0}" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
            if [ -z "$newest" ] || { [ "$later" = "$version" ] && [ "$version" != "$newest_version" ]; }; then
              newest="$developer/usr/bin/git"
              newest_version="$version"
            fi
          done
          if [ -z "$newest" ]; then
            echo "no Xcode on this runner has a Git in it" >&2
            exit 1
          fi
          directory="$RUNNER_TEMP/apple-git"
          mkdir -p "$directory"
          printf '%s\n' '#!/bin/sh' "exec \"$newest\" \"\$@\"" > "$directory/git"
          chmod +x "$directory/git"
          echo "$directory" >> "$GITHUB_PATH"
          cat "$directory/git"
          "$directory/git" --version
          "$directory/git" --exec-path

      - name: Install the pinned toolchain
        timeout-minutes: 5
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The plugin runtime's test components, which KR_REQUIRE_PLUGIN_FIXTURES makes a failure to
      # leave out rather than a skip.
      - name: Install the component target
        timeout-minutes: 5
        run: rustup target add wasm32-wasip2

      # The worker's pseudo-terminal suite starts each shell section 3 names as a session's root
      # shell. The runner has Bash and Zsh; Fish is installed here, and the test step names all
      # three as required, so a shell that is missing fails rather than being skipped.
      - name: Install the shells the worker's suite drives
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fish
          for shell in bash zsh fish; do
            echo "$shell: $(command -v "$shell")"
          done
          fish --version

      # The registry and the Git dependencies, and no build output: the dependencies' build output
      # alone is some nine gigabytes here, and the repository's cache, which every job shares, holds
      # ten in all. Saved from main alone, at the end of this job.
      - name: Restore the cargo registry
        id: cargo-registry
        timeout-minutes: 10
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the test components
        timeout-minutes: 10
        run: bash scripts/build-plugin-fixtures.sh

      # A graphical login domain in which this account can bootstrap and start a job, in the
      # background domain as well, done here the way the host starts a worker for a desktop-bound
      # and for a headless session: a definition that starts nothing when it is loaded, bootstrapped
      # into the domain, started once and then booted out. Several suites below take a different
      # branch on a host without that domain (a supervisor that is not launchd, or a case with
      # nothing to observe that returns early), so the job shows the domain works before them.
      - name: This account can start per-user launchd jobs
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          uid="$(id -u)"
          if ! launchctl print "gui/$uid" > /dev/null; then
            echo "gui/$uid: this account has no graphical login domain" >&2
            exit 1
          fi
          echo "gui/$uid: this account has a graphical login domain"
          definitions="$(mktemp -d)"
          loaded=""
          take_them_away() {
            for target in $loaded; do
              launchctl bootout "$target" 2>/dev/null || true
            done
            rm -rf -- "${definitions:?}"
          }
          trap take_them_away EXIT
          start() {
            domain="$1" session="$2"
            label="kr-launchd-check-$session-$$"
            definition="$definitions/$label.plist"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>Label</key><string>$label</string>" \
              '<key>ProgramArguments</key><array><string>/bin/sleep</string><string>120</string></array>' \
              '<key>RunAtLoad</key><false/><key>KeepAlive</key><false/>' \
              '<key>ProcessType</key><string>Interactive</string>' \
              "<key>LimitLoadToSessionType</key><string>$session</string>" \
              '</dict></plist>' > "$definition"
            launchctl bootstrap "$domain" "$definition"
            loaded="$loaded $domain/$label"
            spawned="$(launchctl kickstart -p "$domain/$label")"
            pid="$(printf '%s\n' "$spawned" | { grep -Eo '[0-9]+' || true; } | tail -n 1)"
            if [ -z "$pid" ] || ! ps -p "$pid" -o pid=,command=; then
              echo "$domain: the $session job reported no running process: $spawned" >&2
              exit 1
            fi
            launchctl bootout "$domain/$label"
            echo "$domain: a $session job was bootstrapped, started as process $pid and booted out"
          }
          start "gui/$uid" Aqua
          start "user/$uid" Background

      # From here each step runs whatever the one before it did, unless the job itself was
      # cancelled, so each reports its own result, and any one of them failing fails the job.
      - name: Clippy
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The workspace's tests, less what this runner cannot run, each left out by name here:
      #
      # - kr-sync-integration, every test of which is a leg against a live deployment and does
      #   nothing without one. The rust job runs each leg against the deployment it names.
      # - The container cases, which need podman, and this runner has none. The rust job's runner
      #   has it, and its test step runs them.
      # - The case that writes to the platform's credential store, which does nothing without its
      #   switch. The companion job's macOS leg runs it with the switch set.
      # - The two cases that launch a built shell package, which do nothing unless
      #   KR_SHELL_PACKAGES names one, and this job builds none. The shell-packages job builds the
      #   packages and drives them through the contract and qualification suites; these two cases
      #   run where KR_SHELL_PACKAGES names a built package.
      # - The cases that need another filesystem, and the cases whose verdicts are timings, which
      #   the two steps after this one run.
      - name: Test
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        env:
          KR_REQUIRE_SHELLS: bash,zsh,fish
        run: >-
          cargo test --locked --workspace --exclude kr-sync-integration --no-fail-fast --
          --skip the_helper_inside_a_container_refuses_a_handshake_that_declares_a_network_actor
          --skip a_running_container_is_observed_as_running_and_a_stopped_one_as_stopped
          --skip a_reused_container_name_is_not_the_identity_that_was_enrolled
          --skip the_argument_vector_reaches_the_container_exactly_as_it_was_built
          --skip a_helper_path_with_a_space_in_it_is_one_argument_inside_the_container
          --skip a_refresh_that_reached_a_running_environment_without_a_helper_scopes_no_channel
          --skip a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again
          --skip the_built_packages_are_qualified_where_this_run_has_them
          --skip a_real_qualified_package_registers_and_qualifies_on_this_hosts_endpoint
          --skip a_repository_whose_own_data_is_on_another_filesystem_is_captured
          --skip bind_mount_and_cross_device_grafts_are_refused
          --skip recursive_removal_refuses_a_grafted_mount
          --skip a_removal_stops_before_a_disk_image_attached_inside_the_tree
          --skip kr_req_11_38_every_export_is_stopped_by_its_own_deadline
          --skip kr_req_11_38_a_worker_is_told_when_the_queue_overflowed

      # The cases that put another filesystem in or beside a tree: a disk image attached inside a
      # location or a tree, and a repository whose own data is on another filesystem. Each one says
      # "not exercised" and returns when this host will not give it that filesystem, so they run
      # here with their output shown, and a case that says so fails the step, as does a case that
      # did not pass here by name.
      #
      # The repository case looks for a filesystem other than the one its temporary directory is
      # on, and on this runner everything else it looks at is on the data volume. So this step's
      # temporary directory is a volume of its own, added to the startup disk's container for the
      # step and deleted after it: internal rather than removable, and another filesystem from
      # /private/tmp.
      - name: The cases that need another filesystem
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cases=(
            a_repository_whose_own_data_is_on_another_filesystem_is_captured
            bind_mount_and_cross_device_grafts_are_refused
            recursive_removal_refuses_a_grafted_mount
            a_removal_stops_before_a_disk_image_attached_inside_the_tree
          )
          container="$(diskutil info -plist /System/Volumes/Data | plutil -extract APFSContainerReference raw -)"
          volume="$RUNNER_TEMP/another-filesystem"
          log="$RUNNER_TEMP/another-filesystem.log"
          device=""
          # The volume goes whatever the cases did. A volume that could not be deleted is said, and
          # fails a step that would otherwise have passed; a step that failed keeps its own status.
          take_it_away() {
            status=$?
            if [ -n "$device" ] && ! sudo diskutil apfs deleteVolume "$device"; then
              echo "the volume $device could not be deleted" >&2
              if [ "$status" -eq 0 ]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap take_it_away EXIT
          mkdir -p "$volume"
          sudo diskutil apfs addVolume "$container" APFS kr-another-filesystem -mountpoint "$volume"
          device="$(diskutil info -plist "$volume" | plutil -extract DeviceIdentifier raw -)"
          sudo diskutil enableOwnership "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          diskutil info "$volume" | grep -E 'Device Identifier|Mount Point|Owners|Removable Media|Device Location' || true
          echo "device of /private/tmp: $(stat -f %d /private/tmp); of $volume: $(stat -f %d "$volume")"
          TMPDIR="$volume" cargo test --locked --workspace --exclude kr-sync-integration \
            --test capture --test locations --test authority -- \
            --exact --show-output --test-threads=1 "${cases[@]}" 2>&1 | tee "$log"
          if grep -n 'not exercised' "$log"; then
            echo "a case above says it was not exercised" >&2
            exit 1
          fi
          for case in "${cases[@]}"; do
            if ! grep -q "^test $case \.\.\. ok\$" "$log"; then
              echo "$case did not pass here" >&2
              exit 1
            fi
          done

      # The cases whose verdicts are timings: a queue that must overflow before a slow component
      # drains it, and every export stopped at its own deadline. They run here one at a time, as the
      # rust job runs its timed suites serially, so that no other case of their suites shares this
      # runner's three processors with them. A case that did not pass here by name fails the step.
      - name: The timed cases, one at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cases=(
            kr_req_11_38_a_worker_is_told_when_the_queue_overflowed
            kr_req_11_38_every_export_is_stopped_by_its_own_deadline
          )
          log="$RUNNER_TEMP/timed-cases.log"
          status=0
          cargo test --locked --workspace --exclude kr-sync-integration --no-fail-fast \
            --test service --test execution -- \
            --exact --test-threads=1 "${cases[@]}" 2>&1 | tee "$log" || status=$?
          for case in "${cases[@]}"; do
            if ! grep -q "^test $case \.\.\. ok\$" "$log"; then
              echo "$case did not pass here" >&2
              status=1
            fi
          done
          exit "$status"

      # Real processes, real sockets and real terminals, the suites the script names and nothing
      # else, each of which must demonstrate something, and no process of the run left behind.
      - name: End-to-end demonstrations
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: bash scripts/end-to-end.sh

      # Everything the script below builds before it measures: the release profile of the
      # workspace, and the measurement suite and the input benchmark with their test dependencies.
      # Built here, so the machine can then be let settle and the script's own builds find nothing
      # to do: a figure taken while a build is still winding down is a figure about the build.
      - name: Build what the measurements run
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: |
          cargo build --locked --release --workspace
          cargo test --locked --release -p kr-worker --test performance --bench input_latency --no-run

      # Until the load average over the last minute is under one and a half, or ten minutes have
      # passed; the script records the load at the edges of every measurement either way.
      - name: Let the machine settle
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          for _ in $(seq 1 60); do
            if sysctl -n vm.loadavg | awk '{ exit !($2 < 1.5) }'; then
              break
            fi
            sleep 10
          done
          echo "load average: $(sysctl -n vm.loadavg)"

      # The idle-resource and attach targets (KR-PERF-003, KR-PERF-004) and the input measurements,
      # in a release build, each figure printed with the conditions it was taken under and asserted
      # against its bound.
      - name: Performance measurements
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: bash scripts/performance.sh

      # What the disk had left once every step above was done, and the size of what the save below
      # stores.
      - name: What the disk has left
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          df -h /System/Volumes/Data
          du -sh ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db

      - name: Save the cargo registry
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}
