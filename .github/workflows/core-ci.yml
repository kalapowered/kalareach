name: core-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The plugin runtime's tests run real components. A run that has not built them would skip those
  # cases with a printed reason, which is right on a developer's machine and wrong here: the build
  # step below is part of this job, so an absent component is a failure.
  KR_REQUIRE_PLUGIN_FIXTURES: "1"
  # Section 27 puts every test artefact in one platform-resolved directory and asks for a release
  # run's evidence to be retained. Each performance measurement writes its host, its figure and its
  # verdict here before it asserts anything, so a run the target failed on keeps the number.
  KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
  # The deployment the checkpoint step reports on. It is an address and not a credential, so it is
  # named here in the open rather than kept as a secret: the legs sign with keys they make for the
  # run, spend nothing and take back what they published, so an address is the whole of what that
  # step needs. It is deliberately not KR_DEPLOYED_ORIGIN, which would turn the offline legs in
  # every other job's test run into calls on this deployment as well.
  KR_CHECKPOINT_ORIGIN: "https://reach.kala.to"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    env:
      # This workspace's test build is large: a debug build of every crate's test targets, and then
      # an optimised build for the two timed measurements, in one directory. Debug information is
      # the greater part of that and nothing this job does reads it - a panic still names its file
      # and its line - so the profiles this job builds in carry none.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The runner has one build cache and no reason to keep incremental artefacts between steps.
      CARGO_INCREMENTAL: "0"
    steps:
      # The runner arrives with toolchains this project never uses, and removing them and the
      # container images widens the margin the build has to work in. This reading and the one the
      # last step takes are what that margin was.
      - name: Free the disk the build needs
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the exact toolchain; rustup installs it on first use.
      # libsodium-sys-stable builds libsodium from the source archive it ships, so the native
      # library is compiled and its length constants are checked against this wrapper on every run.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The workspace contains the companion application's backend, which links the system WebView
      # and the window toolkit. A workspace-wide check needs them present before it can compile.
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # The test components are compiled to wasm32-wasip2 and are not committed: Rust embeds build
      # paths in a component's custom sections, so two machines produce different bytes for the same
      # source and a committed artefact could not be checked.
      - name: Install the component target
        run: rustup target add wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fixtures/plugins/components/target
          # The key names how the artefacts were built as well as what they were built from. A
          # cache from a run that kept debug information would otherwise be restored into this
          # directory, and the build would leave both sets of artefacts in it.
          key: cargo-${{ runner.os }}-nodebuginfo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'fixtures/plugins/components/Cargo.lock') }}

      - name: Build the test components
        run: bash scripts/build-plugin-fixtures.sh

      # The package that ships with the host, checked against the lock that names it. This
      # recomputes every digest under bundled-plugins/ and fails on any drift. It reaches no
      # network and needs no plugin repository: the bundle and the lock beside it are the whole
      # input, which is what a host with nothing reachable has too.
      - name: The bundled package matches its lock
        run: bash scripts/sync-bundled-plugins.sh --verify

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # The project service encloses every Git invocation in a boundary the kernel applies, and what
      # that boundary is differs by platform. This runs its tests again on their own and prints what
      # this runner's kernel and Git are, so a pass or a failure here names the system it happened
      # on rather than leaving it to be inferred.
      - name: Repository boundary
        # Whatever the step before it did: a run that ends in an unrelated failure is still the run
        # that says what this kernel and this Git are, and whether the boundary holds on them.
        if: ${{ !cancelled() }}
        run: |
          uname -srm
          git --version
          cargo test --locked -p kr-project --test boundary -- --nocapture

      - name: Generated protocol schema is current
        run: cargo run --locked -p kr-protocol --bin kr-protocol-gen -- --check

      - name: Cryptography vectors are current
        run: cargo run --locked -p kr-crypto --bin kr-crypto-vectors -- --check

      - name: Generated plugin SDK schema, WIT package and fixtures are current
        run: cargo run --locked -p kr-plugin-sdk --bin kr-plugin-sdk-gen -- --check

      - name: Fixture packages validate
        run: |
          for package in fixtures/plugins/valid/*/; do
            cargo run --locked -p kr-plugin-sdk --bin kr-plugin-sandbox -- "$package"
          done

      - name: Pairing vectors are current
        run: cargo run --locked -p kr-pairing --bin kr-pairing-vectors -- --check

      - name: Terminal fixtures are current
        run: cargo run --locked -p kr-term --bin kr-term-fixtures -- --check

      # The legs that check a client against a live deployment rather than against something this
      # repository wrote. The workspace test above ran them with no deployment named, where each one
      # prints why it did nothing; this one names one, so a leg that did not run is a failure here.
      # Every principal is made when a leg starts and discarded when it ends, no account is created
      # and nothing is bought, and each leg gives back what it published before it reports.
      #
      # It sits after every check that reads only this repository, so all of those have reported by
      # the time anything here contacts a service, and a deployment that is unreachable fails this
      # job without taking their answers with it. Every step after it states `!cancelled()`.
      - name: The deployment answers every leg
        if: ${{ !cancelled() }}
        run: bash scripts/e2e-deployment.sh "$KR_CHECKPOINT_ORIGIN"

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the Secret Service. A headless runner has neither the service nor a session bus to
      # reach it on, so the step below starts both for itself; these are the packages it needs.
      - name: Install a credential store for this runner
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring dbus-x11

      # The one test that writes to this machine's own credential store. It does nothing until a run
      # says it may, because on a person's machine that store is their login keyring, so the switch
      # is set here and on no other step.
      #
      # The store lives for this step and nowhere else. `dbus-run-session` gives the command a
      # session bus of its own and ends it when the command returns; the keyring is made under a
      # directory this step created, which the shell removes as it exits, whether the command
      # succeeded, failed or stopped on its own error, so the runner's own home keeps nothing. The
      # test refuses to run at all unless the store answered, and the item it writes is named for
      # the run and taken away before it finishes.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            store="$(mktemp -d)"
            # The removal is a function and the trap names it, so what is removed is read from the
            # variable when it runs rather than parsed again as a command line.
            take_it_away() { rm -rf -- "${store:?}"; }
            trap take_it_away EXIT
            export XDG_DATA_HOME="$store/data" XDG_RUNTIME_DIR="$store/run"
            mkdir -p "$XDG_DATA_HOME/keyrings" "$XDG_RUNTIME_DIR"
            chmod 700 "$store" "$XDG_RUNTIME_DIR"
            echo -n "the keyring this step makes" |
              gnome-keyring-daemon --unlock --daemonize --components=secrets
            # The daemon takes the bus name once it is ready, and the test needs it taken before it
            # asks for a store. Waiting for the name is what makes that ordering certain, and a wait
            # that ran out is this step failing rather than a test deciding what it means.
            ready=no
            for _ in $(seq 1 30); do
              if dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                   /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                   string:org.freedesktop.secrets | grep -q "boolean true"; then
                ready=yes
                break
              fi
              sleep 1
            done
            if [ "$ready" != yes ]; then
              echo "no credential store answered on this session bus" >&2
              exit 1
            fi
            cargo test --locked -p kr-client --lib -- --nocapture --exact \
              sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again
          '

      # KR-PERF-007 is a throughput target, so the figure comes from an optimised build. Serially,
      # because three of the tests in this file are timings and they measure each other otherwise.
      # Each measurement step below runs whatever the one before it did, so a figure one of them
      # could not meet does not hide the next one's result. A failure still fails the job.
      - name: Terminal output handling
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p kr-term --test perf -- --nocapture --test-threads=1

      # KR-PERF-005 and KR-PERF-006 are timed targets, so their figures come from an optimised
      # build too. The harness prints the measurement conditions section 27 states beside each
      # figure and asserts the scheduling target where those conditions hold; a runner that cannot
      # meet them records the figure and names the shortfall instead. The property behind the
      # figure is asserted in the test step above, so a run that got that far has it. Serially,
      # because the two measurements would otherwise time each other.
      - name: Transport scheduling and reconnect
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p kr-transport --test perf -- --nocapture --test-threads=1

      # The figures and verdicts the two steps above wrote, kept whether or not they met their
      # targets: a run that fell short is the evidence for how far short it fell, and on which
      # processor.
      - name: Keep the performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence
          path: /tmp/kr-test-artifacts
          if-no-files-found: error

      # What the disk had left once the build and every check above it were done, beside the
      # reading the first step took.
      - name: What the disk has left
        if: ${{ !cancelled() }}
        run: df -h /

  windows:
    name: windows
    runs-on: windows-2025
    env:
      # The runner has one build cache and no reason to keep incremental artefacts between steps.
      CARGO_INCREMENTAL: "0"
      # What this job does *not* set is RUSTFLAGS. The Windows link needs two arguments about the
      # vendored C library, and they are in `.cargo/config.toml` so that every Windows build gets
      # them; RUSTFLAGS in the environment replaces that file's flags rather than adding to them,
      # so setting it here would quietly undo them.
      # Section 27 puts every test artefact in one platform-resolved directory. This runner's
      # temporary directory is where that is on Windows.
      KR_TEST_ARTIFACTS_DIR: C:\kr-test-artifacts
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # What this runner is, printed before anything asserts on it: a pass or a failure below then
      # names the Windows build, the console host and the shells it happened on.
      - name: What this runner is
        run: |
          [System.Environment]::OSVersion.VersionString
          $PSVersionTable.PSVersion.ToString()
          (Get-Command pwsh).Source
          (Get-Command git).Source
          & "$env:ProgramFiles\Git\usr\bin\sh.exe" -c 'echo the POSIX shell the test scripts use is here'

      # Everything the workspace compiles for this target, including the test targets: a test that
      # only builds on Unix is a Windows failure, and this is where it is caught.
      - name: Compile the workspace and its tests
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # What has been qualified on this platform, and only that: the terminal engine, the
      # repository boundary, the attach client, the worker's own library, and the suite that
      # drives a real pseudo-console, a real PowerShell and a real job object. "The attach client"
      # means the part of it that runs here - `crates/kr-cli/tests/attach.rs` is a Unix file, so
      # what passes is that crate's library and its path tests rather than a real attachment.
      #
      # The worker's other integration suites are **not** run here. They drive a session the way a
      # Unix pseudo-terminal behaves - a process group, a shell that answers a signal, a stream
      # with no console repainting it - and on Windows a good many of them fail. What each of
      # those failures means has not been established. What one whole run printed was a
      # `kr-worker.exe` copied to a temporary directory that Windows refused to start, a POSIX
      # shell that sometimes would not start, and a console that painted a screen and set a window
      # title before the shell wrote a byte. Running them here and calling the result a Windows
      # failure would say something this project has not established; compiling them, which the
      # step above does with `--all-targets`, is what this job owes them until somebody qualifies
      # them.
      #
      # What this runner cannot do at all is qualify a console interactively. The pseudo-console
      # tests open a console of their own and drive it, which works here; what needs a real machine
      # is the release matrix - Windows Terminal, an IME, a physical keyboard and a GUI logon - and
      # `docs/host/README.md` has that procedure for the Windows test machine.
      # One command per step. Three in one script would run under a shell that carries on after a
      # native command fails, and the step would then report whatever the last one returned: a
      # failure in the first two could pass.
      - name: Test the terminal engine, the repository boundary and the attach client
        run: cargo test --locked -p kr-term -p kr-project -p kr-cli

      - name: Test the worker's library
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --lib

      # The settings-sync store's locks on this platform. It takes an exclusive lock on the store
      # and one on each request, and a request one process is holding is refused to another, which
      # is the operating system's lock and not a compiled-in one. The suite proves that by starting
      # a second process, so it is the file locking of this platform that answers.
      - name: Test the settings-sync store
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-client --test sync

      - name: Drive a pseudo-console, PowerShell and the session job object
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-worker --test windows

      # The root editor's own transport on this platform. The bridge endpoint is a named pipe
      # rather than a socket, so the client keeps one asynchronous read in flight and collects it
      # between the reader's operations; a client that never reads cannot complete a handshake at
      # all. The suite starts PowerShell 7 on the module files in the checkout and holds the
      # worker's half of the handshake, so it needs no installed editor and no console.
      - name: The PowerShell bridge client over a named pipe
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-shell-integration --test pwsh_windows

      # The reference bridge against a real endpoint on this platform. The published Windows
      # address carries the pipe prefix and the endpoint layer supplies it again, so a client that
      # passes the address through unchanged asks for a name no listener holds.
      - name: The reference bridge over a real endpoint
        if: ${{ !cancelled() }}
        # Quoted: a plain YAML scalar cannot end in a colon, and the filter does.
        run: "cargo test --locked -p kr-shell-integration --lib host::scripted::"

      # The repository boundary refuses every operation on this platform and names what it cannot
      # hold. Run again on its own so a pass or a failure names this system.
      - name: Repository boundary
        if: ${{ !cancelled() }}
        run: |
          [System.Environment]::OSVersion.VersionString
          git --version
          cargo test --locked -p kr-project --test boundary -- --nocapture

      # What a change set carries across a replacement, on the platform whose access-control lists
      # have no counterpart on the others. The cases that need a checkout state that this host runs
      # no repository tool; what runs here is the rest, and `--nocapture` is what prints both.
      - name: Test what an apply carries across
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-changeset --test apply -- --nocapture

      # The handle-based authority itself: the no-escape policy against the fixture's own tree, and
      # what a replacement reads, writes and verifies on an object's access-control list and the
      # account it belongs to. `--nocapture` prints every case the runner could not build the
      # objects for, so a prerequisite it lacks is visible rather than counted as a pass.
      - name: Test filesystem authority and access-control lists
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-transfer --lib --test authority -- --nocapture

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the Credential Manager, which this runner's account already has. The one test that
      # writes to it does nothing until a run says it may, because on a person's machine that store
      # holds their own credentials, so the switch is set here and on no other step. What the test
      # writes is named for the run and taken away before the test finishes.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: cargo test --locked -p kr-client --lib -- --nocapture --exact sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again

      # The other Windows target the product ships on. Nothing is executed for it here; this is
      # the compile the release baseline asks for.
      - name: Compile for ARM64
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked -p kr-ipc -p kr-worker -p kr-controller -p kr-cli -p kr-term -p kr-project --target aarch64-pc-windows-msvc

  shell-packages:
    name: shell-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # What the shells need to configure and build from their own release tarballs. Upstream is
      # fetched by the build script, never vendored. The fish package is a Rust shell built through
      # CMake, and its own build turns the message catalogues with gettext.
      - name: Install the shells' build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libncurses-dev cmake gettext
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: shells-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Section 26 asks packaging to verify clean patch application. The patches apply to the
      # pinned release with no fuzz at all, so a patch that has drifted from the release it names
      # fails here rather than being reconciled by hand.
      - name: Patches apply cleanly to the pinned releases
        run: bash scripts/build-shells.sh --all --check-patches

      # Fetches the pinned tarballs by digest, applies the patch sets, builds both packages and
      # runs each shell's own test suite. The identity written beside each binary is what the
      # package declares in its handshake.
      - name: Build the packages
        run: bash scripts/build-shells.sh --zsh --bash --require-upstream-tests

      # fish's own suite drives a terminal through Python and takes longer than this job has to
      # give it; the manifest still names it, so a person rebuilding the package runs it. What this
      # job proves about fish is that the patches apply, the shell builds, and the package answers
      # the contract in the step below.
      - name: Build the fish package
        run: bash scripts/build-shells.sh --fish --no-upstream-tests

      # This package builds no shell: it is qualified against the editor the runner already has,
      # and the module records what it found where the tests look for it.
      - name: Qualify the PSReadLine package
        run: |
          pwsh -NoProfile -Command '
            Import-Module ./shells/psreadline/module/KalaReach.ShellBridge.psd1
            Publish-KalaReachQualification | Format-List'

      # The identity is a digest of the inputs, so the same inputs land in the same place and a
      # second run has nothing to do.
      - name: A second build reports nothing changed
        run: |
          bash scripts/build-shells.sh --all | tee /tmp/kr-shell-rebuild.log
          grep -q 'zsh .* is current, nothing changed' /tmp/kr-shell-rebuild.log
          grep -q 'bash .* is current, nothing changed' /tmp/kr-shell-rebuild.log
          grep -q 'fish .* is current, nothing changed' /tmp/kr-shell-rebuild.log

      # Everything a person needs to rebuild the same package from the same upstream release: the
      # patch set, the sources the patches bring with them, the startup entry, the manifest that
      # pins and describes them, the licence, and the identity the run produced.
      - name: Collect the published patch sets and identities
        run: |
          # The same layout the build script and the document expect, so the archive can be
          # unpacked and built without moving anything.
          mkdir -p /tmp/kr-shell-packages/scripts /tmp/kr-shell-packages/docs/shell-integration
          cp scripts/build-shells.sh /tmp/kr-shell-packages/scripts/
          cp docs/shell-integration/packages.md /tmp/kr-shell-packages/docs/shell-integration/
          cp LICENSE /tmp/kr-shell-packages/
          for shell in zsh bash fish; do
            mkdir -p "/tmp/kr-shell-packages/shells/$shell"
            cp -r "shells/$shell/patches" "shells/$shell/src" "shells/$shell/startup" \
                  "/tmp/kr-shell-packages/shells/$shell/"
            cp "shells/$shell/manifest.json" "shells/$shell/LICENSE" \
               "/tmp/kr-shell-packages/shells/$shell/"
            identity="$(cat "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/$shell/current")"
            cp "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/$shell/$identity/kr-shell-identity.json" \
               "/tmp/kr-shell-packages/shells/$shell/"
          done
          # The package that patches nothing publishes its module and what it qualified against.
          mkdir -p /tmp/kr-shell-packages/shells/psreadline
          cp -r shells/psreadline/module shells/psreadline/startup \
                /tmp/kr-shell-packages/shells/psreadline/
          cp shells/psreadline/manifest.json shells/psreadline/LICENSE \
             /tmp/kr-shell-packages/shells/psreadline/
          identity="$(cat "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/powershell/current")"
          cp "${XDG_CACHE_HOME:-$HOME/.cache}/kalareach/shells/powershell/$identity/kr-shell-identity.json" \
             /tmp/kr-shell-packages/shells/psreadline/

      - name: Publish the patch sets and identity records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-packages
          path: /tmp/kr-shell-packages
          if-no-files-found: error

      # The build above is a step of this job, so an absent package here is a failure rather than
      # a skip, which is what KR_REQUIRE_SHELL_PACKAGES says.
      - name: Drive the built packages through the contract
        env:
          KR_REQUIRE_SHELL_PACKAGES: "1"
        run: |
          cargo test --locked -p kr-shell-integration \
            --test zsh --test bash --test fish --test pwsh -- --test-threads=1

  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated types are current
        run: pnpm -r generate:check

      - name: Test
        run: pnpm -r test

  companion:
    name: companion
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # What the desktop shell links against on Linux: the WebView, its dependencies and the
      # window toolkit. macOS has its own in the system.
      - name: Install the desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: companion-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check the interface
        run: |
          pnpm -C apps/companion lint
          pnpm -C apps/companion typecheck

      # The unit and component tests, and the semantic-display measurement. Each measurement prints
      # its figure and its verdict, so a run that fell short leaves the number behind.
      - name: Test the interface
        run: pnpm -C apps/companion test

      - name: Build the interface
        run: pnpm -C apps/companion build

      # The backend, its boundary, and the shared client's upload sequence.
      - name: Test the native backend
        run: cargo test --locked -p companion-tauri -p kr-client

      # A collection key belongs in the operating system's own credential store, and on this system
      # that is the login keychain. The one test that writes to it does nothing until a run says it
      # may, because on a person's machine that keychain is their own, so the switch is set here and
      # on no other step. What the test writes is named for the run and taken away before the test
      # finishes. The step above ran the same suite with the switch unset, where this test prints
      # why it did nothing. The Linux half of this matrix has the Secret Service leg in the job that
      # starts a bus for it, so this step is this platform's alone.
      - name: A collection key is kept in this runner's credential store
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          KR_TEST_PLATFORM_SECRET_STORE: "1"
        run: |
          cargo test --locked -p kr-client --lib -- --nocapture --exact \
            sync::keys::tests::a_key_kept_in_the_platform_store_is_read_back_from_it_and_taken_away_again

      - name: Install the browsers the end-to-end run drives
        run: pnpm -C apps/companion exec playwright install --with-deps chromium webkit

      - name: Drive the built interface
        env:
          KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
        run: pnpm -C apps/companion e2e

      # The figures, the traces and the screenshots the run produced, kept whether it passed or not.
      - name: Keep the end-to-end evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-evidence-${{ matrix.os }}
          path: /tmp/kr-test-artifacts
          if-no-files-found: ignore

      # The desktop application itself, compiled the way it is shipped: the production bundle, and
      # the feature that makes the binary serve it from inside itself rather than from a
      # development server.
      - name: Build the desktop application
        run: |
          pnpm -C apps/companion build
          cargo build --locked -p companion-tauri --release --features custom-protocol
