name: core-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    name: vision
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Read the labels off a screenshot of the interface
        run: |
          set -u
          sw_vers
          started=$SECONDS
          xcrun swift scratch-vision/read-labels.swift scratch-vision/positive.png
          echo "positive exit $? after $((SECONDS - started)) s"

      - name: A screenshot without the tab bar, and a blank one, fail
        run: |
          set -u
          for name in no-tabbar blank; do
            xcrun swift scratch-vision/read-labels.swift "scratch-vision/$name.png"
            status=$?
            echo "$name exit $status"
            [ "$status" -eq 1 ] || exit 1
          done
