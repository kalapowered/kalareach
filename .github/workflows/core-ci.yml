name: core-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Run the macOS jobs (macos, macos-demonstrations, macos-reference, and the companion's macos-15 leg). Turned off, a manual run checks Linux and Windows only. A push or a pull request always runs them."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The plugin runtime's tests run real components. A run that has not built them would skip those
  # cases with a printed reason, which is right on a developer's machine and wrong here: the build
  # step below is part of this job, so an absent component is a failure.
  KR_REQUIRE_PLUGIN_FIXTURES: "1"
  # Section 27 puts every test artefact in one platform-resolved directory and asks for a release
  # run's evidence to be retained. Each performance measurement writes its host, its figure and its
  # verdict here before it asserts anything, so a run the target failed on keeps the number.
  KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
  # The deployment the checkpoint step reports on. It is an address and not a credential, so it is
  # named here in the open rather than kept as a secret: the legs sign with keys they make for the
  # run, spend nothing and take back what they published, so an address is the whole of what that
  # step needs. It is deliberately not KR_DEPLOYED_ORIGIN, which would turn the offline legs in
  # every other job's test run into calls on this deployment as well.
  KR_CHECKPOINT_ORIGIN: "https://reach.kala.to"
  # This workspace's test build is large: a debug build of every crate's test targets, and for the
  # timed measurements an optimised one, in one directory. Debug information is the greater part of
  # that and nothing a job here reads - a panic still names its file and its line - so the
  # profiles the jobs build in carry none. It is set for every job rather than for some, because
  # the settings are part of what a built crate is: jobs that differ in them cannot use one
  # another's build output, and the caches below are made of it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # No job has a reason to keep incremental artefacts between steps, and the cache would hold them.
  CARGO_INCREMENTAL: "0"

jobs:
  # The idle measurement on a host that meets section 27's reference host: four processors and
  # more than 8 GiB, the operating system and architecture recorded beside the figure. The
  # macos-demonstrations job's runner is short of that host, so it records the idle processor
  # figure and does not assert it; this job asserts it, with the memory bound, where nothing read
  # falls short. Only the measurements run here: the tests are the macos job's.
  macos-reference:
    name: macos-reference
    # Skipped, and shown as skipped, only in a manual run started with the macOS jobs turned off.
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-15-intel
    # The build alone is about an hour on this runner. Every step has a limit of its own, and the
    # limits add up to less than this one. The build's limit is at least twice the longest it has
    # taken, so that its work can grow before the limit is reached.
    timeout-minutes: 300
    steps:
      - name: Check out
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The disk as the image arrives, and from here to the last report the lowest free space in
      # each stretch of the job.
      - name: What the disk holds
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/disk-report.sh begin "the image as it arrives"

      # What this runner is, printed before anything asserts on it, so a pass or a failure below
      # names the processor, the memory and the system it happened on. Every build here is given
      # one job per processor.
      - name: What this runner is
        timeout-minutes: 2
        run: |
          sw_vers
          uname -srm
          echo "processors: $(sysctl -n hw.logicalcpu) logical, $(sysctl -n machdep.cpu.brand_string)"
          echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          df -h /System/Volumes/Data
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        timeout-minutes: 5
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Restore the cargo cache
        id: cargo-cache
        timeout-minutes: 10
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: macos-reference

      # Everything the script below builds before it measures, so that the script has as little
      # left to build as it can.
      - name: Build what the measurements run
        timeout-minutes: 160
        run: |
          cargo build --locked --release --workspace
          cargo test --locked --release -p kr-worker --test performance --bench input_latency --no-run

      # The measurements assert on an idle host, so the sampling of the free space ends here and
      # the report after them reads the disk once.
      - name: What the disk holds after the release build
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash scripts/disk-report.sh end "the release build"

      # The idle processor figure is asserted here because this host reports no shortfall against
      # the reference host; a shortfall the host reported would be recorded and named instead. The
      # script starts each measurement only once the one-minute load average is under the bound
      # named here, half this host's four processors, waiting at most ten minutes for it and
      # failing without a figure when it does not fall. Four such waits fit the limit below with
      # the measurements.
      - name: Performance measurements
        timeout-minutes: 60
        env:
          KR_PERF_SETTLE_LOAD: "2.0"
        run: bash scripts/performance.sh

      - name: What the disk has left
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash scripts/disk-report.sh report "what the disk has left"

      - name: Keep the test evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-macos-reference
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Save the cargo cache
        timeout-minutes: 15
        uses: ./.github/actions/cargo-cache-save
        with:
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
