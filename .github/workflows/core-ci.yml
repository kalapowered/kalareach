name: core-ci

on:
  workflow_dispatch:
    inputs:
      macos:
        type: boolean
        default: true
      ios:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The plugin runtime's tests run real components. A run that has not built them would skip those
  # cases with a printed reason, which is right on a developer's machine and wrong here: the build
  # step below is part of this job, so an absent component is a failure.
  KR_REQUIRE_PLUGIN_FIXTURES: "1"
  # Section 27 puts every test artefact in one platform-resolved directory and asks for a release
  # run's evidence to be retained. Each performance measurement writes its host, its figure and its
  # verdict here before it asserts anything, so a run the target failed on keeps the number.
  KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
  # The deployment the checkpoint step reports on. It is an address and not a credential, so it is
  # named here in the open rather than kept as a secret: the legs sign with keys they make for the
  # run, spend nothing and take back what they published, so an address is the whole of what that
  # step needs. It is deliberately not KR_DEPLOYED_ORIGIN, which would turn the offline legs in
  # every other job's test run into calls on this deployment as well.
  KR_CHECKPOINT_ORIGIN: "https://reach.kala.to"
  # This workspace's test build is large: a debug build of every crate's test targets, and for the
  # timed measurements an optimised one, in one directory. Debug information is the greater part of
  # that and nothing a job here reads - a panic still names its file and its line - so the
  # profiles the jobs build in carry none. It is set for every job rather than for some, because
  # the settings are part of what a built crate is: jobs that differ in them cannot use one
  # another's build output, and the caches below are made of it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # No job has a reason to keep incremental artefacts between steps, and the cache would hold them.
  CARGO_INCREMENTAL: "0"

jobs:
  # The companion on an Android phone, as a person gets it: the debug application packaged for the
  # two architectures an emulator and a phone run, the packaged classes and identifiers read back,
  # and then the application started on an emulator, with the native library's own cases run there
  # beside it. The job above lints Rust and builds nothing, and the unit tests of the phone's
  # Kotlin run in the nightly report; a library that links but does not load, a plugin the system
  # cannot instantiate and a page that never opens all pass those. The emulator is the Android SDK's
  # own, started with the hardware acceleration a hosted Linux runner offers.
  #
  # No cache is saved: the repository's caches are at their limit, and a cache saved here would
  # take the room of one every other job restores. The job's time is the cost of that.
  android-app:
    name: android-app
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The runner arrives with toolchains this project never uses; the Android SDK stays, with the
      # emulator and a system image to be added to it.
      - name: Free the disk the build needs
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # The architectures the universal package carries: the phone's, and the emulator's.
      - name: Install the Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      # The NDK the application's Gradle project pins is not on the runner's image, whose NDKs are
      # others. The emulator and the system image are the device the application is started on:
      # Android 16 with Google Play and 16 KB memory pages, the device the project's own scripts
      # use. The versions installed are printed, since the SDK manager is given no pin for the
      # emulator and the image.
      - name: Install the Android NDK, the emulator and a system image
        timeout-minutes: 20
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            echo "::error::the runner's Android SDK has no command-line tools at $manager"
            exit 1
          fi
          # The image's command-line tools are older than the repository the packages come from.
          yes | "$manager" --install "cmdline-tools;latest" > "$RUNNER_TEMP/sdkmanager.log"
          yes | "$manager" --licenses >> "$RUNNER_TEMP/sdkmanager.log"
          yes | "$manager" --install "ndk;28.2.13676358" "emulator" \
            "system-images;android-36;google_apis_playstore_ps16k;x86_64" >> "$RUNNER_TEMP/sdkmanager.log"
          tail -n 5 "$RUNNER_TEMP/sdkmanager.log"
          "$manager" --list_installed | grep -E 'cmdline-tools|ndk;28|emulator|system-images'
          {
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package is built the way a person builds it, and the script reads it back: the classes
      # the system resolves by name, among them the Tauri plugin, and the application identifier in
      # the manifest, the code and the libraries.
      - name: Build the debug application
        timeout-minutes: 60
        run: pnpm -C apps/companion android --debug --apk --target aarch64 x86_64

      # GitHub's documented way to give a hosted Linux runner's user the virtual machine device.
      - name: Let the emulator use the runner's virtual machine device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # One step, so that the emulator lives as long as what runs on it: the native library's cases
      # on the x86-64 architecture the emulator runs, then the application started and looked at.
      # Both run whatever the other did, and the log of the device is kept either way.
      - name: Run the native library and start the application on the emulator
        timeout-minutes: 30
        run: |
          set -uo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$KR_TEST_ARTIFACTS_DIR/android-app"
          avd=kalareach-ci
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name "$avd" \
            --package "system-images;android-36;google_apis_playstore_ps16k;x86_64" --device pixel
          # The application and the libraries it unpacks are more than the default data partition.
          echo "disk.dataPartition.size=8192M" >> "$HOME/.android/avd/$avd.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd "$avd" -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$KR_TEST_ARTIFACTS_DIR/android-app/emulator.log" 2>&1 &
          emulator=$!
          trap 'kill "$emulator" 2> /dev/null || true' EXIT
          serial=emulator-5554
          started=$SECONDS
          until [ "$(adb -s "$serial" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; do
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "::error::the emulator ended before it finished starting"
              tail -n 40 "$KR_TEST_ARTIFACTS_DIR/android-app/emulator.log"
              exit 1
            fi
            if [ $((SECONDS - started)) -gt 600 ]; then
              echo "::error::the emulator did not finish starting"
              exit 1
            fi
            sleep 2
          done
          echo "the emulator finished starting after $((SECONDS - started)) seconds"
          failed=0
          bash scripts/native-library-tests.sh android --serial "$serial" || failed=1
          bash scripts/android-app-launch.sh \
            apps/companion/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            "$KR_TEST_ARTIFACTS_DIR/android-app/launch.png" --serial "$serial" || failed=1
          adb -s "$serial" logcat -d -b all > "$KR_TEST_ARTIFACTS_DIR/android-app/logcat.txt" || true
          exit "$failed"

      # The screenshot of the started application, and the logs of the device.
      - name: Keep the Android evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-android
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: error

  # The companion on an iPhone, without any signing: the library linted for the device
  # architecture, the application built for the simulator with its Swift plugin, read back, and
  # then started in an iPhone simulator, with the native library's own cases run there beside it.
  # Nothing here holds a certificate, a profile or a secret. It runs in parallel with the other
  # macOS jobs and is the fifth of them in a run, so a run holds five hosted macOS runners at once.
  #
  # As the Android job, it saves no cache, and its time is the cost of that.
  ios:
    name: ios
    # Skipped, and shown as skipped, only in a manual run that turns off both the macOS jobs and this one.
    if: github.event_name != 'workflow_dispatch' || inputs.macos || inputs.ios
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: What the disk holds
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/disk-report.sh begin "the image as it arrives"

      # The tvOS, watchOS and visionOS runtimes are used by nothing here; the iOS ones stay.
      - name: Free the disk the build needs
        continue-on-error: true
        timeout-minutes: 8
        run: bash scripts/free-simulator-runtimes.sh --keep-ios

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # The device architecture is linted, and the simulator's is built and run.
      - name: Install the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # The runner's default Xcode is older than the Swift the application's code needs. The choice
      # is the one the phone unit tests make, and the version is printed.
      - name: Choose the newest Xcode
        run: |
          . scripts/lib/xcode.sh
          kr_select_xcode
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What Xcode's build gives the Swift package it builds from the Rust side is the application's
      # minimum system, which a lint outside Xcode has to be given the same way.
      - name: Lint the companion's Rust for the iPhone
        timeout-minutes: 40
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: cargo clippy --locked --lib -p companion-tauri --target aarch64-apple-ios -- -D warnings

      # The application as a person builds it for a simulator: the interface, the Rust library and
      # the Swift plugin, linked into KalaReach.app. A simulator build is signed ad hoc, "Sign to
      # Run Locally", which needs no identity, certificate or profile, and none is here. The
      # project's local settings file, which the repository ignores and the build reads when it
      # exists, gives the build two things a developer's machine has and this runner has not: the
      # one architecture this runner's simulator runs, because the notification extension would
      # otherwise be built for two and the identifier check reads one, and the Apple team's prefix
      # (read from the Xcode project, which names it: it is an identifier and not a credential),
      # which the keychain groups of the application and the extension begin with.
      - name: Build the application for the simulator
        timeout-minutes: 60
        run: |
          set -euo pipefail
          team="$(sed -n 's/^ *DEVELOPMENT_TEAM: *\([A-Z0-9]\{10\}\) *$/\1/p' apps/companion/src-tauri/gen/apple/project.yml)"
          if [ "$(printf '%s\n' "$team" | wc -l | tr -d ' ')" != 1 ] || [ -z "$team" ]; then
            echo "::error::the Xcode project does not name one Apple team"
            exit 1
          fi
          printf 'ARCHS = arm64\nAppIdentifierPrefix = %s.\n' "$team" > apps/companion/src-tauri/gen/apple/Local.xcconfig
          pnpm -C apps/companion tauri ios build --debug --ci --target aarch64-sim

      - name: Read the built application back
        run: |
          set -euo pipefail
          app="$(find apps/companion/src-tauri/gen/apple/build -name KalaReach.app -type d -not -path '*.xcarchive/*' | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::the build left no KalaReach.app"
            exit 1
          fi
          echo "KR_IOS_APP=$PWD/$app" >> "$GITHUB_ENV"
          node apps/companion/scripts/identifiers.mjs --ios "$app"

      # The newest iOS runtime the image has, and an iPhone on it that this job makes and removes.
      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes available -j | python3 -I -c '
          import json
          import sys

          found = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          print(max(found, key=lambda r: tuple(int(p) for p in r["version"].split(".")))["identifier"])
          ')"
          udid="$(xcrun simctl create kalareach-ci com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "KR_SIMULATOR=$udid" >> "$GITHUB_ENV"
          echo "simulator $udid on $runtime"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl list devices booted

      # The same cases as on the emulator, on the architecture the simulator runs.
      - name: Run the native library in the simulator
        timeout-minutes: 30
        run: bash scripts/native-library-tests.sh ios --udid "$KR_SIMULATOR"

      - name: Start the application in the simulator
        run: bash scripts/ios-app-launch.sh "$KR_IOS_APP" "$KR_SIMULATOR" "$KR_TEST_ARTIFACTS_DIR/ios-app/launch.png"

      - name: Shut the simulator down
        if: ${{ always() && env.KR_SIMULATOR != '' }}
        continue-on-error: true
        run: |
          xcrun simctl shutdown "$KR_SIMULATOR"
          xcrun simctl delete "$KR_SIMULATOR"

      - name: Keep the iOS evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-ios
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: error

      - name: What the disk has left
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash scripts/disk-report.sh end "what the disk has left"

  scratch-e2e:
    name: scratch-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the interface
        run: pnpm -C apps/companion build
      - name: Install the browsers the end-to-end run drives
        run: pnpm -C apps/companion exec playwright install --with-deps chromium webkit
      - name: Drive the built interface
        env:
          KR_TEST_ARTIFACTS_DIR: /tmp/kr-test-artifacts
        run: pnpm -C apps/companion e2e
      - name: The screenshots are in the evidence directory
        run: bash scripts/check-test-evidence.sh "$KR_TEST_ARTIFACTS_DIR" companion-screenshots
      - name: Keep the end-to-end evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-evidence-ubuntu-24.04
          path: /tmp/kr-test-artifacts
          if-no-files-found: error

  scratch-controls:
    name: scratch-controls
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - name: Restore the cargo cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: macos
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the desktop application
        run: |
          pnpm -C apps/companion build
          cargo build --locked -p companion-tauri --release --features custom-protocol
      - name: Operate the desktop application's native window controls
        timeout-minutes: 10
        run: bash scripts/desktop-controls-macos.sh target/release/kalareach-companion "$KR_TEST_ARTIFACTS_DIR/desktop-controls/window.png"
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-evidence-macos-15
          path: /tmp/kr-test-artifacts
          if-no-files-found: error

  scratch-windows:
    name: scratch-windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - name: Place libsodium's archives
        id: libsodium
        uses: ./.github/actions/libsodium-archive
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Build the desktop application
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/companion build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p companion-tauri --release --features custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = Get-Item target/release/kalareach-companion.exe -ErrorAction Stop
          "$($executable.FullName): $($executable.Length) bytes"

