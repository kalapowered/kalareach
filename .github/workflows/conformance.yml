name: conformance

# The conformance report on each hosted platform: every identifier of the specification the tests
# name, what each of those tests came to on that platform, the commands that reproduce them, and
# the application matrix in a real session, and the phone applications' unit tests. docs/conformance/
# README.md states the result. It is started by hand and every night; the landing workflow is
# core-ci. A run started by hand can name the groups to run and leave a platform out, which is how
# one group of the report is tried without a night's hours; the nightly run has every group on every
# platform.
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "The groups of the report to run, separated by spaces: rust, end-to-end, performance, typescript, applications, phones. Empty runs every group the platform runs. The nightly run is always empty."
        type: string
        default: ""
      linux:
        description: "Run the Linux job."
        type: boolean
        default: true
      macos:
        description: "Run the macOS job."
        type: boolean
        default: true
      windows:
        description: "Run the Windows job."
        type: boolean
        default: true
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

# A second run of the same ref waits for the first rather than cutting its evidence short.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: linux
    # A manual run can leave a job out; the nightly run has all three.
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # No debug information and no incremental artefacts: nothing here reads them, and the disk
      # has to hold a debug build of every test target and a release build for the measurements.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # The plugin runtime's tests run real components, which the step below builds; a component
      # that is not there is a failure here rather than a skip.
      KR_REQUIRE_PLUGIN_FIXTURES: "1"
      # The checks that start a daemon through the user's service manager stand down with a
      # printed reason where there is none, and the report would read that as a pass. Here a runner
      # without one fails them.
      KR_REQUIRE_SERVICE_MANAGER: "1"
      # The evidence directory: inside the platform's temporary directory, new for the run.
      KR_TEST_ARTIFACTS_DIR: /tmp/kr-conformance-evidence
    steps:
      - name: Free the disk the build needs
        timeout-minutes: 6
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        timeout-minutes: 5
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The companion application's backend links the system WebView and the window toolkit. The
      # curses headers are for the applications the matrix builds from their release's source.
      - name: Install the build dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libncurses-dev

      - name: Install the component target
        timeout-minutes: 3
        run: rustup target add wasm32-wasip2

      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          # The packages are installed only by a run of the TypeScript group; without them there is
          # no store to cache, and the action's last step fails on the missing path. The action
          # also caches the package manager the manifest names unless it is told not to.
          cache: ${{ (inputs.groups == '' || contains(inputs.groups, 'typescript')) && 'pnpm' || '' }}
          package-manager-cache: ${{ inputs.groups == '' || contains(inputs.groups, 'typescript') }}

      - name: Build the test components
        timeout-minutes: 5
        run: bash scripts/build-plugin-fixtures.sh

      # The release archives of the applications the matrix runs come from their projects' hosts,
      # and a host can answer every request for a few minutes with an error: on 8 November four of
      # the macOS job's seven archives answered 504 for a minute each, and its report ran without
      # them. The archives are kept in the Actions cache under the lock that pins them and the
      # script that names their files, so a night does not fetch what an earlier one did. The
      # fetch checks each archive it finds against its pin and fetches again what does not match,
      # and a cache step that fails or runs out of its time does not fail the job, so the cache
      # costs a fetch at worst. The cache is saved by the default branch's runs only, and only by
      # one that holds every archive, whether or not its report passed.
      - name: Restore the applications' archives
        id: applications
        if: ${{ inputs.groups == '' || contains(inputs.groups, 'applications') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/kalareach/conformance-applications/archives
          key: conformance-applications-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/conformance/applications.lock', 'scripts/run-conformance.sh') }}
          restore-keys: conformance-applications-${{ runner.os }}-${{ runner.arch }}-

      # Every group this platform runs, the applications fetched and built from the pins in
      # tests/conformance/applications.lock. The step fails when the run did. It took 152 to 207
      # minutes on the eleven nights of 30 October to 9 November (207 on 8 November), and the job
      # 155 to 210. The limits of the job's steps add up to 286 of its 300 minutes, the other steps'
      # each at least twice the longest its step took in those nights (the disk step, at 2.7
      # minutes, has 6). The report's 240 minutes are 33 over the slowest night, and 10 over it with
      # the fetch's worst case (22 and a half minutes, in scripts/run-conformance.sh) added. The
      # step gives the report the moment its limit ends it (KR_REPORT_DEADLINE, from
      # REPORT_MINUTES, which is the limit), so that a step run again is ended before the limit
      # ends the report with no result.
      - name: The conformance report
        timeout-minutes: 240
        env:
          REPORT_GROUPS: ${{ inputs.groups }}
          REPORT_MINUTES: 240
        run: |
          KR_REPORT_DEADLINE="$(( $(date +%s) + REPORT_MINUTES * 60 ))"
          export KR_REPORT_DEADLINE
          read -r -a names <<< "$REPORT_GROUPS"
          arguments=()
          for name in ${names[@]+"${names[@]}"}; do
            arguments+=(--group "$name")
          done
          bash scripts/run-conformance.sh ${arguments[@]+"${arguments[@]}"}

      # The archives are held when the index the fetch wrote reads, is for this lock, names every
      # program the lock pins, and names none of them as unavailable: an index that is empty, cut
      # short or missing a program is not one to save the archives under.
      - name: Check that every application's archive is held
        id: applications-held
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.applications.outputs.cache-hit != 'true' && (inputs.groups == '' || contains(inputs.groups, 'applications')) }}
        timeout-minutes: 1
        run: |
          index="$HOME/.cache/kalareach/conformance-applications/index.json"
          if python3 - "$index" tests/conformance/applications.lock <<'PYTHON'
          import hashlib
          import json
          import sys

          index = json.load(open(sys.argv[1]))
          lock = open(sys.argv[2], "rb").read()
          programs = sorted(
              application["id"]
              for application in json.loads(lock)["applications"]
              if application.get("role", "program") == "program"
          )
          named = sorted(application["id"] for application in index["applications"])
          unavailable = [a for a in index["applications"] if a["status"] == "unavailable"]
          held = (
              index["lock_sha256"] == hashlib.sha256(lock).hexdigest()
              and named == programs
              and not unavailable
          )
          sys.exit(0 if held else 1)
          PYTHON
          then
            echo "held=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the applications' archives
        if: ${{ !cancelled() && steps.applications-held.outputs.held == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/kalareach/conformance-applications/archives
          key: conformance-applications-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/conformance/applications.lock', 'scripts/run-conformance.sh') }}

      - name: Keep the result and the evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-linux
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: error

  macos:
    name: macos
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-15
    # The limits of the steps add up to less than this one, so a step that hangs is ended and the
    # steps after it still report. The job's own limit is under GitHub's six hours.
    timeout-minutes: 355
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      KR_REQUIRE_PLUGIN_FIXTURES: "1"
      KR_TEST_ARTIFACTS_DIR: /tmp/kr-conformance-evidence
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The disk as the image arrives and what takes the room on it, and from here to the last
      # report the lowest free space, sampled every two seconds. The report below is one step of
      # hours, so the free space through it is listed at ten-minute spacing against the log's times.
      - name: What the disk holds
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/disk-report.sh begin "the image as it arrives"

      # The runner image carries a simulator runtime for each Xcode platform and release, 113 GB of
      # disk images. The only group that drives a simulator is the phones group, whose iOS unit
      # tests run in an iPhone simulator, so the iOS runtimes stay, and the tvOS, watchOS and
      # visionOS runtimes, which nothing here uses, are removed. Freeing the disk is best effort
      # and the job goes on if it fails, with the free space of the reports around it to show what
      # was left.
      - name: Free the disk the build needs
        continue-on-error: true
        timeout-minutes: 8
        run: bash scripts/free-simulator-runtimes.sh --keep-ios

      - name: What the disk holds with the runtimes cleared
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash scripts/disk-report.sh step "the simulator runtimes cleared"

      - name: What this runner is
        timeout-minutes: 2
        run: |
          sw_vers
          uname -srm
          echo "processors: $(sysctl -n hw.logicalcpu); memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          df -h /System/Volumes/Data
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      # The suites run Apple's own Git, as a Mac with Xcode has it, rather than Homebrew's, which is
      # first on this runner's PATH: the newest Xcode's Git goes first, as a script that runs it by
      # its own path, so it finds its helper directory where Xcode put it.
      - name: Put Apple's Git first
        timeout-minutes: 2
        run: |
          set -euo pipefail
          newest=""
          newest_version=""
          for developer in /Applications/Xcode_*.app/Contents/Developer; do
            application="${developer%/Contents/Developer}"
            if [ -L "$application" ] || [ ! -x "$developer/usr/bin/git" ]; then
              continue
            fi
            version="$("$developer/usr/bin/git" --version | awk '{ print $3 }')"
            later="$(printf '%s\n%s\n' "${newest_version:-0}" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
            if [ -z "$newest" ] || { [ "$later" = "$version" ] && [ "$version" != "$newest_version" ]; }; then
              newest="$developer/usr/bin/git"
              newest_version="$version"
            fi
          done
          if [ -z "$newest" ]; then
            echo "no Xcode on this runner has a Git in it" >&2
            exit 1
          fi
          directory="$RUNNER_TEMP/apple-git"
          mkdir -p "$directory"
          printf '%s\n' '#!/bin/sh' "exec \"$newest\" \"\$@\"" > "$directory/git"
          chmod +x "$directory/git"
          echo "$directory" >> "$GITHUB_PATH"
          "$directory/git" --version

      - name: Install the pinned toolchain
        timeout-minutes: 5
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Install the component target
        timeout-minutes: 3
        run: rustup target add wasm32-wasip2

      # The iOS unit tests of the phones group build the library that opens a sealed notification
      # preview for the simulator, in a build phase of the test scheme that runs cargo for this
      # target. The runner's toolchain has its own architecture only, and without this target
      # that phase fails and no test of the scheme runs.
      - name: Install the iOS simulator target
        if: ${{ inputs.groups == '' || contains(inputs.groups, 'phones') }}
        timeout-minutes: 3
        run: rustup target add aarch64-apple-ios-sim

      # The worker's pseudo-terminal suite drives each shell section 3 names; the runner has Bash
      # and Zsh.
      - name: Install Fish
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install fish
          fish --version

      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          # The packages are installed only by a run of the TypeScript group; without them there is
          # no store to cache, and the action's last step fails on the missing path. The action
          # also caches the package manager the manifest names unless it is told not to.
          cache: ${{ (inputs.groups == '' || contains(inputs.groups, 'typescript')) && 'pnpm' || '' }}
          package-manager-cache: ${{ inputs.groups == '' || contains(inputs.groups, 'typescript') }}

      - name: Build the test components
        timeout-minutes: 5
        run: bash scripts/build-plugin-fixtures.sh

      # The applications' release archives, kept under the lock that pins them and the script that
      # names their files, as the Linux job above has them: a host that answers 504 for a few
      # minutes does not take the matrix's applications from a night that holds their archives.
      - name: Restore the applications' archives
        id: applications
        if: ${{ inputs.groups == '' || contains(inputs.groups, 'applications') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/kalareach/conformance-applications/archives
          key: conformance-applications-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/conformance/applications.lock', 'scripts/run-conformance.sh') }}
          restore-keys: conformance-applications-${{ runner.os }}-${{ runner.arch }}-

      # The step runs every group of the platform one after the other, and it grows with the
      # suites. It took 207 to 240 minutes on the eleven nights of 30 October to 9 November, and it
      # ran into its former limit of 240 minutes on 3, 8 and 9 November. Taking the steps a night
      # did not reach at the pace of the steps it did, those nights needed about 246, 262 and 244
      # minutes: 8 November's runner ran 14 percent slower than 7 November's, and the outage of that
      # night's downloads added 3 minutes more. The limit is what the job's limit leaves once the
      # other steps have theirs, less 3 minutes for the set-up and clean-up that no step limit
      # counts. Those steps' limits add up to 65 minutes, each at least twice the longest its step
      # took in the eleven nights (the disk step, at 3.8 minutes, has 8; the closing report, which
      # also reads the kernel's log for failed writes to the volume, has 4), so the limits of the
      # job's steps add up to 352 of its 355 minutes, under GitHub's six hours. The report's 287
      # minutes are 22 over 8 November's need with its outage, 25 over it without, and 3 over it
      # with the fetch's worst case (22 and a half minutes, in scripts/run-conformance.sh) in place
      # of the outage. The step gives the report the moment its limit ends it
      # (KR_REPORT_DEADLINE, from REPORT_MINUTES, which is the limit), so that a step run again is
      # ended before the limit ends the report with no result.
      - name: The conformance report
        timeout-minutes: 287
        env:
          REPORT_GROUPS: ${{ inputs.groups }}
          REPORT_MINUTES: 287
        run: |
          KR_REPORT_DEADLINE="$(( $(date +%s) + REPORT_MINUTES * 60 ))"
          export KR_REPORT_DEADLINE
          read -r -a names <<< "$REPORT_GROUPS"
          arguments=()
          for name in ${names[@]+"${names[@]}"}; do
            arguments+=(--group "$name")
          done
          bash scripts/run-conformance.sh ${arguments[@]+"${arguments[@]}"}

      # The archives are held when the index the fetch wrote reads, is for this lock, names every
      # program the lock pins, and names none of them as unavailable: an index that is empty, cut
      # short or missing a program is not one to save the archives under.
      - name: Check that every application's archive is held
        id: applications-held
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.applications.outputs.cache-hit != 'true' && (inputs.groups == '' || contains(inputs.groups, 'applications')) }}
        timeout-minutes: 1
        run: |
          index="$HOME/Library/Caches/kalareach/conformance-applications/index.json"
          if python3 - "$index" tests/conformance/applications.lock <<'PYTHON'
          import hashlib
          import json
          import sys

          index = json.load(open(sys.argv[1]))
          lock = open(sys.argv[2], "rb").read()
          programs = sorted(
              application["id"]
              for application in json.loads(lock)["applications"]
              if application.get("role", "program") == "program"
          )
          named = sorted(application["id"] for application in index["applications"])
          unavailable = [a for a in index["applications"] if a["status"] == "unavailable"]
          held = (
              index["lock_sha256"] == hashlib.sha256(lock).hexdigest()
              and named == programs
              and not unavailable
          )
          sys.exit(0 if held else 1)
          PYTHON
          then
            echo "held=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the applications' archives
        if: ${{ !cancelled() && steps.applications-held.outputs.held == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/kalareach/conformance-applications/archives
          key: conformance-applications-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/conformance/applications.lock', 'scripts/run-conformance.sh') }}

      - name: What the disk has left
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        run: bash scripts/disk-report.sh end "what the disk has left"

      - name: Keep the result and the evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-macos
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: error

  windows:
    name: windows part ${{ matrix.part }} of 2
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-2025
    # The platform's plan is run in two parts, one in each job of the matrix: it took 252 minutes
    # on 11 and 12 November, with the suites that start a daemon or a worker running ten times
    # longer than on 10 November, and it ran into its limit on 13 November. Each part holds the
    # build steps that open the plan and half of the suites, which took 128 and 123 minutes in the
    # run of 12 November, under three quarters of the report's limit even at the slowest pace of
    # that run. A part that fails does not stop the other.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    # Every step has a limit of its own, and the limits add up to less than this one, so a step
    # that hangs is ended and the steps after it still report. The job's own limit is under
    # GitHub's six hours.
    timeout-minutes: 355
    env:
      # No debug information, as the Linux and macOS jobs above and the landing workflow's Windows
      # jobs have it: nothing here reads it, and the report builds every suite's test programs in
      # turn into one directory, with no build cache, on the drive the workspace is on. With debug
      # information that directory filled the drive in the last two steps of the run of 5 November
      # ("There is not enough space on the disk", then the linker's "limit exceeded for program
      # database"), and both steps failed with "the step's tests did not build".
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # The plugin runtime's tests run real components, which the steps below build; a component
      # that is not there is a failure here rather than a skip.
      KR_REQUIRE_PLUGIN_FIXTURES: "1"
      # The one case that writes this runner's credential store, which is the runner's own and
      # holds nobody's credentials; what it writes is named for the run and taken away again.
      KR_TEST_PLATFORM_SECRET_STORE: "1"
    steps:
      - name: Check out
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The drives as the job starts and, in the step after the report, as it ends. The hosted
      # Windows runner's figures for the workspace drive are not documented, and the run that filled
      # it printed none: this is how much room the build starts with and how much the job takes.
      # The free space at the end is the most the drive's lowest point can have been, since the
      # build writes object files before it archives them and a failed build removes what it wrote.
      - name: What the drives hold
        timeout-minutes: 2
        continue-on-error: true
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Free } | ForEach-Object {
            '{0}: {1:N1} GiB used, {2:N1} GiB free of {3:N1} GiB' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB)
          }

      - name: Install the pinned toolchain
        timeout-minutes: 5
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The report reads the TypeScript tests with the packages' own compiler here too, to list them
      # as not run on this platform.
      - name: Install pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      # The evidence directory is inside the user's temporary directory, by its long name.
      - name: Name the evidence directory
        timeout-minutes: 2
        run: |
          $temporary = (Get-Item $env:TEMP).FullName
          "KR_TEST_ARTIFACTS_DIR=$temporary\kr-conformance-evidence" >> $env:GITHUB_ENV

      # libsodium's prebuilt libraries come from the files this places, not from a download in the
      # middle of the compile. It comes after the steps the report needs whatever happens, so that
      # a failure here leaves them in place, and before the steps that can fail the build of the
      # test components, so that the report, which runs after such a failure, still finds the
      # files and does not download them in its compile.
      - name: Place libsodium's archives
        timeout-minutes: 15
        uses: ./.github/actions/libsodium-archive

      # Just before the report, so that a step that fails here is followed by the report and not by
      # a job that stopped before it.
      - name: Install the component target
        timeout-minutes: 5
        run: rustup target add wasm32-wasip2

      - name: Build the test components
        timeout-minutes: 15
        shell: bash
        run: bash scripts/build-plugin-fixtures.sh

      # The suites qualified on Windows, as the landing workflow's Windows job runs them, started
      # from PowerShell as they are there: a POSIX shell's runtime would enable privileges in their
      # token and change how the console's interrupt reaches them. The other groups and the
      # applications are recorded as not run here, each with its reason. The report runs whatever
      # has come before, so that a component that could not be built is reported by the test that
      # needs it, by name, and not by a job that stopped before the report.
      #
      # The step builds and runs the suites of its part in turn, with no build cache, and it grows
      # with the suites. The whole plan took 102 to 143 minutes with 76 to 81 steps (16 to 25
      # October), 185 minutes with 91 (29 October), 191 with 92 (3 November), and 252 minutes with 96
      # on 11 and 12 November. The limit is what this job's limit leaves once the other steps have
      # theirs, less 3 minutes for the set-up and clean-up that no step limit counts: the limits of
      # the job's steps add up to 352 of its 355 minutes. A part takes about half of the plan and
      # the two builds that open it: 128 and 123 minutes in the run of 12 November, so the limit
      # is more than twice what a part needs and a part keeps more than a quarter of it. The step
      # gives the report the moment its limit ends it (KR_REPORT_DEADLINE, from REPORT_MINUTES,
      # which is the limit), so that a step run again is ended before the limit ends the report with
      # no result.
      - name: The conformance report
        if: ${{ !cancelled() }}
        timeout-minutes: 281
        env:
          REPORT_GROUPS: ${{ inputs.groups }}
          REPORT_PART: ${{ matrix.part }}
          REPORT_MINUTES: 281
        run: |
          $env:KR_REPORT_DEADLINE = [string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + [long]$env:REPORT_MINUTES * 60)
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arguments = @()
          foreach ($name in ($env:REPORT_GROUPS -split '\s+' | Where-Object { $_ })) {
            $arguments += '--group'
            $arguments += $name
          }
          cargo run --locked -p kr-conformance --bin kr-conformance -- run --root $PWD.Path --evidence $env:KR_TEST_ARTIFACTS_DIR --part "$env:REPORT_PART/2" @arguments

      # The drives as the report left them; the change in used space since the first reading is what
      # the job took.
      - name: What the drives hold at the end
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Free } | ForEach-Object {
            '{0}: {1:N1} GiB used, {2:N1} GiB free of {3:N1} GiB' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB)
          }

      - name: Keep the result and the evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-windows-part-${{ matrix.part }}
          path: ${{ env.KR_TEST_ARTIFACTS_DIR }}
          if-no-files-found: error
