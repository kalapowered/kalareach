name: switch-probe

# Runs the store's tests on hosted Windows, then one mutation of the in-place switch. It starts on
# a push to this one branch whose newest commit message ends in "(run)", and nowhere else. It holds
# no secret, no environment and no deployment step, and only reads the repository.
on:
  push:
    branches: ["scratch/T-INSTALL-SWITCH-WIN-1-probe"]

permissions:
  contents: read

concurrency:
  group: switch-probe
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  KR_TEST_ARTIFACTS_DIR: C:\kr-test-artifacts

jobs:
  probe:
    name: install-and-mutation
    if: ${{ endsWith(github.event.head_commit.message, '(run)') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Restore the cargo cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: windows

      - name: Place libsodium's archives
        id: libsodium
        uses: ./.github/actions/libsodium-archive

      - name: Build the store's tests
        run: cargo test --locked -p kr-ipc --test install --no-run

      - name: Run the store's tests, as the landing workflow does
        run: cargo test --locked -p kr-ipc --test install -- --skip probe_current_during_a_switch

      - name: Run the mutation
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/mutants/run-mutants.sh M11
