name: release-tree

# Builds the release tree of each macOS and Linux target, with everything about it that can be proved
# without the release's own keys.
#
# The `tree` job builds the host's programs and the shell packages natively on the platform they are
# for, holds each Mach-O or ELF file to the baseline its target runs on, assembles the tree
# (`scripts/build-release.sh`: `bin/`, `shells/`, `share/` and the manifest), refuses a key anywhere in
# it, seals it with keys and a channel root that this run made (`scripts/seal-release-tree.sh`), and
# then does with the archive what a host does: checks it (`scripts/check-release-archive.py`),
# unpacks it, verifies its signature and every file against the manifest, installs it into a store of
# its own, and starts the Zsh package from the unpacked tree. On macOS it also installs, upgrades and
# removes the Homebrew cask for it, and a `formula` job does the same with the formula on the Linux
# targets. No environment and no secret is read. What the run seals is not a release, because no host
# trusts a root it made: the archive it keeps says so in its name.
#
# On macOS the tree is signed ad hoc before its manifest is written, since a signature changes the
# bytes a manifest covers, and each file is held to it. The plugin host, which runs Wasmtime, is
# signed with the hardened runtime and the one entitlement a Developer ID release gives it. The
# "Show what the plugin host's entitlement is for" step shows, on a macOS target whose machine
# enforces the hardened runtime, that a program that makes code at run time is ended without the
# entitlement and runs with it. A hosted runner that is a virtual machine may not enforce it: the step
# before finds out, and the step is then skipped with a warning, since it would show nothing. An ad hoc
# signature has no team, so the other programs carry no hardened runtime, which a Developer ID
# signature does.
#
# Each run keeps the tree of each target as it was before this run's signature was put on it, for
# three days. A release is made from those trees by the steps that follow, none of which is in this
# workflow: the two macOS trees are signed with the Developer ID and notarised on the machine that
# holds the key (`scripts/sign-macos-release.sh`), and `release-host.yml` seals all four with the
# update channel's release keys and publishes them. `docs/releases/manifest.md` says what each step
# produces.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tree-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Each build starts from nothing, so incremental artefacts would only take disk.
  CARGO_INCREMENTAL: "0"
  # The release's macOS floor, which the shells are built to as well. Nothing reads it elsewhere.
  MACOSX_DEPLOYMENT_TARGET: "14.0"

defaults:
  run:
    shell: bash

jobs:
  # Settles which commit this run is about, once: the commit the run was started on. Every job after
  # it checks that commit out by its identifier and not by the ref, so a branch that moves while the
  # trees build cannot change what is built. A release is made only from the trees of a run started on
  # `main`, and no input can make a run build another commit than the one it records.
  source:
    name: the commit of this run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.settle.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Settle which commit this run is about
        id: settle
        run: |
          commit="$(git rev-parse HEAD)"
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::this run does not resolve to one commit: [$commit]"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "This run builds and signs commit \`$commit\`." >> "$GITHUB_STEP_SUMMARY"
          echo "commit $commit"

  tree:
    name: the tree of ${{ matrix.target }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      # One target's failure says nothing about another's, and each is worth seeing.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            floor: glibc=2.35
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            floor: glibc=2.35
          - target: aarch64-apple-darwin
            runner: macos-15
            floor: macos=14.0
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            floor: macos=14.0
    env:
      TARGET: ${{ matrix.target }}
      FLOOR: ${{ matrix.floor }}
      SETTLED: ${{ needs.source.outputs.commit }}
    steps:
      # The whole history: a release's place among releases is the number of commits behind it.
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0

      # What this release is: its version, its commit, and its place among releases.
      - name: What this release is
        run: |
          commit="$(git rev-parse HEAD)"
          if [ "$commit" != "$SETTLED" ]; then
            echo "::error::this job checked out $commit and the run settled $SETTLED"
            exit 1
          fi
          short="${commit:0:12}"
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kr-cli"))')"
          release="$version+$short"
          {
            echo "COMMIT=$commit"
            echo "RELEASE=$release"
            echo "SEQUENCE=$(git rev-list --count HEAD)"
            echo "TOP=kalareach-$TARGET-$release"
          } >> "$GITHUB_ENV"
          echo "release $release at $commit for $TARGET"

      # Each of these checks is put through what it must refuse before it is trusted with the tree.
      - name: Test the checks this run makes
        run: |
          python3 scripts/release-programs.py self-test
          python3 scripts/check-release-floors.py self-test
          python3 scripts/check-release-secrets.py self-test
          python3 scripts/check-release-archive.py self-test
          python3 scripts/package-managers.py self-test
          bash scripts/publish-host-release.sh self-test
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/check-macos-signatures.sh self-test
          fi

      - name: Name the executables
        run: |
          builds=$(python3 scripts/release-programs.py builds --target "$TARGET")
          echo "EXECUTABLES=${builds//$'\n'/ }" >> "$GITHUB_ENV"

      - name: What this runner is
        run: |
          uname -a
          case "$RUNNER_OS" in
            macOS) sw_vers ;;
            Linux) cat /etc/os-release ;;
          esac

      # Some runner images carry no Rust at all. The installer is rustup's own, and it installs no
      # toolchain: the next step installs the one this repository pins.
      - name: Install rustup where the image has none
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      # What the shells need to configure and build from their own release tarballs: the fish package
      # is a Rust shell built through CMake, whose build turns the message catalogues with gettext.
      - name: Install the shells' build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes libncurses-dev cmake gettext
          else
            command -v cmake >/dev/null 2>&1 || brew install cmake
            if ! command -v msgfmt >/dev/null 2>&1; then
              brew install gettext
              echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
            fi
          fi

      # Each executable is built by a command of its own, as the release-baselines run builds them,
      # so each one's dependencies are resolved exactly as they are for the release.
      - name: Build the host executables
        run: |
          for executable in $EXECUTABLES; do
            cargo build --locked --release --target "$TARGET" -p "${executable%/*}" --bin "${executable#*/}"
          done

      - name: Build the release tool
        run: cargo build --locked --release -p kr-release

      - name: Find out whether this machine enforces the hardened runtime
        id: enforce
        if: runner.os == 'macOS'
        run: |
          if bash scripts/check-plugin-host-entitlement.sh --probe; then
            echo "enforced=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 10 ] || exit "$status"
            echo "enforced=false" >> "$GITHUB_OUTPUT"
            echo "The hardened runtime is not enforced on this runner, so the plugin host's entitlement is not shown here." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The plugin host runs Wasmtime, which writes machine code into memory and makes it
      # executable, and the hardened runtime ends a process that does so unless it holds
      # `com.apple.security.cs.allow-unsigned-executable-memory`. The test executable that compiles
      # and calls a component's exports is signed three ways on this target's own processor: without the
      # runtime it succeeds, with the runtime and no entitlement it is ended, and with the runtime
      # and the plugin host's one entitlement it succeeds. The plugin host's own `service` suite is
      # then run against the plugin host signed the same three ways.
      - name: Show what the plugin host's entitlement is for
        if: runner.os == 'macOS' && steps.enforce.outputs.enforced == 'true'
        run: |
          rustup target add wasm32-wasip2
          bash scripts/build-plugin-fixtures.sh
          executable="$(cargo test --locked -p kr-plugin-runtime --test execution --no-run --message-format=json \
            | python3 -c 'import json, sys; print(next(m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == "execution"))')"
          KR_REQUIRE_PLUGIN_FIXTURES=1 bash scripts/check-plugin-host-entitlement.sh "$executable" \
            kr_req_11_01_a_vendor_component_adds_detection_events_and_controls --exact
          # The same three ways for the plugin host itself: the `service` suite starts the plugin host
          # program as its own process and has a component run in it, so it is that program that is
          # signed, in place, for each run.
          service="$(cargo test --locked -p kr-plugin-host --test service --no-run --message-format=json \
            | python3 -c 'import json, sys; print(next(m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == "service"))')"
          KR_REQUIRE_PLUGIN_FIXTURES=1 bash scripts/check-plugin-host-entitlement.sh --host target/debug/kr-plugin-host "$service" \
            kr_req_11_39_a_terminal_drains_and_is_answered_while_a_component_runs --exact

      # What the shells are built from is pinned: the upstream sources are placed by digest, and the
      # fish package then builds offline, with proxy variables that point at a port nothing listens
      # on so that a client which obeys them and still tries a server fails here at once.
      - name: Place the upstream sources
        run: |
          echo "KR_SHELL_PREFIX=$RUNNER_TEMP/shells" >> "$GITHUB_ENV"
          KR_SHELL_PREFIX="$RUNNER_TEMP/shells" bash scripts/place-shell-sources.sh --all

      - name: Build the shell packages
        run: bash scripts/build-shells.sh --zsh --bash --no-upstream-tests

      - name: Build the fish package
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          # Some clients read only the lower-case names, and a workflow's names are not case-sensitive.
          export https_proxy="$HTTPS_PROXY" http_proxy="$HTTP_PROXY" all_proxy="$ALL_PROXY"
          bash scripts/build-shells.sh --fish --no-upstream-tests

      # What the tool says a shell package is made of is held to the packages built above: an
      # ordinary test run has none, so these cases run here.
      - name: Test the release tool against the packages built here
        run: cargo test --locked -p kr-release --test release_tree -- --include-ignored

      # No tree is assembled from a shell package that has not passed its requalification here, on
      # the bytes this job built. These are the suites that need only the packages this tree
      # carries: the contract suites of Zsh, Bash and Fish, the Fish source checks, Zsh's
      # native-module proof, and the case that compares each package with the pin the register
      # names. The whole corpus, with the startup customisations that are pinned for two of the four
      # targets, the second Zsh build and the PowerShell package that no release tree carries, runs
      # in core-ci's shell-packages job. KR_SHELL_PREFIX names the packages built above.
      - name: Requalify the shell packages built here
        run: |
          cargo test --locked -p kr-shell-integration \
            --test zsh --test bash --test fish --test fish_sources --test module_abi \
            -- --test-threads=1 --include-ignored
          # A filter that matches no case runs none and passes, so the case has to be there to run.
          # The list is read whole before it is searched, because a search that stops at its first
          # match closes the pipe on a writer that is still listing.
          cases="$(cargo test --locked -p kr-shell-integration --test qualification -- --list --include-ignored)"
          grep -qx 'the_packages_built_here_were_built_from_the_registers_pins: test' <<<"$cases"
          cargo test --locked -p kr-shell-integration --test qualification \
            -- the_packages_built_here_were_built_from_the_registers_pins --include-ignored

      # Every Mach-O or ELF file the release carries is held to the baseline its target runs on:
      # the host's programs, the shells' programs and the modules a shell loads, found by what a
      # file is and not by its name, since a loadable builtin has no extension.
      - name: Read each floor back
        run: |
          files=()
          for executable in $EXECUTABLES; do
            files+=("target/$TARGET/release/${executable#*/}")
          done
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q -E 'Mach-O|ELF'; then
              files+=("$file")
            fi
          done < <(find "$RUNNER_TEMP/shells" -type f -print0)
          {
            echo "### $TARGET: ${#files[@]} files"
            echo '```'
            python3 scripts/check-release-floors.py check --target "$TARGET" "${files[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The plugins repository at the commit the bundled catalogue was taken from, to read the
      # records the release cites from it.
      - name: Name the plugins commit the bundled catalogue was taken from
        id: plugins
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("bundled-plugins.lock"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the plugins repository at that commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kalapowered/kalareach-plugins
          ref: ${{ steps.plugins.outputs.commit }}
          path: plugins-source

      # The channel's root and the keys that sign for it are this run's own: the keys stay outside
      # the tree and the root goes in it, and no host trusts either.
      - name: Make this run's keys and channel root
        run: target/release/kr-release dev-keys --out "$RUNNER_TEMP/keys"

      - name: Assemble the tree
        run: |
          identity=()
          if [ "$RUNNER_OS" = macOS ]; then
            identity=(--macos-identity -)
          fi
          bash scripts/build-release.sh \
            --target "$TARGET" --release "$RELEASE" --sequence "$SEQUENCE" --commit "$COMMIT" --floor "$FLOOR" \
            --programs "target/$TARGET/release" --shells "$RUNNER_TEMP/shells" \
            --root "$RUNNER_TEMP/keys/root.json" --out "$RUNNER_TEMP/tree/$TOP" \
            --kr-release target/release/kr-release --plugins plugins-source "${identity[@]}"

      - name: Hold each Mach-O file to its signature
        if: runner.os == 'macOS'
        run: bash scripts/check-macos-signatures.sh "$RUNNER_TEMP/tree/$TOP" ad-hoc

      - name: Refuse a private key in the tree
        run: python3 scripts/check-release-secrets.py scan "$RUNNER_TEMP/tree/$TOP"

      # The tree as it is before this run's manifest is signed: what a release is made from. The
      # macOS trees are signed with the Developer ID and notarised on the machine that holds the
      # key, and all four are sealed with the update channel's release keys, by steps outside this
      # workflow that check the digest recorded here.
      - name: Keep the tree for a release
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned"
          COPYFILE_DISABLE=1 tar --no-xattrs -C "$RUNNER_TEMP/tree" -cf "$RUNNER_TEMP/unsigned/$TOP.tar" "$TOP"
          (cd "$RUNNER_TEMP/unsigned" && { sha256sum "$TOP.tar" 2>/dev/null || shasum -a 256 "$TOP.tar"; } > "$TOP.tar.sha256")
          {
            echo "### The tree of $TARGET before it is sealed"
            echo '```'
            cat "$RUNNER_TEMP/unsigned/$TOP.tar.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The manifest signed with this run's keys, the archive packed and checked as a host stages one.
      - name: Seal the tree with this run's keys, and pack the archive
        run: |
          bash scripts/seal-release-tree.sh --tree "$RUNNER_TEMP/tree/$TOP" --checkout . --plugins plugins-source \
            --kr-release target/release/kr-release --root "$RUNNER_TEMP/keys/root.json" \
            --key "$RUNNER_TEMP/keys/targets-1.pk8" --key "$RUNNER_TEMP/keys/targets-2.pk8" \
            --out "$RUNNER_TEMP/archive"
          cat "$RUNNER_TEMP/archive/SHA256SUMS"

      # What a host does with it: unpack, verify the signature and every file, install it into a store
      # of its own, and start the Zsh package from the unpacked tree and from the store, which is a
      # package moved from where it was built.
      - name: Unpack, verify, install and start it
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$RUNNER_TEMP/archive/$TOP.tar.gz"
          unpacked="$RUNNER_TEMP/unpacked/$TOP"
          target/release/kr-release verify --tree "$unpacked" --root "$RUNNER_TEMP/keys/root.json"
          store="$RUNNER_TEMP/store"
          "$unpacked/bin/kr" host install --store "$store"
          "$store/current/bin/kr" --version
          for root in "$unpacked" "$store/versions/$RELEASE"; do
            identity="$(cat "$root/shells/zsh/current")"
            "$root/shells/zsh/$identity/bin/zsh" -f -c 'zmodload zsh/zle && print -r -- "zle loaded from $module_path[1]"'
          done
          bash scripts/check-host-start.sh "$store/current/bin/kr"

      # The release after this one, made of the same programs, so that an upgrade has a release to
      # go to. It is sealed with this run's keys like the first, and is no more a release than it.
      - name: Make the release after this one
        run: |
          identity=()
          if [ "$RUNNER_OS" = macOS ]; then
            identity=(--macos-identity -)
          fi
          next="$(python3 -c 'import sys; v, c = sys.argv[1].split("+"); a, b, p = v.split("."); print(f"{a}.{b}.{int(p) + 1}+{c}")' "$RELEASE")"
          top="kalareach-$TARGET-$next"
          bash scripts/build-release.sh \
            --target "$TARGET" --release "$next" --sequence "$((SEQUENCE + 1))" --commit "$COMMIT" --floor "$FLOOR" \
            --programs "target/$TARGET/release" --shells "$RUNNER_TEMP/shells" \
            --root "$RUNNER_TEMP/keys/root.json" --out "$RUNNER_TEMP/next/$top" \
            --kr-release target/release/kr-release --plugins plugins-source "${identity[@]}"
          bash scripts/seal-release-tree.sh --tree "$RUNNER_TEMP/next/$top" --checkout . --plugins plugins-source \
            --kr-release target/release/kr-release --root "$RUNNER_TEMP/keys/root.json" \
            --key "$RUNNER_TEMP/keys/targets-1.pk8" --key "$RUNNER_TEMP/keys/targets-2.pk8" \
            --out "$RUNNER_TEMP/next-archive"
          echo "NEXT_ARCHIVE=$RUNNER_TEMP/next-archive/$top.tar.gz" >> "$GITHUB_ENV"

      # What a package manager does with the archive, with Homebrew itself: a cask on macOS, installed
      # from a tap of this run's own. The first command of the `kr` it links admits the release into a
      # store, an upgrade leaves the release before it there, and a removal leaves both. The Linux
      # formula is installed by the `formula` job below, on a runner whose C library Homebrew
      # accepts: the floor-checked runner of this job is older, and Homebrew then builds its own
      # toolchain to install anything.
      - name: Install, upgrade and remove it with Homebrew
        if: runner.os == 'macOS'
        run: |
          brew="$(command -v brew || true)"
          if [ -z "$brew" ]; then
            echo "::error::this runner has no Homebrew, and the cask is installed with it"
            exit 1
          fi
          bash scripts/check-homebrew-install.sh --brew "$brew" --kind cask \
            --first "$RUNNER_TEMP/archive/$TOP.tar.gz" --second "$NEXT_ARCHIVE"

      # The two releases the `formula` job installs and upgrades between, each as an artefact of its
      # own: one artefact of two paths would keep the directories they are in.
      - name: Keep the release for the formula
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formula-first-${{ matrix.target }}
          path: ${{ runner.temp }}/archive/${{ env.TOP }}.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Keep the release after it for the formula
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formula-second-${{ matrix.target }}
          path: ${{ env.NEXT_ARCHIVE }}
          retention-days: 1
          if-no-files-found: error

      - name: Keep the archive this run proved
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TOP }}-signed-with-this-runs-keys-not-a-release
          path: ${{ runner.temp }}/archive
          retention-days: 7
          if-no-files-found: error

      # What `scripts/sign-macos-release.sh` and `release-host.yml` take: the tree before it is
      # sealed, in a tar with the sum beside it. Every run keeps it, for three days.
      - name: Keep the tree a release is made from
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ env.TOP }}
          path: ${{ runner.temp }}/unsigned
          retention-days: 3
          if-no-files-found: error

  # `release-host.yml` seals all four trees on one Linux runner. This job does the same with the
  # trees this run built and a root and keys of its own, so that sealing a macOS tree anywhere but on
  # a Mac is shown here, in every run, and not for the first time in a release.
  seal-across:
    name: seal the four trees on one runner
    needs: [source, tree]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SETTLED: ${{ needs.source.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Take the four trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-kalareach-*
          path: ${{ runner.temp }}/unsigned

      - name: Install rustup where the image has none
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build the release tool
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p kr-release

      - name: Name the plugins commit the bundled catalogue was taken from
        id: plugins
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("bundled-plugins.lock"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the plugins repository at that commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kalapowered/kalareach-plugins
          ref: ${{ steps.plugins.outputs.commit }}
          path: plugins-source

      - name: Seal each tree with this run's keys, and verify what comes out
        run: |
          target/release/kr-release dev-keys --out "$RUNNER_TEMP/keys"
          count=0
          for tar in "$RUNNER_TEMP"/unsigned/*/kalareach-*.tar; do
            (cd "$(dirname "$tar")" && sha256sum -c "$(basename "$tar").sha256")
            name="$(basename "$tar" .tar)"
            mkdir -p "$RUNNER_TEMP/trees/$name"
            tar -xf "$tar" -C "$RUNNER_TEMP/trees/$name"
            bash scripts/seal-release-tree.sh --tree "$RUNNER_TEMP/trees/$name/$name" --checkout . --plugins plugins-source \
              --kr-release target/release/kr-release --root "$RUNNER_TEMP/keys/root.json" \
              --key "$RUNNER_TEMP/keys/targets-1.pk8" --key "$RUNNER_TEMP/keys/targets-2.pk8" \
              --out "$RUNNER_TEMP/sealed/$name"
            mkdir -p "$RUNNER_TEMP/unpacked/$name"
            tar -C "$RUNNER_TEMP/unpacked/$name" -xzf "$RUNNER_TEMP/sealed/$name/$name.tar.gz"
            target/release/kr-release verify --tree "$RUNNER_TEMP/unpacked/$name/$name" --root "$RUNNER_TEMP/keys/root.json"
            count=$((count + 1))
          done
          if [ "$count" -ne 4 ]; then
            echo "::error::this run holds $count trees, and a release is made of four"
            exit 1
          fi

  # A Homebrew formula installed with Homebrew itself: the release the tree job built for x86_64
  # Linux, then the one after it, then the removal. It runs where Homebrew is: the hosted Arm Linux
  # image carries none, so the formula for Arm Linux is rendered by the same code from the same
  # archives and is installed by no run here. No environment and no secret.
  formula:
    name: the formula on x86_64-unknown-linux-gnu
    needs: [source, tree]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Take the release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula-first-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/first

      - name: Take the release after it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula-second-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/second

      - name: Install, upgrade and remove it with Homebrew
        run: |
          brew="$(command -v brew || true)"
          if [ -z "$brew" ] && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            brew=/home/linuxbrew/.linuxbrew/bin/brew
          fi
          if [ -z "$brew" ]; then
            echo "::error::this runner has no Homebrew, and the formula is installed with it"
            exit 1
          fi
          first=("$RUNNER_TEMP"/first/kalareach-*.tar.gz)
          second=("$RUNNER_TEMP"/second/kalareach-*.tar.gz)
          if [ "${#first[@]}" -ne 1 ] || [ ! -f "${first[0]}" ] || [ "${#second[@]}" -ne 1 ] || [ ! -f "${second[0]}" ]; then
            echo "::error::the formula job needs one archive of each release"
            exit 1
          fi
          bash scripts/check-homebrew-install.sh --brew "$brew" --kind formula \
            --first "${first[0]}" --second "${second[0]}"
