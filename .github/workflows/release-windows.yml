name: release-windows

# Builds the Windows host release of each Windows target, with everything about it that can be
# proved without the release's own keys, and then signs each tree for release behind the
# `release-signing` environment and publishes the two archives.
#
# The `build` job builds the host's programs natively on the runner each target is for (x64 on
# `windows-2025`, Arm on `windows-11-arm`), assembles the release tree (`scripts/build-release.sh`:
# `bin/`, `shells/psreadline/`, `share/` and the manifest), refuses a key anywhere in it, signs the
# manifest with keys and a channel root that this run made, packs it and holds the archive to what a
# host stages. No environment and no secret is read, and the job is given no token to ask for one.
# What it signs is not a release, because no host trusts a root it made: the archive it keeps says so
# in its name. A Windows host keeps no store of releases, so the install into a store that the macOS
# and Linux jobs make has no counterpart here.
#
# The `release` job is the release. It runs for a release tag and for the default branch, and a run
# on any other ref shows it skipped, so a run that proves the trees never reaches the environment.
# It takes the trees the `build` job made, signs the files that carry a signature, holds each of them
# to what a release requires, and then writes each manifest again, since signing changed the files,
# and signs it with the channel's release keys. Those keys do not exist yet, so the job stops there
# with a named refusal until they do.
#
# The signing key is an Azure Artifact Signing key. It stays inside the service, in hardware, and
# what comes back over the wire is a signature: no copy of it exists in this repository, on a
# runner, or on anyone's machine. Nor is there a stored credential to reach it with. The runner
# proves who it is with a token GitHub mints for one environment of one repository, and Microsoft
# Entra will exchange that token and nothing else, so there is no client secret and no certificate
# credential anywhere below. The three identifiers the login needs are repository variables, and all
# three are public. Short-lived tokens do exist on the runner while the job runs, which is what the
# environment's reviewer and the narrow role assignment are for.
#
# `docs/releases/windows-signing.md` is the whole of the procedure: what the operator set up once,
# how a release is signed, how to read a refusal, and how the profile is rotated.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to build and sign. Defaults to the ref this run was started from.
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'host/v*'

# Everything reads. `id-token: write` is what lets a runner ask GitHub for the token Entra
# exchanges, and only the job that signs is given it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The name the certificate profile issues under. Every signature is held to it, because a trusted
  # signature somebody else made is not this project's signature.
  KR_SIGNING_SUBJECT: 'CN=Kala Holdings Inc., O=Kala Holdings Inc., L=Newark, S=Delaware, C=US'

defaults:
  run:
    shell: pwsh

jobs:
  # A gate that passes everything looks exactly like a gate that works, so the gate is put through
  # artefacts made to fail before it is trusted with real ones. This runs first and the release job
  # waits on it: a gate that has stopped refusing stops the release rather than waving it through.
  #
  # It signs its fixtures with a throwaway certificate of its own, which is why this job is
  # separate: it holds `contents: read` and nothing else, so it cannot ask for the token that
  # reaches the signing service, and the fixture signer and the release identity are never on the
  # same runner.
  #
  # It also settles which commit this run is about, and writes it into the run's summary. The
  # release job checks out that commit by its identifier rather than resolving the ref a second
  # time, so a branch that moves while the run waits for approval cannot change what gets signed,
  # and the person approving can see what they are approving.
  gate:
    name: the gate refuses what it must
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Settle which commit this run signs
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw "This run does not resolve to one commit: [$commit]"
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "This run builds and signs commit ``$commit``." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "commit $commit"

      - name: Drive the gate with artefacts made to fail
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\check-windows-signature-gate.ps1"
          exit $LASTEXITCODE

      # The check the release job holds its sums and signature record to is put through records
      # made to fail in the same way: a carriage return that GNU sha256sum would pass is among them.
      - name: Drive the sums check with records made to fail
        shell: bash
        run: bash scripts/check-release-sums.sh self-test

      # What a host does with an archive, and what packs one, are put through inputs made to fail:
      # the check that holds an archive to its manifest, the packer, the scan for a key and the
      # step that sets apart the files to be signed.
      - name: Drive the archive, packing and signing-set checks with inputs made to fail
        shell: bash
        run: |
          python scripts/check-release-archive.py self-test
          python scripts/pack-release-zip.py self-test
          python scripts/check-release-secrets.py self-test
          python scripts/stage-windows-signing.py self-test

  build:
    name: build the tree of ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # One target's failure says nothing about another's, and each is worth seeing.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    outputs:
      release: ${{ steps.release.outputs.release }}
    env:
      TARGET: ${{ matrix.target }}
      # What this job does not set is RUSTFLAGS. The link needs arguments about the vendored C
      # library: leave the static C runtime out, and stop the linker naming the library's missing
      # debug database once per object file. `.cargo/config.toml` carries them so that every Windows
      # build gets them, and RUSTFLAGS in the environment replaces that file's flags rather than
      # adding to them. LNK4098, which reports objects asking for two different C runtimes, is
      # deliberately not silenced: the step after the builds refuses it.
      CARGO_INCREMENTAL: "0"
    steps:
      # By identifier, not by ref: the commit the gate job settled, whatever has happened to the
      # branch since. The whole history, since a release's place among releases is the number of
      # commits behind it.
      - name: Check out the commit the gate settled
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0

      # Some runner images carry no Rust at all. The installer is rustup's own, and it installs no
      # toolchain: the next step installs the one this repository pins.
      - name: Install rustup where the image has none
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$architecture-pc-windows-msvc/rustup-init.exe" -OutFile $installer
            & $installer -y --no-modify-path --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')
          }

      # Every executable this target carries, as the package that builds it and its name, read from
      # `scripts/release-programs.json`: the one list the release builds, the tree assembly and the
      # host's own check of a release read. Whatever builds, stages, starts or looks for an
      # executable further down takes it from here, so none of them keeps a list of its own. The
      # reader is put through what each target needs before it is trusted with this one.
      - name: Name the executables
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/release-programs.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'The reader of the program list failed its own test.' }
          $builds = @(python scripts/release-programs.py builds --target $env:TARGET)
          if ($LASTEXITCODE -ne 0 -or $builds.Count -eq 0) {
            throw 'The program list names no executable for this release.'
          }
          "KR_BUILDS=$($builds -join ' ')" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "executables: $($builds -join ', ')"

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # libsodium's prebuilt libraries come from files this places, not from a download in the
      # middle of the compile. The crate's build script checks both archives against libsodium's
      # public key, as it does for a download. What this builds is signed later, so it restores no
      # cache that another job could have written: the prebuilt archive and its signature come from
      # libsodium's host.
      - name: Place libsodium's archives
        uses: ./.github/actions/libsodium-archive
        with:
          restore: 'false'

      # What this release is, settled before anything is built, and on a tag held to the tag. A host
      # tag is `host/v<version>+<first twelve characters of the commit>`, so it names both the
      # version the archive carries and the commit it came from; a tag that names either of them
      # wrongly stops the run here rather than producing an archive nobody can place.
      #
      # This is also where the executables this release carries are held to the workspace. The
      # program list names them, and the workspace is asked what binaries the crates that build them
      # declare: a binary added to one of those crates fails this step by name until it is in the
      # list, rather than being left out of the release quietly. Two binaries those crates declare
      # are not part of a release and are named here as such: the stub the description tests start
      # in place of the model, and the benchmark that measures the model against real weights.
      - name: What this release is
        id: release
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne '${{ needs.gate.outputs.commit }}') {
            throw "This job checked out $commit and the gate settled ${{ needs.gate.outputs.commit }}."
          }
          $metadata = (cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json)
          $version = ($metadata.packages | Where-Object { $_.name -eq 'kr-cli' }).version
          if (-not $version) {
            throw 'The workspace does not report a version for kr-cli.'
          }
          $short = $commit.Substring(0, 12)

          $builds = @($env:KR_BUILDS -split ' ' | Where-Object { $_ })
          $crates = @($builds | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
          $notShipped = @('kr-stub-inference', 'kr-describe-bench')
          $declared = @(
            $metadata.packages |
              Where-Object { $_.name -in $crates } |
              ForEach-Object { $_.targets } |
              Where-Object { $_.kind -contains 'bin' } |
              ForEach-Object { $_.name } |
              Where-Object { $_ -notin $notShipped } |
              Sort-Object
          )
          $listed = @($builds | ForEach-Object { ($_ -split '/')[1] } | Sort-Object)
          if (($declared -join ',') -ne ($listed -join ',')) {
            throw (
              "The crates this release builds declare [$($declared -join ', ')] and " +
              "scripts/release-programs.json lists [$($listed -join ', ')] for this release. Add " +
              'the missing binary to the list, or remove the one that is gone.'
            )
          }

          if ($env:GITHUB_REF.StartsWith('refs/tags/host/v')) {
            $tag = $env:GITHUB_REF_NAME
            $expected = "host/v$version+$short"
            if ($tag -ne $expected) {
              throw "$tag does not name this commit at this version. This commit at this version is $expected."
            }
          }

          $release = "$version+$short"
          $sequence = (git rev-list --count HEAD).Trim()
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SEQUENCE=$sequence" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TOP=kalareach-$($env:TARGET)-$release" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "release $release at $commit for $($env:TARGET)"

      # RUSTFLAGS in the environment replaces the flags in `.cargo/config.toml`, the link flags
      # among them, even when it is empty, and the link then says whatever it says. Nothing here
      # sets it, so a run that finds it set stops before building rather than depending on what the
      # linker reports.
      - name: Refuse an environment that replaces the workspace's link flags
        shell: bash
        run: |
          if [ -n "${RUSTFLAGS+set}${CARGO_ENCODED_RUSTFLAGS+set}" ]; then
            echo '::error::RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS is set, and either one replaces the link flags in .cargo/config.toml.'
            exit 1
          fi

      # One command per executable, run by a shell that stops when a command fails, and each one
      # keeps what it printed: the step after the builds reads the linker's own words out of those
      # logs.
      - name: Build each executable
        shell: bash
        run: |
          logs="$(cygpath -u "$RUNNER_TEMP")/build"
          mkdir -p "$logs"
          for build in $KR_BUILDS; do
            cargo build --locked --release -p "${build%/*}" --bin "${build#*/}" 2>&1 | tee "$logs/${build#*/}.log"
          done

      # `LNK4098` is the linker saying that objects in one link ask for two different C runtimes.
      # The C library this workspace vendors was built against the static runtime and Rust links the
      # dynamic one, and `.cargo/config.toml` leaves the static one out of the link. Without that
      # flag the static runtime can be pulled into the image beside the dynamic one, which gives two
      # heaps and two copies of the runtime's state, and any other source of the warning wants a
      # look too. This reads what the builds printed and stops the run before anything is
      # staged, let alone signed. A log it cannot read stops the run as well.
      - name: Refuse a build whose link reported conflicting C runtimes
        shell: bash
        run: |
          logs="$(cygpath -u "$RUNNER_TEMP")/build"
          for build in $KR_BUILDS; do
            name="${build#*/}"
            if [ ! -s "$logs/$name.log" ]; then
              echo "::error::The log of the $name build is not there, so its link cannot be read."
              exit 1
            fi
          done
          found=0
          grep -n 'LNK4098' "$logs"/*.log || found=$?
          if [ "$found" -eq 0 ]; then
            echo '::error::A link reported LNK4098: objects asking for two different C runtimes. Look for what replaced the workspace link flags in .cargo/config.toml.'
            exit 1
          fi
          if [ "$found" -ne 1 ]; then
            echo '::error::The build logs could not be searched for LNK4098.'
            exit 1
          fi
          echo 'No link reported LNK4098.'

      - name: Build the release tool
        shell: bash
        run: cargo build --locked --release -p kr-release

      # The plugins repository at the commit the bundled catalogue was taken from, to read the
      # records the release cites from it.
      - name: Name the plugins commit the bundled catalogue was taken from
        id: plugins
        shell: bash
        run: echo "commit=$(python -c 'import json; print(json.load(open("bundled-plugins.lock"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the plugins repository at that commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kalapowered/kalareach-plugins
          ref: ${{ steps.plugins.outputs.commit }}
          path: plugins-source

      # The channel's root and the keys that sign for it are this run's own: the keys stay outside
      # the tree and the root goes in it, and no host trusts either.
      - name: Make this run's keys and channel root
        shell: bash
        run: target/release/kr-release.exe dev-keys --out "$(cygpath -m "$RUNNER_TEMP")/keys"

      # `bin/` with the host's programs, `shells/psreadline/` with the PowerShell package, and
      # `share/` with the channel's root, the record of what the release was qualified against and
      # the licence, then `release.json`, unsigned. A package the build left other than the
      # repository's pins, and a file a release does not hold, stop it here.
      - name: Assemble the tree
        shell: bash
        env:
          PYTHON: python
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          bash scripts/build-release.sh \
            --target "$TARGET" --release "$RELEASE" --sequence "$SEQUENCE" --commit "$COMMIT" --floor windows=10.0 \
            --programs target/release --root "$temp/keys/root.json" --out "$temp/tree/$TOP" \
            --kr-release target/release/kr-release.exe --plugins plugins-source

      # Each executable in the layout the archive will carry is started once, from where it is
      # assembled, and asked its version. The description process and the forwarder are found beside
      # the worker, so a tree whose layout lost either of them, or whose build cannot start here,
      # stops this run before anything is signed.
      - name: Start each executable of the tree
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = Join-Path $env:RUNNER_TEMP "tree\$env:TOP"
          $names = @(python scripts/release-programs.py names --target $env:TARGET)
          foreach ($name in $names) {
            $said = & (Join-Path $tree "bin\$name.exe") --version
            if ($LASTEXITCODE -ne 0) {
              throw "$name exited with $LASTEXITCODE when it was asked its version."
            }
            Write-Host "$name said: $said"
          }

      - name: Refuse a private key in the tree
        shell: bash
        run: python scripts/check-release-secrets.py scan "$(cygpath -m "$RUNNER_TEMP")/tree/$TOP"

      # The tree the `release` job takes, before this run's signature is on it.
      - name: Keep the tree for signing
        if: ${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ env.TOP }}
          path: ${{ runner.temp }}\tree
          retention-days: 1
          if-no-files-found: error

      - name: Sign the manifest with this run's keys, and verify it
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          target/release/kr-release.exe sign --tree "$temp/tree/$TOP" --checkout . \
            --key "$temp/keys/targets-1.pk8" --key "$temp/keys/targets-2.pk8" --plugins plugins-source
          target/release/kr-release.exe verify --tree "$temp/tree/$TOP" --root "$temp/keys/root.json"

      # What a host does with an archive: it is read as a host stages one, every member against the
      # manifest it carries, and the sums are held to what their checkers read.
      - name: Pack the archive and hold it to what a host stages
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          python scripts/pack-release-zip.py pack --tree "$temp/tree/$TOP" --out "$temp/archive"
          python scripts/check-release-archive.py check --archive "$temp/archive/$TOP.zip" --sums "$temp/archive/SHA256SUMS"
          python scripts/check-release-secrets.py scan "$temp/archive/$TOP.zip"
          bash scripts/check-release-sums.sh "$(cygpath -u "$RUNNER_TEMP")/archive"

      - name: Keep the archive this run proved
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TOP }}-signed-with-this-runs-keys-not-a-release
          path: ${{ runner.temp }}/archive
          retention-days: 7
          if-no-files-found: error

  release:
    name: sign and publish
    needs: [gate, build]
    # A release tag and the default branch only: a run on any other ref skips this job and never
    # reaches the environment.
    if: ${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}
    runs-on: windows-2025
    timeout-minutes: 90
    # The federated credential Entra holds names this environment, so a run without it cannot
    # exchange its token for one the signing service accepts. The environment also carries the
    # deployment policy and the reviewer, which is what puts a person in front of every signature.
    environment: release-signing
    # One tag is one release, and the refusal below cannot see a run that has not created its draft
    # yet: two runs for the same tag would both pass it and both go on to create one. So runs for
    # one ref are serialised here instead, and a run that has already begun is never cancelled for a
    # later one, because it is the run that holds the draft.
    concurrency:
      group: release-windows-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      # By identifier, not by ref: the commit the gate job settled, whatever has happened to the
      # branch since.
      - name: Check out the commit the gate settled
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.commit }}

      - name: Take the trees the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-kalareach-*-windows-msvc-*
          path: ${{ runner.temp }}\unsigned

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # As in the build job: libsodium's prebuilt libraries come from files this places.
      - name: Place libsodium's archives
        uses: ./.github/actions/libsodium-archive
        with:
          restore: 'false'

      - name: Build the release tool
        shell: bash
        run: cargo build --locked --release -p kr-release

      # Each tree's files that carry a signature, set apart at the path they have in it. The
      # signing service signs these directories and nothing else of the tree.
      - name: Set apart the files each tree has signed
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($target in @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            $trees = @(Get-ChildItem -Path "$env:RUNNER_TEMP\unsigned\unsigned-kalareach-$target-*\kalareach-$target-*" -Directory)
            if ($trees.Count -ne 1) { throw "The build job left $($trees.Count) trees for $target, and a release has one." }
            python scripts/stage-windows-signing.py stage --tree $trees[0].FullName --staging "$env:RUNNER_TEMP\staging\$target"
            if ($LASTEXITCODE -ne 0) { throw "The files of the $target tree could not be set apart." }
          }

      # The token exchange. `client-id`, `tenant-id` and `subscription-id` are repository variables
      # because all three are public identifiers; none of them is a secret and none of them would be
      # worth anything to somebody who had it, because the trust is in the federated subject rather
      # than in knowing the numbers.
      - name: Sign in to Azure with the token GitHub minted for this environment
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Every file under the staging directory, with no filter, so that a new artefact is signed
      # because it is there. SHA-256 for the file and for the timestamp, and an RFC 3161 timestamp
      # from the service's own authority: the certificates this profile issues are valid for three
      # days, so a signature without a timestamp stops verifying almost immediately.
      #
      # The credential chain is narrowed to the one the login above leaves behind. Every other kind
      # is switched off, so a login that did not happen fails here in seconds instead of working its
      # way down a list of credentials that could never be present on a runner.
      #
      # The action keeps its own tools in the Actions cache unless it is told not to, and a run on a
      # tag would save a copy of them that no other run can read. The tools are fetched on every
      # run instead, which takes about a minute of a release.
      - name: Sign every Windows artefact of the x64 tree
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          cache-dependencies: false
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kalareach
          certificate-profile-name: kalareach-public-trust
          files-folder: ${{ runner.temp }}\staging\x86_64-pc-windows-msvc
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: KalaReach
          description-url: https://github.com/kalapowered/kalareach
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true


      - name: Sign every Windows artefact of the Arm tree
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          cache-dependencies: false
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kalareach
          certificate-profile-name: kalareach-public-trust
          files-folder: ${{ runner.temp }}\staging\aarch64-pc-windows-msvc
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: KalaReach
          description-url: https://github.com/kalapowered/kalareach
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true


      # The refusal. Every artefact is held to the default Authenticode policy, to carrying a
      # timestamp, and to the name this project signs as; signtool's whole verdict on each one goes
      # into this run's log; and what comes out is a record of what passed. Nothing below takes a
      # signed file from anywhere but a directory this passed, and each file goes back into its tree
      # only if it is the one the record names.
      - name: Refuse any artefact the signature does not hold for
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($target in @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            & "$env:GITHUB_WORKSPACE\scripts\verify-windows-signatures.ps1" `
              -Path "$env:RUNNER_TEMP\staging\$target" `
              -ExpectedSubject "$env:KR_SIGNING_SUBJECT" `
              -Receipt "$env:RUNNER_TEMP\gate\$target\signatures.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Each signed file goes back into its tree, and the record of what passed goes in beside them
      # as `share\signatures.txt`.
      - name: Put the signed files back into their trees
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($target in @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            $tree = @(Get-ChildItem -Path "$env:RUNNER_TEMP\unsigned\unsigned-kalareach-$target-*\kalareach-$target-*" -Directory)[0].FullName
            python scripts/stage-windows-signing.py restore --tree $tree --staging "$env:RUNNER_TEMP\staging\$target" --receipt "$env:RUNNER_TEMP\gate\$target\signatures.txt"
            if ($LASTEXITCODE -ne 0) { throw "The signed files of the $target tree could not be put back." }
          }

      # The manifest is written again, since signing changed the files, and signed by a threshold of
      # the channel's release keys. Those keys do not exist yet: they are made at a key ceremony,
      # held in hardware and on offline media, and no mechanism of this repository gives a run one.
      # This is where the job stops, with the same words on every platform, until they do.
      - name: Write the manifest again and sign it with the channel's release keys
        run: |
          Write-Host "::error::the channel's release keys do not exist yet, so this release cannot be signed. Publishing a release waits for the key ceremony, which is the project owner's to hold. Every step before this one ran and passed."
          exit 1

      # Each tree is packed, and each archive is read as a host stages one: every member against the
      # manifest it carries.
      - name: Pack what the gate accepted
        id: pack
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            tree="$(ls -d "$temp"/unsigned/unsigned-kalareach-"$target"-*/kalareach-"$target"-*)"
            python scripts/pack-release-zip.py pack --tree "$tree" --out "$temp/release"
            python scripts/check-release-archive.py check --archive "$temp/release/$(basename "$tree").zip" --sums "$temp/release/SHA256SUMS"
          done
          echo "directory=$temp/release" >> "$GITHUB_OUTPUT"

      # The two records people check a download with, held to what their checkers read before
      # anything can upload them: SHA256SUMS beside the archives, and each tree's signatures.txt
      # inside its archive. Each line must end in a line feed alone, and sha256sum -c must pass over
      # both archives.
      - name: Hold the sums and the signature records to what checkers read
        shell: bash
        env:
          KR_RELEASE_DIR: ${{ steps.pack.outputs.directory }}
        run: |
          set -euo pipefail
          records=()
          for tree in "$(cygpath -u "$RUNNER_TEMP")"/unsigned/unsigned-kalareach-*/kalareach-*; do
            records+=("$tree/share/signatures.txt")
          done
          bash scripts/check-release-sums.sh "$(cygpath -u "$KR_RELEASE_DIR")" "${records[@]}"

      # Every run keeps what it signed, whether or not a release follows.
      - name: Keep the signed archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-host-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      # A host tag, and only a host tag, becomes a release. The shape is the one
      # `.github/workflows/package-release.yml` settled for the generated packages: refuse before
      # creating anything, assemble as a draft, hold the stored assets to what was packed before
      # publishing, and confirm afterwards that the tag resolves to this release and that nobody can
      # replace what it serves.
      - name: Publish the release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/host/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KR_RELEASE_DIR: ${{ steps.pack.outputs.directory }}
        run: |
          set -euo pipefail
          release_dir="$(cygpath -u "$KR_RELEASE_DIR")"
          temp="$(cygpath -u "$RUNNER_TEMP")"

          # One tag is one release, and a release is never assembled twice. A draft left behind by
          # an upload that failed is named here rather than joined by a second one.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) draft=\(.draft)\"" \
            >"$temp/existing"

          if [ -s "$temp/existing" ]; then
            echo "$GITHUB_REF_NAME already has a release:" >&2
            cat "$temp/existing" >&2
            echo 'A draft left by a run that failed: delete the draft and run this workflow again' >&2
            echo 'for the same tag. A published release: leave it where it is and release the' >&2
            echo 'corrected commit under its own tag.' >&2
            exit 1
          fi

          # The tag is what says which commit was built and signed, so the release names a tag the
          # repository already has rather than one that publishing would create.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --silent; then
            echo "Could not confirm that $GITHUB_REF_NAME is a tag on this repository." >&2
            exit 1
          fi

          # The part of the notes that does not depend on where the assets end up. The last step
          # rebuilds the notes around it with the URLs GitHub reports.
          {
            echo
            echo 'Every executable and every PowerShell file in each archive is signed by'
            echo 'Kala Holdings Inc. and timestamped. The manifest, release.json, is signed by the'
            echo 'update channel'"'"'s release keys. The licences are data and carry no signature.'
            echo 'share\signatures.txt inside each archive records the signer of each file that'
            echo 'carries one. Check one signature for yourself after unpacking:'
            echo
            echo '    Get-AuthenticodeSignature .\bin\kr.exe | Format-List'
            echo '    signtool verify /pa /v .\bin\kr.exe'
            echo
            echo 'Verify the archive itself against the sum:'
            echo
            echo "    sha256sum -c SHA256SUMS"
            echo
            echo 'SHA256SUMS:'
            echo
            sed 's/^/    /' "$release_dir/SHA256SUMS"
            echo
            echo 'The procedure, and how a signature is checked and the profile rotated, are in'
            echo 'docs/releases/windows-signing.md.'
          } >"$temp/notes-tail.md"

          {
            echo "The signed Windows host releases for x64 and Arm, built from commit $GITHUB_SHA."
            cat "$temp/notes-tail.md"
          } >"$temp/notes-draft.md"

          # Creating the draft returns it, and everything below works from that answer: a release
          # takes a while to appear in the listing, and the endpoint that fetches one by its tag
          # answers for published releases only, so the id and the upload address the creation
          # reports are what name the draft afterwards.
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --raw-field "tag_name=$GITHUB_REF_NAME" \
            --raw-field "name=Windows $GITHUB_REF_NAME" \
            --field draft=true \
            --field "body=@$temp/notes-draft.md" \
            --jq '"\(.id) \(.upload_url)"' >"$temp/draft"

          release="$(cut -d' ' -f1 <"$temp/draft")"
          upload="$(cut -d' ' -f2 <"$temp/draft")"

          case "$release" in
            '' | *[!0-9]*)
              echo 'Creating the draft did not name one release:' >&2
              cat "$temp/draft" >&2
              exit 1
              ;;
          esac

          # The upload address ends in the template of the parameters it takes; gh fills the name
          # in as the query string of each upload.
          upload="${upload%%\{*}"

          # An upload that ends in a lost connection or a 5xx is worth repeating; one that ends in
          # the name already being taken fails the same way on the third attempt as on the first.
          for file in "$release_dir"/*; do
            attempt=1
            until gh api --method POST "$upload" \
              --raw-field "name=$(basename "$file")" \
              --header 'Content-Type: application/octet-stream' \
              --input "$file" --silent; do
              if [ "$attempt" -ge 3 ]; then
                echo "Uploading $(basename "$file") to draft release $release failed." >&2
                echo 'Delete the draft and run this workflow again for the same tag.' >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
          done

          # The asset set is held to what was packed while nothing can install it: the archive and
          # its sum, at their lengths, with the sha256 GitHub computed over the bytes it stored, and
          # nothing else attached.
          for file in "$release_dir"/*; do
            printf '%s %s sha256:%s\n' \
              "$(basename "$file")" \
              "$(wc -c <"$file" | tr -d ' ')" \
              "$(sha256sum "$file" | cut -d' ' -f1)"
          done | sort >"$temp/packed-assets"

          # Reading a release moments after writing to it can reach a copy that has not caught up,
          # so every read below is attempted a few times before its answer is believed. Each one is
          # a read: repeating it changes nothing, and an answer that is simply wrong is still wrong
          # on the last attempt.
          attempt=1
          while :; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/$release" \
                 --jq '.assets[] | "\(.name) \(.size) \(.digest)"' \
                 | sort >"$temp/stored-assets" \
               && cmp -s "$temp/packed-assets" "$temp/stored-assets"; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo 'The release holds something other than what was packed; it stays a draft.' >&2
              diff "$temp/packed-assets" "$temp/stored-assets" >&2 || true
              echo 'A digest of null is GitHub reporting none for that asset, which leaves nothing' >&2
              echo 'to compare and is equally a reason not to publish it.' >&2
              echo 'Delete the draft and run this workflow again for the same tag.' >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release" \
            -F draft=false --jq '.html_url'

          # What somebody pins is a URL and a digest, so the release behind them has to be one
          # nobody can point somewhere else. The question is asked of the tag rather than of the
          # identifier, because the tag is what a person resolves, and the answer has to name the
          # release this run published.
          attempt=1
          while :; do
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '"\(.id) \(.immutable)"' 2>/dev/null || echo '')"
            if [ "$published" = "$release true" ]; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              case "$published" in
                "$release false")
                  echo "$GITHUB_REF_NAME was published as a release whose assets can be replaced." >&2
                  echo 'Turn on immutable releases for this repository, then release the next commit.' >&2
                  ;;
                "$release" | "$release "*)
                  echo "$GITHUB_REF_NAME was published, and this is not an answer about whether its" >&2
                  echo "assets can be replaced, so it is not one to publish against: $published" >&2
                  ;;
                *)
                  echo "$GITHUB_REF_NAME does not resolve to the release this run published." >&2
                  echo "It published release $release; the tag answers: ${published:-nothing}" >&2
                  ;;
              esac
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

      - name: Check what the release serves, and name those URLs in the notes
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/host/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KR_RELEASE_DIR: ${{ steps.pack.outputs.directory }}
        run: |
          set -euo pipefail
          release_dir="$(cygpath -u "$KR_RELEASE_DIR")"
          temp="$(cygpath -u "$RUNNER_TEMP")"
          served="$temp/served"
          mkdir -p "$served"

          # GitHub's own record of each asset: its identifier, which is what fetches the bytes, and
          # the address it serves them at, which is what a person pins. Asked of the tag, because
          # the tag is what a person resolves, and attempted a few times, because a read that
          # follows a write can reach a copy that has not caught up and answer with part of the set.
          cut -d' ' -f1 <"$temp/packed-assets" | sort >"$temp/packed-names"

          attempt=1
          while :; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                 --jq '.assets[] | "\(.name) \(.id) \(.browser_download_url)"' \
                 >"$temp/served-assets" \
               && cut -d' ' -f1 <"$temp/served-assets" | sort \
                 | cmp -s - "$temp/packed-names"; then
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "$GITHUB_REF_NAME does not serve what this run packed." >&2
              echo 'Packed:' >&2
              cat "$temp/packed-names" >&2
              echo 'Served:' >&2
              cut -d' ' -f1 <"$temp/served-assets" >&2 || true
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          # Fetched through the API with this run's token rather than from the public address,
          # because this repository's releases are not public and an unauthenticated request for one
          # of its assets is answered with a 404 rather than the bytes. The address a person pins is
          # still the one GitHub reported, and it is what goes in the notes below.
          while read -r name id _; do
            attempt=1
            until gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              --header 'Accept: application/octet-stream' >"$served/$name"; do
              if [ "$attempt" -ge 5 ]; then
                echo "Could not fetch $name back from the release it was published to." >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
          done <"$temp/served-assets"

          cmp "$release_dir/SHA256SUMS" "$served/SHA256SUMS"
          (cd "$served" && sha256sum -c SHA256SUMS)

          {
            echo "The signed Windows host releases for x64 and Arm, built from commit $GITHUB_SHA."
            echo
            while read -r name _ url; do
              case "$name" in
                *.zip) echo "- $url" ;;
              esac
            done <"$temp/served-assets"
            cat "$temp/notes-tail.md"
          } >"$temp/notes.md"

          # By the identifier the creation returned, because resolving a tag first would be a
          # further read after a write; this is a write to one known release.
          release="$(cut -d' ' -f1 <"$temp/draft")"

          case "$release" in
            '' | *[!0-9]*)
              echo 'The release this run published is not named in the record it kept:' >&2
              cat "$temp/draft" >&2
              exit 1
              ;;
          esac

          attempt=1
          until gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release" \
            --field "body=@$temp/notes.md" --silent; do
            if [ "$attempt" -ge 5 ]; then
              echo "Writing the served URLs into the notes of release $release failed." >&2
              echo 'The release itself is published and carries what was packed; only its notes are' >&2
              echo 'in doubt, because a request that ends without an answer may still have been' >&2
              echo 'applied. Read the notes of that release and, if they are still the text the' >&2
              echo 'draft was created with, put the URLs below into them by hand.' >&2
              cat "$temp/notes.md" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          cat "$temp/notes.md" >>"$GITHUB_STEP_SUMMARY"
