name: release-checks

# Checks on what a release ships, run on every change so a fault is found where it was made and not
# at the release.
#
# `secrets` reads every tracked file for a private key or an official push credential: the release's
# signing keys live in hardware-backed services and its channel roots on offline media, and an
# independently signed app supplies its own credentials, so none of them has a place in a
# repository. `mobile-graph` holds the companion's dependency graph on each mobile target to the
# client's own crates: the host's packages are separate build products and never link into a phone
# build. `clean-checkout` reads the tree and its whole history from a clone of its own: no tracked
# file names a record kept outside the repository, every commit is one subject line, every relative
# Markdown link resolves, and the `.gitignore`'s local workspace section ignores each assistant
# instruction name. `outgoing-records` reads what a push or a pull request would send: every commit
# of the range, so a record added in one commit and deleted in the next is still found, and every
# file each public npm package would carry. Each check is put through a planted fault before it is
# trusted with the tree.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push is read from the commit it replaced, so a push run that a later push cancelled would leave
# its commits unread by `outgoing-records`: each push run has a group of its own (two pushes can
# even carry the same head commit). A pull request or a manual run still replaces an earlier run on
# the same ref.
concurrency:
  group: release-checks-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: no private keys or official credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test the scan
        run: python3 scripts/check-release-secrets.py self-test

      - name: Scan the tracked files
        run: python3 scripts/check-release-secrets.py scan --tracked .

  clean-checkout:
    name: the tree and its history name no outside record
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the whole history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Test the refusals
        run: bash scripts/check-clean-checkout.sh --self-test

      - name: Check the commit from a clean clone
        run: bash scripts/check-clean-checkout.sh --no-steps

  # KR-GOAL-32: the commits being sent and the published packages' file lists contain no local-only
  # record, credential or build-agent instruction file. The history comes whole because a push names
  # the commit it replaced and a pull request the branch it merges into. Packing runs the steps the
  # real pack runs, which generate most of what the protocol package carries, so the packages'
  # dependencies are installed first.
  outgoing-records:
    name: no outgoing commit or package carries a record
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the whole history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install the packages' dependencies
        run: pnpm install --frozen-lockfile --filter @kalareach/protocol --filter @kalareach/plugin-sdk

      - name: Test the refusals
        run: python3 -I scripts/check-outgoing-records.py self-test

      - name: Check the commits and the packages
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 -I scripts/check-outgoing-records.py check

  mobile-graph:
    name: the companion links no host crate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the exact toolchain.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Restore the cargo cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: graph
          paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache

      - name: Test the graph check
        run: python3 scripts/check-mobile-graph.py self-test

      - name: Read the companion's graph on each mobile target
        run: python3 scripts/check-mobile-graph.py check --locked

      - name: Save the cargo cache
        uses: ./.github/actions/cargo-cache-save
        with:
          primary-key: ${{ steps.cargo-cache.outputs.primary-key }}
          cache-hit: ${{ steps.cargo-cache.outputs.cache-hit }}
          paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache

  # The third-party notice that every release archive carries is made from the lock by
  # `scripts/generate-notices.py`: it lists the crates the programs and fish are built from with
  # `cargo tree`, reads each crate's licence files from its package with askalono, and asks
  # cargo-about, run offline, which licence each crate is recorded under. The preparation fetches the
  # pinned fish archive, the crates that fish's lock names and the SPDX licence list at its pinned
  # revision; the licence files are then identified offline. The committed text has to be the one
  # that makes.
  # cargo-about and askalono are each one pinned release, and each archive has to match the digest
  # below before it runs.
  third-party-notice:
    name: the third-party notice is the one the lock makes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the exact toolchain.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: "0.9.3"
          CARGO_ABOUT_SHA256: "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4"
        run: |
          set -euo pipefail
          release="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$release.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$release.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$release.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$release.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"

      - name: Install askalono
        env:
          ASKALONO_VERSION: "0.5.0"
          ASKALONO_SHA256: "8a007355b700137b48e7e39aab5d083acb9a0926f20c064ab4476b1624390e52"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/askalono.zip" \
            "https://github.com/amzn/askalono/releases/download/$ASKALONO_VERSION/askalono-Linux.zip"
          echo "$ASKALONO_SHA256  $RUNNER_TEMP/askalono.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/askalono"
          unzip -q "$RUNNER_TEMP/askalono.zip" -d "$RUNNER_TEMP/askalono"
          echo "$RUNNER_TEMP/askalono" >> "$GITHUB_PATH"

      - name: Test the generator
        run: python3 scripts/generate-notices.py self-test

      - name: Build kr-release
        run: cargo build --locked -p kr-release

      # `cargo fetch --locked` brings in the crates the lock names for every platform. The generator
      # then fetches the pinned fish archive, the crates that fish's lock names and the SPDX licence
      # list; after that, cargo-about and askalono read only what is on disk.
      - name: Fetch the lock's crates
        run: cargo fetch --locked

      - name: Make the notice again and compare it with the committed one
        run: python3 scripts/generate-notices.py check --kr-release target/debug/kr-release
