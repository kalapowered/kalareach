name: package-npm

# Publishes the plugin SDK to the npm registry from the archive a package release carries.
#
# A tag of the form `packages/v<version>+<short commit>` releases the two archives
# (`package-release.yml`), and this workflow takes the SDK's archive from that release, holds it to
# the release's own sums and to what `npm pack` makes of the same commit, and asks npm what it would
# do with it. Publishing is a separate job behind the `npm-publish` environment: a required reviewer
# approves each publish there, and its deployment policy admits `packages/v*` tags and nothing else.
# The job runs the same archive through `npm publish --provenance`, authenticated by the workflow's
# own identity, so no registry token exists anywhere in this repository. The registry side is the
# package's trusted publisher, set in the package's own settings on npm for this workflow file and
# this environment; `docs/releases/packages.md` gives its fields.
#
# The bytes are bound end to end: the check job records the sha512 of the archive it approved, and
# the publish job downloads the release again after the approval and refuses any archive whose
# sha512 is not that one. Both refuse a release that is not immutable, so an asset cannot be
# replaced between the check and the publish.
#
# npm takes each version once, and two package releases can name the same version, since a tag names
# the commit as well as the version. The check job therefore asks the registry what it holds under
# the archive's version before anything waits for approval: a version npm does not hold goes on to
# the publish job; the very archive under a version npm holds ends the run with a notice and
# leaves the publish job skipped, so nobody is asked to approve a publish that has nothing to do;
# another archive under a version npm holds fails the check.
#
# A run started by hand on a branch rehearses the check job: it packs the checked-out commit with
# the release script, checks and dry-runs the result, and stops there, because the environment's
# policy refuses the publish job a ref that is not a release tag before any step of it runs.
on:
  push:
    tags:
      - 'packages/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Trusted publishing needs npm 11.5.1 or later; the Node that runs the release ships an older one.
  NPM_VERSION: 11.20.0

jobs:
  check:
    name: check the archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha512: ${{ steps.approved.outputs.sha512 }}
      published: ${{ steps.registry.outputs.published }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.14.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install npm
        run: npm install --global "npm@$NPM_VERSION"

      # rust-toolchain.toml pins the exact toolchain; a rehearsal packs with the generators it builds.
      - name: Install the pinned toolchain
        if: github.ref_type != 'tag'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        if: github.ref_type != 'tag'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # A tagged run takes the archive the release published, once the release is public: the
      # release workflow runs beside this one on the same tag, so it may not exist yet. Each attempt
      # downloads into a directory of its own, so a partial file never blocks the next one. What was
      # downloaded is held to the release's own sha512 before anything reads it, and the release has
      # to be immutable, so its assets cannot be replaced afterwards.
      - name: Take the archive from the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attempt=1
          until directory="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")" &&
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --dir "$directory" --pattern 'kalareach-plugin-sdk-*.tgz' --pattern SHA512SUMS; do
            if [ "$attempt" -ge 100 ]; then
              echo "$GITHUB_REF_NAME has no published release with the SDK archive after fifty minutes." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)"
          [ "$immutable" = true ] || { echo "The release for $GITHUB_REF_NAME is not immutable." >&2; exit 1; }
          cd "$directory"
          set -- kalareach-plugin-sdk-*.tgz
          [ "$#" -eq 1 ] || { echo "Expected one SDK archive, found: $*" >&2; exit 1; }
          grep -v '^#' SHA512SUMS | grep -F -- "  $1" | sha512sum -c -
          echo "ARCHIVE=$directory/$1" >> "$GITHUB_ENV"

      # A rehearsal packs this commit as a release would, with the release's own script.
      - name: Pack the archive from this commit
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          bash scripts/release-packages.sh --output "$RUNNER_TEMP/release"
          set -- "$RUNNER_TEMP"/release/kalareach-plugin-sdk-*.tgz
          [ "$#" -eq 1 ] || { echo "Expected one SDK archive, found: $*" >&2; exit 1; }
          echo "ARCHIVE=$1" >> "$GITHUB_ENV"

      # The checkout the archive is compared with is the tagged commit, and its own install
      # provides the package's dependency to the consumer check.
      - name: Install the package's dependencies
        run: pnpm install --frozen-lockfile --filter @kalareach/plugin-sdk

      - name: Test the archive check
        run: python3 scripts/check-release-npm.py self-test

      - name: Hold the archive to npm's own pack
        run: python3 scripts/check-release-npm.py check --archive "$ARCHIVE"

      # What the publish job will be held to.
      - name: Record the approved archive's digest
        id: approved
        run: echo "sha512=$(sha512sum "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The publish job runs only when npm holds nothing under this version. The same archive under a
      # held version ends the run here with a notice, and another archive under it fails here.
      - name: Ask npm whether it already holds this version
        id: registry
        run: python3 scripts/check-release-npm.py registry --archive "$ARCHIVE" --github-output "$GITHUB_OUTPUT"

      - name: Ask npm what publishing would do
        run: npm publish "$ARCHIVE" --dry-run --access public

  publish:
    name: publish to npm
    needs: check
    # A skipped job asks nobody for approval. Only an answer of `false` goes on, so a check that
    # recorded no answer publishes nothing.
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The gate. Nothing above needs the environment, and nothing below runs before it is approved.
    environment: npm-publish
    permissions:
      contents: read
      # The workflow's identity is what npm authenticates and what the provenance statement names.
      id-token: write
    steps:
      # The environment's policy already refuses every other ref; this keeps a loosened policy from
      # publishing a branch.
      - name: Refuse anything that is not a tagged release
        if: github.ref_type != 'tag'
        run: |
          echo "Only a tagged release is published; this run is $GITHUB_REF." >&2
          exit 1

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        run: npm install --global "npm@$NPM_VERSION"

      # After the approval, the release is read again, and what is published is the archive the
      # check approved: any other digest ends the job before npm is asked anything.
      - name: Take the approved archive from the release
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA512: ${{ needs.check.outputs.sha512 }}
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)"
          [ "$immutable" = true ] || { echo "The release for $GITHUB_REF_NAME is not immutable." >&2; exit 1; }
          directory="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$directory" --pattern 'kalareach-plugin-sdk-*.tgz' --pattern SHA512SUMS
          cd "$directory"
          set -- kalareach-plugin-sdk-*.tgz
          [ "$#" -eq 1 ] || { echo "Expected one SDK archive, found: $*" >&2; exit 1; }
          grep -v '^#' SHA512SUMS | grep -F -- "  $1" | sha512sum -c -
          case "$APPROVED_SHA512" in
            *[!0-9a-f]* | '') echo "The check job recorded no digest." >&2; exit 1 ;;
          esac
          [ "$(sha512sum "$1" | cut -d' ' -f1)" = "$APPROVED_SHA512" ] || {
            echo "This archive is not the one the check job approved." >&2
            exit 1
          }
          echo "ARCHIVE=$directory/$1" >> "$GITHUB_ENV"

      - name: Publish with provenance
        run: npm publish "$ARCHIVE" --provenance --access public
