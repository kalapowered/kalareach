name: win-runtime-probe

# A probe of the crypto crate's test programs under the static C runtime. Two of its store tests
# fail on a hosted runner when a bash step runs them: each denies an access right on a directory
# and expects the open that asks for it to be refused. This run starts each program from the
# shell the landing workflow uses and from bash, with the workspace's link flags and with the
# dynamic runtime's, and prints the account's privileges. It signs nothing, uploads nothing, saves
# no cache and reads no secret: the only token it holds reads this repository's contents.
#
# It is started by a push to a branch whose name ends in `-probe` under `scratch/`, and by nothing
# else.

on:
  push:
    branches: ['scratch/*-probe']

permissions:
  contents: read

concurrency:
  group: win-runtime-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One architecture's failure says nothing about the other's, and each is worth seeing.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      # Where the test programs of the Windows job in the landing workflow put their artefacts.
      KR_TEST_ARTIFACTS_DIR: C:\kr-test-artifacts
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Some runner images carry no Rust at all. The installer is rustup's own, and it installs no
      # toolchain: the next step installs the one this repository pins.
      - name: Install rustup where the image has none
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$architecture-pc-windows-msvc/rustup-init.exe" -OutFile $installer
            & $installer -y --no-modify-path --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')
          }

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The prebuilt library and its signature come from libsodium's host, and no cache is read.
      - name: Place libsodium's archives
        uses: ./.github/actions/libsodium-archive
        with:
          restore: 'false'

      # What the account holds in each shell, and which program a bare name reaches. An access
      # list binds an account that holds no privilege which overrides lists.
      - name: Account and programs in PowerShell
        if: ${{ !cancelled() }}
        run: |
          whoami /user
          whoami /priv
          where.exe whoami.exe icacls.exe
          exit 0

      - name: Account and programs in bash
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cmd.exe //c "whoami.exe /priv"
          type -a whoami.exe icacls.exe || true
          echo "$PATH" | tr ':' '\n' | head -12
          exit 0

      # The two failing programs' whole suite, started the way the landing workflow starts it.
      - name: Test kr-crypto in PowerShell with the workspace's flags
        if: ${{ !cancelled() }}
        run: cargo test --locked -p kr-crypto

      # The two failing tests alone, from bash, with the same build.
      - name: Test the two store cases in bash with the workspace's flags
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p kr-crypto --lib -- store::tests::directories_are_made_and_confirmed store::tests::a_confirmed_scope_takes_secrets

      # The link flags the workspace had before the change, given by the environment, which
      # replaces the flags in `.cargo/config.toml`, and a target directory of their own.
      - name: Test kr-crypto in PowerShell with the dynamic runtime's flags
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -Clink-arg=/NODEFAULTLIB:LIBCMT -Clink-arg=/NODEFAULTLIB:LIBCMTD -Clink-arg=/IGNORE:4099
          CARGO_TARGET_DIR: target-dynamic
        run: cargo test --locked -p kr-crypto

      - name: Test the two store cases in bash with the dynamic runtime's flags
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RUSTFLAGS: -Clink-arg=/NODEFAULTLIB:LIBCMT -Clink-arg=/NODEFAULTLIB:LIBCMTD -Clink-arg=/IGNORE:4099
          CARGO_TARGET_DIR: target-dynamic
        run: cargo test --locked -p kr-crypto --lib -- store::tests::directories_are_made_and_confirmed store::tests::a_confirmed_scope_takes_secrets
