name: release-host

# Seals the four host release trees of the macOS and Linux targets with the update channel's release
# keys, checks each sealed archive on its own platform, and publishes them as one release.
#
# It is run by hand, on `main`, after `release-tree.yml` has built the trees at a commit and
# `scripts/sign-macos-release.sh` has signed and notarised the two macOS trees on the machine that
# holds the Developer ID and left them in a draft named `host-staging/v<release>`:
#
#   gh workflow run release-host.yml --ref main -f commit=<sha> -f build_run=<run id> -f staged_sums_sha256=<hex>
#
# `source` holds the inputs to what they name before any approval: the commit is on `main`, the run
# is a successful `release-tree.yml` run on that commit, each tree is the artefact whose digest
# GitHub states, and the staged files are the ones whose sums hash to the third input. It prints
# every digest in the run's summary, so the person who approves can compare them with what the
# signing script printed.
#
# `channel` is the only job that holds a key. It is behind the `update-signing` environment, which
# puts a person in front of every use of the update channel's two release keys, it has no write
# access to the repository, and it runs the one script that seals a tree. The tool that script runs
# is built by the job before it, which holds no key, so no build step of this repository runs where
# a key is. `check` unpacks each sealed archive on its own platform with no key and no environment,
# verifies it against the root committed in this repository and installs it. `publish` holds
# no key either and runs only once every check has passed and every digest is the one that was
# checked; it is not behind an environment, because the approval at `update-signing` is the one
# approval of a release.
#
# The tag `host/v<release>` is made by publishing the release at the commit, through the API with
# this workflow's token, and a tag made that way starts no workflow.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit the trees were built from, in full. It has to be on main.
        required: true
        type: string
      build_run:
        description: The release-tree run that built the trees at that commit.
        required: true
        type: string
      staged_sums_sha256:
        description: The SHA-256 of STAGED-SHA256SUMS, as scripts/sign-macos-release.sh printed it.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-host
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The release's macOS floor, which the programs the check builds are built to as well.
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  # Where the update channel's root is kept in this repository.
  CHANNEL_ROOT: release/tester-channel/root.json

defaults:
  run:
    shell: bash

jobs:
  source:
    name: what this release is made from
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A draft release is not visible to a token that can only read, and the files the macOS signing
    # staged are in one. Nothing else here writes.
    permissions:
      contents: write
      actions: read
    outputs:
      release: ${{ steps.run.outputs.release }}
      commit: ${{ steps.run.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.commit }}
      BUILD_RUN: ${{ inputs.build_run }}
      STAGED_SUMS: ${{ inputs.staged_sums_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Hold the commit to main, and the root to this commit
        run: |
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::the commit is a full hash"; exit 1; }
          printf '%s' "$BUILD_RUN" | grep -Eq '^[0-9]+$' || { echo "::error::the build run is a number"; exit 1; }
          printf '%s' "$STAGED_SUMS" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::the staged sums digest is 64 hexadecimal digits"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::the checkout is not $COMMIT"; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT is not on main"; exit 1; }
          [ -s "$CHANNEL_ROOT" ] || { echo "::error::$CHANNEL_ROOT is not in this commit: the update channel's root is committed before a release is sealed"; exit 1; }

      - name: Hold the build run
        id: run
        run: |
          facts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '"\(.path) \(.conclusion) \(.head_sha) \(.head_branch)"')"
          if [ "$facts" != ".github/workflows/release-tree.yml success $COMMIT main" ]; then
            echo "::error::run $BUILD_RUN is not a successful release-tree run on main at $COMMIT: $facts"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("unsigned-kalareach-")) | "\(.id) \(.name) \(.expired) \(.digest)"' \
            > "$RUNNER_TEMP/artifacts"
          [ "$(wc -l < "$RUNNER_TEMP/artifacts" | tr -d ' ')" -eq 4 ] || { echo "::error::run $BUILD_RUN does not hold four unsigned trees"; cat "$RUNNER_TEMP/artifacts"; exit 1; }
          releases="$(sed -E 's/^[0-9]+ unsigned-kalareach-[a-z0-9_-]+-([0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]{12}) .*/\1/' "$RUNNER_TEMP/artifacts" | sort -u)"
          [ "$(printf '%s\n' "$releases" | wc -l | tr -d ' ')" -eq 1 ] || { echo "::error::the trees are of more than one release: $releases"; exit 1; }
          [ "${COMMIT:0:12}" = "${releases#*+}" ] || { echo "::error::the release $releases does not name the commit $COMMIT"; exit 1; }
          echo "release=$releases" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Hold the staged files
        env:
          RELEASE: ${{ steps.run.outputs.release }}
        run: |
          # Only a 404 is "nothing there"; any other answer from GitHub stops the run.
          taken() {
            local answer
            if answer="$(gh api "$1" 2>&1)"; then return 0; fi
            case "$answer" in
              *"HTTP 404"*) return 1 ;;
              *) echo "::error::asking GitHub about $1 failed: $answer"; exit 1 ;;
            esac
          }
          if taken "repos/$GITHUB_REPOSITORY/releases/tags/host/v$RELEASE" || taken "repos/$GITHUB_REPOSITORY/git/ref/tags/host/v$RELEASE"; then
            echo "::error::host/v$RELEASE already has a release or a tag"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"host/v$RELEASE\") | \"\(.id) draft=\(.draft)\"" > "$RUNNER_TEMP/leftover"
          [ ! -s "$RUNNER_TEMP/leftover" ] || { echo "::error::host/v$RELEASE already has a release or a draft:"; cat "$RUNNER_TEMP/leftover"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"host-staging/v$RELEASE\" and .draft) | \"\(.id) \(.target_commitish)\"" > "$RUNNER_TEMP/staging"
          [ "$(wc -l < "$RUNNER_TEMP/staging" | tr -d ' ')" -eq 1 ] || { echo "::error::there is not exactly one staging draft of $RELEASE"; exit 1; }
          read -r staging target < "$RUNNER_TEMP/staging"
          [ "$target" = "$COMMIT" ] || { echo "::error::the staging draft is of $target, not $COMMIT"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$staging" --jq '.assets[] | "\(.id) \(.name) \(.digest)"' > "$RUNNER_TEMP/staged"
          mkdir -p "$RUNNER_TEMP/staged-files"
          while read -r id name digest; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/staged-files/$name"
            [ "sha256:$(sha256sum "$RUNNER_TEMP/staged-files/$name" | cut -d' ' -f1)" = "$digest" ] || { echo "::error::$name is not the file GitHub holds the digest of"; exit 1; }
          done < "$RUNNER_TEMP/staged"
          [ "$(sha256sum "$RUNNER_TEMP/staged-files/STAGED-SHA256SUMS" | cut -d' ' -f1)" = "$STAGED_SUMS" ] || { echo "::error::STAGED-SHA256SUMS is not the file the input names"; exit 1; }
          (cd "$RUNNER_TEMP/staged-files" && sha256sum -c STAGED-SHA256SUMS)
          # The sums name exactly the two macOS trees, the notary record and the record of the run, and the
          # draft holds those and the sums themselves and nothing else.
          want="$(printf '%s\n' "signed-kalareach-aarch64-apple-darwin-$RELEASE.tar" "signed-kalareach-x86_64-apple-darwin-$RELEASE.tar" STAGED-NOTARY.txt STAGED-RUN.txt | sort)"
          [ "$(awk '{print $2}' "$RUNNER_TEMP/staged-files/STAGED-SHA256SUMS" | sort)" = "$want" ] || { echo "::error::the staged sums do not name the two macOS trees, the notary record and the run record"; exit 1; }
          [ "$(ls "$RUNNER_TEMP/staged-files" | sort)" = "$(printf '%s\nSTAGED-SHA256SUMS\n' "$want" | sort)" ] || { echo "::error::the staging draft holds other files than the sums name"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/staged-files/STAGED-RUN.txt")" = "$(printf 'run=%s\ncommit=%s\nrelease=%s' "$BUILD_RUN" "$COMMIT" "$RELEASE")" ] || { echo "::error::the staged trees were made from another run, commit or release than the inputs name"; exit 1; }

      # By identifier: the artefact GitHub holds the digest of, the sum beside the tar, and a manifest
      # that names this commit, this release and this target.
      - name: Take the trees, and hold each to its digest and its manifest
        env:
          RELEASE: ${{ steps.run.outputs.release }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            top="kalareach-$target-$RELEASE"
            out="$RUNNER_TEMP/to-seal/$target"
            mkdir -p "$out" "$RUNNER_TEMP/look"
            # The tree the run built, by the digest GitHub holds for its artefact and the sum beside it.
            line="$(grep " unsigned-$top " "$RUNNER_TEMP/artifacts")"
            read -r id name expired digest <<< "$line"
            [ "$expired" = false ] || { echo "::error::$name has expired"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$target.zip"
            [ "sha256:$(sha256sum "$RUNNER_TEMP/$target.zip" | cut -d' ' -f1)" = "$digest" ] || { echo "::error::$name is not the artefact GitHub holds the digest of"; exit 1; }
            unzip -q "$RUNNER_TEMP/$target.zip" -d "$RUNNER_TEMP/$target-unzipped"
            (cd "$RUNNER_TEMP/$target-unzipped" && sha256sum -c "$top.tar.sha256")
            case "$target" in
              *-apple-darwin)
                # The signed tree is the run's tree with its programs signed: the manifest of the one is
                # the manifest of the other, since nothing signs release.json before it is sealed.
                cp "$RUNNER_TEMP/staged-files/signed-$top.tar" "$out/$top.tar"
                tar -xOf "$RUNNER_TEMP/$target-unzipped/$top.tar" "$top/release.json" > "$RUNNER_TEMP/$target.run-release.json"
                tar -xOf "$out/$top.tar" "$top/release.json" > "$RUNNER_TEMP/$target.staged-release.json"
                cmp "$RUNNER_TEMP/$target.run-release.json" "$RUNNER_TEMP/$target.staged-release.json" || { echo "::error::the staged tree of $target is not made from the tree the run built: the manifests differ"; exit 1; }
                ;;
              *)
                cp "$RUNNER_TEMP/$target-unzipped/$top.tar" "$out/$top.tar"
                ;;
            esac
            rm -rf "$RUNNER_TEMP/look/$top"
            tar -xf "$out/$top.tar" -C "$RUNNER_TEMP/look" "$top/release.json"
            python3 -I - "$RUNNER_TEMP/look/$top/release.json" "$RELEASE" "$COMMIT" "$target" << 'PYTHON'
          import json
          import sys

          signed = json.load(open(sys.argv[1], encoding="utf-8"))["signed"]
          release, commit, target = sys.argv[2:5]
          if (signed["release"], signed["commit"], signed["target"]) != (release, commit, target):
              sys.exit(f"the manifest names {signed['release']} {signed['commit']} {signed['target']}, not {release} {commit} {target}")
          PYTHON
            (cd "$out" && sha256sum "$top.tar" > "$top.tar.sha256")
          done
          {
            echo "### $RELEASE at $COMMIT"
            echo
            echo 'The trees to be sealed, each as the tar the next job takes:'
            echo '```'
            cat "$RUNNER_TEMP"/to-seal/*/*.tar.sha256
            echo '```'
            echo 'The staged sums (sha256 of the file is the input `staged_sums_sha256`):'
            echo '```'
            echo "$STAGED_SUMS  STAGED-SHA256SUMS"
            cat "$RUNNER_TEMP/staged-files/STAGED-SHA256SUMS"
            echo '```'
            echo 'The notary submissions:'
            echo '```'
            cat "$RUNNER_TEMP/staged-files/STAGED-NOTARY.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the trees for the job that seals them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: to-seal
          path: ${{ runner.temp }}/to-seal
          retention-days: 3
          if-no-files-found: error

  # The release tool, built by a job that holds no key, for the job that does.
  tool:
    name: the release tool
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Install rustup where the image has none
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build the release tool
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p kr-release
          mkdir -p "$RUNNER_TEMP/tool"
          cp target/release/kr-release "$RUNNER_TEMP/tool/"
          (cd "$RUNNER_TEMP/tool" && sha256sum kr-release | tee kr-release.sha256)

      - name: Keep the release tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kr-release
          path: ${{ runner.temp }}/tool
          retention-days: 3
          if-no-files-found: error

  channel:
    name: seal the four trees with the channel's release keys
    needs: [source, tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The environment carries the deployment policy and the reviewer, which puts a person in front
    # of every use of the update channel's release keys.
    environment: update-signing
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.source.outputs.release }}
      COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Check out the commit the run settled
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Take the trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: to-seal
          path: ${{ runner.temp }}/to-seal

      - name: Take the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kr-release
          path: ${{ runner.temp }}/tool

      - name: Hold the trees and the tool to their sums
        run: |
          (cd "$RUNNER_TEMP/tool" && sha256sum -c kr-release.sha256)
          chmod +x "$RUNNER_TEMP/tool/kr-release"
          for sums in "$RUNNER_TEMP"/to-seal/*/*.tar.sha256; do
            (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")")
          done

      - name: Name the plugins commit the bundled catalogue was taken from
        id: plugins
        run: echo "commit=$(python3 -I -c 'import json; print(json.load(open("bundled-plugins.lock"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the plugins repository at that commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kalapowered/kalareach-plugins
          ref: ${{ steps.plugins.outputs.commit }}
          path: plugins-source
          persist-credentials: false

      # The keys are in this step's environment and in files of mode 0600 until the step after it.
      - name: Seal each tree
        env:
          TARGETS_KEY_1: ${{ secrets.RELEASE_CHANNEL_TARGETS_KEY_1 }}
          TARGETS_KEY_2: ${{ secrets.RELEASE_CHANNEL_TARGETS_KEY_2 }}
        run: |
          for need in TARGETS_KEY_1 TARGETS_KEY_2; do
            if [ -z "${!need}" ]; then
              echo "::error::the update channel's release keys are not set up: $need is empty. Nothing here seals a release without them."
              exit 1
            fi
          done
          (
            umask 077
            mkdir -p "$RUNNER_TEMP/channel-keys"
            printf '%s' "$TARGETS_KEY_1" | base64 --decode > "$RUNNER_TEMP/channel-keys/targets-1.pk8"
            printf '%s' "$TARGETS_KEY_2" | base64 --decode > "$RUNNER_TEMP/channel-keys/targets-2.pk8"
          )
          # The script reads the keys by path, so the programs it runs get no copy in their environment.
          unset TARGETS_KEY_1 TARGETS_KEY_2
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            top="kalareach-$target-$RELEASE"
            mkdir -p "$RUNNER_TEMP/trees/$target"
            tar -xf "$RUNNER_TEMP/to-seal/$target/$top.tar" -C "$RUNNER_TEMP/trees/$target"
            bash scripts/seal-release-tree.sh --tree "$RUNNER_TEMP/trees/$target/$top" --checkout . --plugins plugins-source \
              --kr-release "$RUNNER_TEMP/tool/kr-release" --root "$CHANNEL_ROOT" \
              --key "$RUNNER_TEMP/channel-keys/targets-1.pk8" --key "$RUNNER_TEMP/channel-keys/targets-2.pk8" \
              --out "$RUNNER_TEMP/sealed/$target"
            rm -f "$RUNNER_TEMP/sealed/$target/SHA256SUMS"
          done

      - name: Remove the keys
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/channel-keys"

      - name: Keep the sealed archive of aarch64-apple-darwin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-aarch64-apple-darwin
          path: ${{ runner.temp }}/sealed/aarch64-apple-darwin
          retention-days: 1
          if-no-files-found: error

      - name: Keep the sealed archive of x86_64-apple-darwin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-x86_64-apple-darwin
          path: ${{ runner.temp }}/sealed/x86_64-apple-darwin
          retention-days: 1
          if-no-files-found: error

      - name: Keep the sealed archive of aarch64-unknown-linux-gnu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/sealed/aarch64-unknown-linux-gnu
          retention-days: 1
          if-no-files-found: error

      - name: Keep the sealed archive of x86_64-unknown-linux-gnu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/sealed/x86_64-unknown-linux-gnu
          retention-days: 1
          if-no-files-found: error

  # Each sealed archive on a runner of its own platform, with no key and no environment: verified
  # against the root committed in this repository, installed into a store, and started.
  check:
    name: check ${{ matrix.target }}
    needs: [source, channel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
      RELEASE: ${{ needs.source.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Take the sealed archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed

      - name: Install rustup where the image has none
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build the release tool
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p kr-release

      - name: Unpack it, and verify it against the committed root
        run: |
          top="kalareach-$TARGET-$RELEASE"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$RUNNER_TEMP/sealed/$top.tar.gz"
          cmp "$RUNNER_TEMP/unpacked/$top/share/update-root.json" "$CHANNEL_ROOT"
          target/release/kr-release verify --tree "$RUNNER_TEMP/unpacked/$top" --root "$CHANNEL_ROOT"
          python3 scripts/check-release-archive.py check --archive "$RUNNER_TEMP/sealed/$top.tar.gz"
          python3 scripts/check-release-secrets.py scan "$RUNNER_TEMP/sealed/$top.tar.gz"

      - name: Hold each Mach-O file to a notarised Developer ID release
        if: runner.os == 'macOS'
        run: bash scripts/check-macos-signatures.sh "$RUNNER_TEMP/unpacked/kalareach-$TARGET-$RELEASE" notarized

      - name: Install it into a store, and start the host
        run: |
          top="kalareach-$TARGET-$RELEASE"
          unpacked="$RUNNER_TEMP/unpacked/$top"
          store="$RUNNER_TEMP/store"
          "$unpacked/bin/kr" host install --store "$store"
          "$store/current/bin/kr" --version
          for root in "$unpacked" "$store/versions/$RELEASE"; do
            identity="$(cat "$root/shells/zsh/current")"
            "$root/shells/zsh/$identity/bin/zsh" -f -c 'zmodload zsh/zle && print -r -- "zle loaded from $module_path[1]"'
          done
          bash scripts/check-host-start.sh "$store/current/bin/kr"

      - name: Record the digest that was checked
        run: |
          top="kalareach-$TARGET-$RELEASE"
          mkdir -p "$RUNNER_TEMP/verified"
          (cd "$RUNNER_TEMP/sealed" && { sha256sum "$top.tar.gz" 2>/dev/null || shasum -a 256 "$top.tar.gz"; }) > "$RUNNER_TEMP/verified/verified-$top.tar.gz.sha256"
          cat "$RUNNER_TEMP/verified/verified-$top.tar.gz.sha256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the digest that was checked
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.target }}
          path: ${{ runner.temp }}/verified
          retention-days: 1
          if-no-files-found: error

  # No key and no environment: only the right to write a release, and only after every check passed.
  publish:
    name: publish the release
    needs: [source, channel, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-host-publish
      cancel-in-progress: false
    env:
      RELEASE: ${{ needs.source.outputs.release }}
      COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Take the sealed archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sealed-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: Take the digests the checks recorded
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/verified
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-host-release.sh --repo "$GITHUB_REPOSITORY" --release "$RELEASE" --commit "$COMMIT" \
            --archives "$RUNNER_TEMP/archives" --verified "$RUNNER_TEMP/verified" --root "$CHANNEL_ROOT"
